<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--surface2:#ffffff;--border:#e3e2dd;--text:#0b0b0b;--text2:#52514e;--muted:#8a8985;
 --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
 --good:#008300;--warn:#c98500;--bad:#d1322f;--long:#fff3e8;--today:#e8f1fc}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface2:#222221;--border:#333330;--text:#fff;--text2:#c3c2b7;--muted:#8a8985;
 --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#3da53d;--s7:#9085e9;--s8:#e66767;--good:#3da53d;--warn:#e0a020;--bad:#e66767;--long:#2b2016;--today:#152238}}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--text)}
header{padding:18px 24px 0;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
header h1{margin:0 0 4px;font-size:20px}header .sub{color:var(--text2);font-size:13px}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{border:0;background:transparent;padding:10px 14px;font-size:14px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text);border-color:var(--s1);font-weight:600}
main{padding:20px 24px 60px;max-width:1400px;margin:0 auto}
section.tab{display:none}section.tab.active{display:block}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat{font-size:28px;font-weight:700;line-height:1.1}.stat small{font-size:13px;color:var(--text2);font-weight:400;margin-left:6px}
.sub{color:var(--text2);font-size:12.5px}
.chart{position:relative;height:260px}.chart.tall{height:340px}.chart.half{height:150px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{color:var(--text2);font-weight:600;font-size:12px}
tr.long{background:var(--long)}tr.today{background:var(--today)}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--text2)}
.badge.uy{border-color:var(--good);color:var(--good)}.badge.degistir{border-color:var(--warn);color:var(--warn)}.badge.atla{border-color:var(--bad);color:var(--bad)}.badge.long{background:var(--s2);color:#fff;border-color:var(--s2)}
.badge.done{background:var(--s3);color:#fff;border-color:var(--s3)}
.week{margin-bottom:18px}.week h2{font-size:16px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.week .bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;flex:1;max-width:260px}.week .bar i{display:block;height:100%;background:var(--s1)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;min-height:120px;font-size:12px}
.day.long{background:var(--long);border-color:var(--s2)}.day.today{outline:2px solid var(--s1)}.day.race{background:#fde9e9;border-color:var(--s8)}
.day .d{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}.day .c{color:var(--text2);margin:2px 0}.day .dec{margin-top:4px;padding-top:4px;border-top:1px dashed var(--border)}
.day .done{color:var(--good);font-weight:600}.conf{color:var(--warn);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv b{color:var(--text2);font-weight:500}
#map{height:420px;border-radius:10px}
.pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:12px}
.note{font-size:12.5px;color:var(--text2)}.hl{color:var(--s2);font-weight:600}
.legend{font-size:12px;color:var(--text2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
details summary{cursor:pointer;color:var(--s1);font-weight:600}
.big{font-size:15px}
@media(max-width:900px){.days{grid-template-columns:repeat(2,1fr)}}
nav{align-items:center;flex-wrap:wrap}
nav button.sec{font-size:12.5px;padding:8px 10px;color:var(--muted)}
nav .more{margin-left:auto;font-size:12.5px;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
nav .secwrap{display:none;width:100%;gap:2px;border-top:1px dashed var(--border);margin-top:4px;padding-top:4px}
nav .secwrap.open{display:flex;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.g{background:var(--good)}.dot.y{background:var(--warn)}.dot.r{background:var(--bad)}.dot.n{background:var(--muted)}
.hero{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero .today{border-color:var(--s1);border-width:2px}
.hero .today .title{font-size:22px;font-weight:700;margin:2px 0 6px}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week7 .d{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 6px;text-align:center;font-size:12px;min-height:74px}
.week7 .d.today{outline:2px solid var(--s1)}.week7 .d.long{background:var(--long)}.week7 .d .k{font-size:16px;font-weight:700}.week7 .d .lbl{color:var(--text2);font-size:11px}
.week7 .d.done{border-color:var(--s3)}
details.sec{margin-top:14px}details.sec>summary{cursor:pointer;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-weight:600;color:var(--text2);list-style:none}
details.sec>summary::before{content:"▸ ";color:var(--muted)}details.sec[open]>summary::before{content:"▾ "}
details.sec>summary:hover{color:var(--text)}details.sec>.body{margin-top:10px}
.card h3{text-transform:none;letter-spacing:0;font-size:13px}
.wk-compact{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;font-size:13px}
.wk-compact b{min-width:190px}.wk-compact .bar{flex:1;max-width:220px}
table.plan{table-layout:fixed}table.plan th:nth-child(1){width:88px}table.plan th:nth-child(2){width:30%}table.plan th:nth-child(4){width:22%}
table.plan td{padding:10px 8px;vertical-align:top}table.plan tr.today td{background:var(--today)}table.plan tr.long td{background:var(--long)}
table.plan .day{font-weight:700}table.plan .day small{display:block;font-weight:400;color:var(--text2)}
table.plan .coach{color:var(--text2)}table.plan .coach b{color:var(--text)}table.plan .str{font-size:11.5px;color:var(--muted);margin-top:3px}
table.plan .dec{font-weight:600}table.plan .dec .sub{font-weight:400;margin-top:3px}
table.plan .done{font-weight:600}table.plan .todo{color:var(--muted)}

</style>

 The Go Elektrolit tablet (Decathlon)", "carb": 0, "caffeine": 0, "sodium": 360, "note": "1 tablet / 500 ml. Etiket 0.9 g — tuz mu sodyum mu kontrol et (360–900 mg). Yarış ÖNCESİ ve uzun koşu SONRASI için, koşarken değil.", "verdict": "SADECE ÖNCE/SONRA", "why": "Koşarken içmek pratik değil (500 ml tablet suyu). Sabah ön-yükleme ve uzun koşu sonrası için iyi ve ucuz."}, {"name": "WUP Endu+race toz", "carb": 5, "caffeine": 150, "sodium": 730, "note": "500 ml'de: 5 g karb, 730 mg Na, 400 mg K, 200 mg Mg, 120 mg Ca, 150 mg kafein, C vit. Karb kaynağı DEĞİL; kafeinli elektrolit içeceği.", "verdict": "ÖNCESİ (test et)", "why": "Yarıştan 90 dk önce kahve + On The Go yerine tek içecek olabilir (kafein 150 + sodyum 730 = iyi ön-yükleme). Risk: 200 mg magnezyum bağırsağı gevşetebilir → 3 Ekim ve 17 Ekim'de dene. Kullanırsan yarışta CAF jel 2→1'e iner (km 29.5), kahve yok; toplam kafein 250 mg. Koşarken içme (500 ml/porsiyon pratik değil)."}], "principles": ["Hedef: koşarken 60 g karb/saat (Maurten 25 g → her 25 dk 1 jel). İlk hafta 30 g/sa'dan başla, mideyi antren et — bağırsak da kas gibi adapte olur (2–3 haftada).", "Sıvı: 400–500 ml/saat. Yarışta her istasyonda (2.5 km'de bir) 100–150 ml = 2–3 yudum. Susamayı bekleme.", "Sodyum: 300–500 mg/saat. Maurten jelde sodyum YOK → SaltStick şart. Kapsül her 45 dk (≈290 mg/sa) + istasyon suyu; kramp hissinde 2 FastChew.", "Kafein: yarışta toplam 3–4 mg/kg ≈ 200–260 mg. Sabah kahve (~80) + 2 CAF 100 jel = 280 mg üst sınır. Kafeine hassassan tek CAF (km 29.5).", "Jeli istasyondan 200–300 m ÖNCE al, istasyonda suyla bastır. Jel + izotonik içecek aynı anda = fazla şeker yoğunluğu → mide.", "Koşudan 2.5–3 saat önce kahvaltı: 1.5–2 g/kg karb = 100–130 g (beyaz ekmek + bal/reçel + muz, az lif, az yağ). Uzun koşularda aynı kahvaltıyı prova et.", "Koşu sonrası 30–60 dk içinde 1 g/kg karb + 25 g protein (süt+muz+yulaf, ya da pilav+tavuk). Uzun koşu sonrası 1 On The Go tablet.", "Yarış haftası Perş–Cmt karbonhidrat yükleme: 8–10 g/kg/gün = 530–660 g karb (pilav, makarna, ekmek, meyve suyu, bal). Lifi azalt. Cumartesi öğleden sonra hafif yemek, gece 21:30 yatak.", "Yarışta yeni HİÇBİR ŞEY yok: antrenmanda denenmemiş jel/içecek/kahvaltı yasak. İstasyondaki izotoniğe güvenme, kendi jelini taşı (8 jel + 4 kapsül = yarış kemeri/şort cebi)."], "test_schedule": [{"week": 1, "date": "2026-09-19", "run": "16 km (~1h45)", "carb": "~13 g/sa (gerçek)", "protocol": "1× Maurten Gel 100 @ 40'. Amaç: doku/tat/mide. Kafein yok, kapsül yok.", "pre": "Normal kahvaltı 2 sa önce.", "also": "GERÇEKLEŞEN: 19 km, jel @52' (plan 40'), mide sorunsuz, tuvalet molası jelden önce (km 3)."}, {"week": 2, "date": "2026-09-26", "run": "19 km (~2h00)", "carb": "~25 g/sa", "protocol": "2 jel: Maurten @ 35', SiS GO @ 75'. 1× SaltStick kapsül startta (suyla). Su her 20 dk (yumuşak matara 500 ml).", "pre": "90 dk önce 1 On The Go tablet / 500 ml. Kahvaltı 2.5 sa önce ~80 g karb.", "also": "Hangi jel mideye daha iyi oturdu → ana jel kararı."}, {"week": 3, "date": "2026-10-03", "run": "22 km (~2h20)", "carb": "~32 g/sa", "protocol": "3 jel @ 30/60/90': Maurten, Maurten, CAF 100 (WUP ile birlikte toplam 250 mg kafein testi). SaltStick @ 0' ve 60'. 400 ml/sa su.", "pre": "YARIŞ KAHVALTISI PROVASI: 3 sa önce 100–130 g karb. Ön-yükleme testi: 90 dk önce 500 ml WUP (kahve yok). Mide/bağırsak/nabız notu.", "also": "Kafein sonrası nabız/mide/tuvalet notu al. Adios Pro 4 son 5 km (mümkünse)."}, {"week": 4, "date": "2026-10-10", "run": "25 km (~2h35)", "carb": "~47 g/sa", "protocol": "5 jel @ 25/50/75/100/125': Maurten ×4 + CAF 100 @ 100'. SaltStick @ 0/45/90/135'. 450 ml/sa. FastChews cepte (kramp olursa).", "pre": "Yarış kahvaltısı 3 sa önce. On The Go 90 dk önce.", "also": "Bu koşudan sonra hâlâ mide sorunu varsa yarış hedefi 45 g/sa'ya iner (6 jel)."}, {"week": 5, "date": "2026-10-17", "run": "28 km / 2h50 — HAKEM", "carb": "~58 g/sa", "protocol": "TAM YARIŞ PROVASI: 7 jel her 25' (25/50/75/100/125/150/175'): Maurten ×5 + CAF 100 @ 100' ve @ 150'. SaltStick @ 0/45/90/135/180'. 450–500 ml/sa. Jeli yarış kemerinde taşı. Son 10–12 km Adios Pro 4.", "pre": "Yarış sabahı birebir: 05:45 kalk, 06:00 kahvaltı, 07:30 ön-yükleme (3 Ekim'de hangisi iyi geldiyse: WUP ya da kahve+On The Go), 08:45 start. Cuma akşam karb ağırlıklı yemek.", "also": "Sonrasında 1 saat içinde 70 g karb + 25 g protein + On The Go tablet. Ertesi gün tartıda kilo kaybı >%2 ise yarışta sıvıyı artır."}, {"week": 6, "date": "2026-10-24", "run": "14 km kolay", "carb": "~17 g/sa", "protocol": "1× Maurten @ 40' (rutin korunsun). Kapsül yok.", "pre": "Yarış kahvaltısı (son prova).", "also": "Hafta içi: kafeinsiz."}, {"week": 7, "date": "2026-11-01", "run": "YARIŞ 42.2 km", "carb": "~53 g/sa", "protocol": "Aşağıdaki yarış günü çizelgesi.", "pre": "Perş–Cmt karb yükleme 530–660 g/gün.", "also": "Cuma kit al; Cumartesi 20 dk shakeout, kafein yok (yarışta etkisi artsın)."}], "race_day": [["05:45", "Kalk. Seçenek A: 500 ml su + 1 On The Go tablet (07:00'ye kadar). Seçenek B (3 Ekim'de iyi gittiyse): 07:30'da 500 ml WUP, kahve yok."], ["06:00", "Kahvaltı (3 sa önce): 3 dilim beyaz ekmek + bal/reçel + 1 muz (~120 g karb) + kahve (sadece Seçenek A). Yağ/lif/süt yok."], ["07:15", "Evden çık. Yanında 200 ml su."], ["08:15", "Kapıda. Son tuvalet. 1 SaltStick kapsül + birkaç yudum su."], ["08:45", "Kapıya gir. Jel yok; istersen 08:55'te 1 Maurten."], ["km 5.5", "Jel 1 → 5.8 istasyonu su (10–15 sn yürü). Barbaros inişi bitti."], ["km 10", "Jel 2 → 10.3 istasyonu su. SaltStick 2."], ["km 14", "Jel 3 (susuz — Maurten için sorun değil)."], ["km 19", "Jel 4: A → CAF 100 / B → düz Maurten → 19.1 istasyonu su. SaltStick 3."], ["km 22", "Jel 5 → 22.5 istasyonu su."], ["km 25", "Jel 6 → 25.3 istasyonu su. Dönüş noktası."], ["km 29.5", "Jel 7 (CAF 100) → 29.7 istasyonu su. SaltStick 4. Asıl sınav."], ["km 33.5", "Jel 8 → 35.5 istasyonu su. Kramp sinyali varsa 2 FastChew."], ["km 37.5", "Jel 9 (mide izin veriyorsa; yoksa yarım) → 37.8 istasyonu."], ["km 39.9", "Son istasyon: su. Gülhane tırmanışı öncesi 2 yudum."], ["Bitiş +30 dk", "500 ml su + On The Go tablet, muz. 1 sa içinde gerçek yemek."]], "race_totals": "9 jel = 225 g karb (~53 g/sa, 4:15 için) + istasyon içeceği ≈ 55–60 g/sa · kafein A: kahve 80 + 2 CAF 200 = 280 mg / B: WUP 150 + 1 CAF 100 = 250 mg (~4 mg/kg) · sodyum 4 kapsül 860 mg + ön-yükleme · sıvı ~1.8–2 L. Taşınacak: 9 jel, 4 kapsül, 4 FastChew. (Dış göz düzeltmesi: 8 jel 47 g/sa'ya denk geliyordu → 9.)", "carry": "Yol maratonunda yelek gerekmez (2.5 km'de bir istasyon var); tek iş 8 jel + 4 kapsül taşımak. Öneri: bel kemeri (Naked/FlipBelt tipi, elastik, 4+ bölme) — 6 Maurten ön/yan, 2 CAF arkada ayrı bölme, kapsüller zip torbada. Boş ambalajı aynı cebe geri koy.", "decision": "Çekirdek set 3 ürün: Maurten Gel 100 (enerji) + Maurten CAF 100 (kafein) + SaltStick kapsül (sodyum). Ön-yükleme için iki seçenek: A) kahve + On The Go tablet + 2 CAF jel, B) WUP (kafein 150) + 1 CAF jel — B'yi 3 Ekim'de test et, iyi giderse yarışta B. Gerisi yedek.", "carry_options": [["Bel kemeri + şort cebi", "Hafif, sıçramaz, üst gövde serbest, 8 jel sığar", "Satın alma + prova gerekir", "ÖNERİ — 3 Ekim'e kadar al, 3/10/17 Ekim'de dene"], ["Sadece şort cepleri", "Ekipman yok", "8 Maurten için 4–5 cep lazım; çoğu şortta 2–3, sallanır", "5+ cepli şort varsa olur — 19 Eylül'de dene"], ["Salomon ADV Skin 5", "Zaten var, jel elinin altında", "~300 g, omuz/göğüs sürtünmesi 4 saatte ciddi, ısı tutar, boş matara cepleri sallanır", "YEDEK — 26 Eylül'de boş mataralarla dene; kemer kötü giderse yarışta bu"], ["İstasyona güvenmek", "—", "İstanbul istasyonlarında jel garanti değil", "HAYIR"]], "carry_test": "19 Eyl şort cebi → 26 Eyl ADV Skin 5 (boş matara, sadece jel) → 3 & 10 Eki kemer → 17 Eki tam prova: 2 saatten sonra varlığını unuttuğun sistem yarışta o."}, "glossary": [["Temel (Base)", "Kolay aerobik koşu, HR 140–150, konuşabilirsin. Antrenmanın %75–80'i bu. Mitokondri, kılcal damar, yağ yakımı — maratonun temeli."], ["Toparlanma (Recovery)", "Çok kolay koşu, HR ≤140. Amaç adaptasyon değil kan dolaşımı; zor günün ertesinde. Yavaş gitmek beceri ister."], ["Eşik (Lactate Threshold)", "Laktatın birikmeye başladığı yoğunluk; sende HR ~180, pace ~5:15. 20–40 dk 'rahatsız ama sürdürülebilir' tempo. Maraton temposunu ucuzlatır."], ["Tempo", "Eşiğin hemen altında, 20–30 dk sürekli (sen 14 Eyl'de 5.5 km @ 5:04, HR 173). Eşik ile aynı aile; haftada toplam 1 tane yeter."], ["Maraton temposu (MP)", "Yarışta tutacağın tempo: 5:40 (4:00) / 5:58 (4:15) / 6:20 (4:30). Uzun koşuların sonunda 3–7 km MP bloğu = yarış simülasyonu."], ["Anaerobik kapasite", "60–90 sn tam gaz tekrarlar (Coach: 7×1' @ 4:05). Laktat toleransı, 1500–5K finali. Maratona faydası ≈0, sakatlık riski yüksek → strides'a çeviriyoruz."], ["VO2max seansı", "3–5 dk tekrarlar @ ~4:35–4:50 (5K temposu civarı), eşit dinlenme. Oksijen kullanım tavanını iter. Build'de kısaltılır, taper'da atlanır."], ["Strides", "6–8 × 15–20 sn kontrollü hızlanma (%85–90, ~4:30–4:45/km), tam dinlenme. Laktat birikmez, form/kadans/sinir-kas uyarımı. Ertesi gün taze."], ["Uzun koşu", "Haftanın en uzun koşusu, HR ≤155–158, 2–3 saat. Kas dayanıklılığı, glikojen ekonomisi, bağırsak antrenmanı, zihinsel hazırlık. Pik 28 km (17 Eki)."], ["Koş-yürü (Galloway)", "Planlı yürüyüş molaları (örn. 5 dk koş / 1 dk yürü). Pes değil strateji; 28 km hakem koşusunda ve gerekirse yarışta km 30+."], ["Drift / decoupling", "Sabit eforda pace'in HR'a göre bozulması. İlk yarı vs ikinci yarı (hız/HR) farkı; <%5 = aerobik taban o mesafeye yetiyor."], ["Training Effect (TE)", "Garmin 0–5: 2–3 koruma, 3–4 geliştirme, 4–5 aşırı yükleme. Uzun koşu 3.2–3.8, eşik 3.5–4.2 beklenir."], ["ATL / CTL / TSB", "ATL = 7 günlük yorgunluk, CTL = 42 günlük fitness, TSB = CTL−ATL = form. Build'de TSB −50…−150 normal; yarış günü +15…+25 hedef."], ["ACWR", "Akut/kronik yük oranı (ATL/CTL). 0.8–1.3 optimal, >1.5 sakatlık riski. Haftalık %10 kuralının ölçülebilir hali."], ["Running tolerance", "Garmin'in 'bu hafta kaç km taşıyabilirsin' tahmini (sende 65). Haftalık km bunun altındaysa güvenli."], ["Readiness", "Uyku + HRV + toparlanma + yük + stres bileşkesi (0–100). <40 → o gün yoğun seans yok, kolay koşuya çevir."], ["HRV", "Kalp atım aralığı değişkenliği; yüksek ve stabil = toparlanmış. 7 günlük bazdan 10 ms düşüş = yükü azalt sinyali."], ["Taper", "Yarıştan 2–3 hafta önce hacmi %30–50 azaltıp yoğunluğu koruma. Fitness kaybolmaz, yorgunluk gider; performans +%2–3."], ["Karb yükleme", "Yarıştan 2–3 gün önce 8–10 g/kg/gün karbonhidrat (530–660 g). Glikojen depolarını doldurur; 'duvar'ı öteler."], ["Bağırsak antrenmanı", "Koşarken karbonhidrat alımına mideyi alıştırma: 30 → 60 g/sa'a 3–4 haftada kademeli çıkış. Jel toleransı öğrenilir."]], "finish_distribution": [["<4:00", 12], ["4:00–4:15", 28], ["4:15–4:30", 37], ["4:30+", 23]], "review": {"date": "2026-09-18", "method": "6 paralel araştırma lensi (koçluk felsefeleri · hakemli spor bilimi · Garmin Coach kullanıcıları · ilk-maraton topluluğu/İstanbul raporları · aykırı yaklaşımlar + gerçekçi hedef · yarış günü uygulama) → ~350 kaynak. Dosyalar: research/01–06.", "matrix": [["1. 13→30 km / 5 hf", "❌ 12 sistemin hiçbiri", "⚠ tablo içi OK; ilk sıçrama %37 riskli", "⚠ hız", "⚠ hız", "❌ 26–27 + 3 hf", "DEĞİŞTİRİLDİ → 16/19/22/25/28"], ["2. Pik 15 gün önce", "⚠ bölünmüş", "✅ 2 hf yeter (3 hf +%0.2)", "⚠ Coach taper'ı güvenilmez", "⚠ sınırda", "❌ 3 hf", "KORUNDU (pik 28 km ile risk düştü)"], ["3. Haftada 1 kalite", "✅", "✅ RCT'ler", "✅", "✅", "✅", "KORUNDU"], ["4. Anaerobik→strides", "✅ en az tartışmalı", "nötr", "✅ Coach zaten teslim edemiyor", "✅", "✅", "KORUNDU"], ["5. 60 g/sa karb", "✅ 'yarışta yeni şey yok'", "✅", "–", "✅ 90 riskli", "–", "KORUNDU; 8→9 jel"], ["6. 4:00 hedefi", "❌ 'gerçekçi değil'", "❌ Fokkema", "❌ Garmin +15–45 dk", "❌", "❌ %12", "Koşullu bonus (C)"], ["7. HR tavanlı uzun koşu", "⚠ pace+HR", "✅ tavan olarak", "✅", "✅", "✅", "Yeniden çerçevelendi: pace birincil + HR tavan"], ["8. Kolay HR 150→145", "✅ 3 model 148–152", "✅", "✅", "✅", "✅ MAF=146", "DEĞİŞTİRİLDİ → 140–146, tavan 148"]], "lenses": ["Koçlar", "Bilim", "Garmin kull.", "Topluluk", "Aykırılar", "Karar"], "adopted": ["Uzun koşu progresyonu 16→19→22→25→28 seçildi (Y). Gerçekleşen: 19 Eyl 19 km (plan 16 — kullanıcı aştı) → progresyon 21→23→25→28 olarak yeniden hizalandı.", "Kolay koşu HR 140–146, sert tavan 148 (Fitzgerald %77–79 HRmax, MAF 180−29=151, McMillan %75–80, Pfitzinger GA: kesişim ~148–152).", "Uzun koşu: pace birincil + HR 155 güvenlik tavanı (sabit-HR koşusu uzun vadede daha zayıf uyum — kardiyak drift literatürü).", "Hakem koşusu kriterinden 'drift <%5' çıkarıldı (hakemli doğrulaması yok; Hunter & Muniz-Pumares 2025 r=−0.06) → MP bloğunu HR ≤163'te tutmak + 48 sa toparlanma.", "9 jel (225 g, ~53 g/sa) — 8 jel 47 g/sa'ya denk geliyordu, son 9 km jelsizdi.", "İstasyonlarda 10–15 sn planlı yürüyüş; kuvvet günlerine step-down/lunge; eşik pace'i LT 5:15'e göre; yarış haftası Salı 2 km MP dokunuşu.", "Gerçekçi bitiş dağılımı: <4:00 %12 · 4:00–4:15 %28 · 4:15–4:30 %37 · 4:30+ %23 (VDOT 5K→3:58, 10K→4:07, Riegel 15K→4:22, tempo+40–75 sn→4:02–4:27; Smyth 2018: koşucuların %58'i tahminden yavaş bitiriyor; Garmin ilk maratoncuda +15–45 dk iyimser).", "'İyi hissedersem üzerine koyayım mı?' → HAYIR: uzun koşu +1 km max; fazlayı hafta içine koy. Tendon/kemik adaptasyonu kardiyodan 2–3 hafta geride."], "rejected": ["Pik 26–27 km + 3 haftalık taper (aykırılar/koçların bir kısmı) — Bosquet 2007 (27 çalışma) ve Smyth&Lawlor 2021 (158K koşucu): 2 hf/%41–60 azaltım optimal, 3 hf sadece +%0.1–0.2. Pik 28'e çekilince 2 hf yeterli; kullanıcı Y'yi seçti.", "Tam Hansons / FIRST / Galloway / MAF / Norwegian singles / Canova sistemleri — yanlış hacim segmenti veya hedef kitle.", "Ayrı iniş antrenmanı — Barbaros %5.6 × 1.2 km, EIMD eşiğinin (median −%12 / 40 dk) çok altında (Bontemps 2020).", "Isı aklimasyonu — 1 Kasım İstanbul ort. 15–16°C, %73 nem, 23 km/sa rüzgâr: ideal; asıl risk soğuk start + yağmur.", "90 g/sa karb — haftalarca bağırsak antrenmanı ister; gerçek dünya alımı ort. 23–71 g/sa; iki Türk koşucu GI raporu.", "Kafein kesme haftası — PF&H caydırıyor (kesilme semptomları > küçük fayda).", "Garmin race predictor'a plan yapmak — 3:05 tahmin → 3:17 gerçek gibi vakalar; 'much less reliable for first marathon'."], "istanbul": ["İstasyonlarda ELEKTROLİT YOK; su/muz/portakal ~5 km'de bir; yavaş koşucular için orta-geç parkurda su bitmesi raporları → kendi jel+kapsül stratejisi doğru.", "Köprü soğuk+rüzgârlı; start 'kaotik', erken git. Köprüde kalabalık nedeniyle ilk km'de hızlı koşmak zaten mümkün değil.", "Gülhane finiş tırmanışı defalarca 'en zor kısım'; temkinli koşanlar için yıkıcı değil.", "2023 raporu (3:57, 5:15→5:55 pozitif split, 25. km'de 'bacaklar taş', jel fazlalığı mide): profilimize birebir uyarı.", "GAP: km 2–4 (%3.3) tırmanışta eş-efor pace ~7:00/km — yavaşla; km 4–6 inişte (%5.6) 4:26 'bedava' olsa da fren yap, quad koru.", "Resmi pacer var ama İstanbul'a özel güvenilirlik verisi yok; kendi planına sadık kal."], "open": ["Start kapısı/bib grubu, bagaj saati, ulaşım: resmi sporcu rehberi yayınlanınca (yarıştan 1–2 hafta önce) kontrol.", "Adios Pro 4 teslimatı → numara kontrolü → Test 1 (Ayakkabı tab'ı protokolü)."], "files": [["01-coaching-philosophies.md", "84 kaynak — Higdon, Pfitzinger, Daniels, Hansons, Galloway, McMillan, Lydiard, Fitzgerald, Canova, Magness, YouTube koçları, 3 acil plan"], ["02-sports-science.md", "~70 hakemli — Fokkema 2020, Nielsen 2014, Damsted 2019, Bosquet 2007, Smyth&Lawlor 2021, Jeukendrup, Desbrow 2012, Noakes 2005, Hunter 2025, Bontemps 2020, Esteve-Lanao/Muñoz, Santos-Lozano 2014, Lauersen 2014"], ["03-garmin-coach-users.md", "19 kaynak — forums.garmin.com, the5krunner, trainbydata, DC Rainmaker"], ["04-community-race-reports.md", "LetsRun, Koşu Forum, Ekşi, Medium (TR/EN yarış raporları), RaceRaves/Racecheck İstanbul"], ["05-alternatives-and-goal.md", "101 kaynak — Hansons/FIRST/Galloway/MAF/Norwegian/Canova, VDOT/Riegel hesapları, BJSM 5.200 k <script>
const M=window.M; const P=M.plan;
const TABS=[["bugun","Bugün"],["plan","Plan"],["uzun","Uzun Koşular"],["fitness","Fitness"]];
const TABS2=[["beslenme","Beslenme"],["ayakkabi","Ayakkabı"],["parkur","Parkur & Strateji"],["coach","Coach Kuralları"],["disgoz","Dış Göz"],["gecmis","Geçmiş"],["log","Log"],["ozet","Özet (eski)"]];
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const C={s1:css('--s1'),s2:css('--s2'),s3:css('--s3'),s4:css('--s4'),s5:css('--s5'),s6:css('--s6'),s7:css('--s7'),s8:css('--s8'),text:css('--text2'),grid:css('--border')};
Chart.defaults.color=C.text;Chart.defaults.borderColor=C.grid;Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;Chart.defaults.font.size=12;
Chart.defaults.plugins.legend.labels.boxWidth=10;Chart.defaults.elements.line.borderWidth=2;Chart.defaults.elements.point.radius=3;Chart.defaults.elements.bar.borderRadius=4;
const fmtD=d=>{const [y,m,dd]=d.split('-');return `${+dd} ${['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'][+m-1]}`};
const pace=p=>p?`${Math.floor(p)}:${String(Math.round((p%1)*60)).padStart(2,'0')}`:'-';
const h=(s)=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstChild};
document.getElementById('hdr').textContent=`Yarış: 1 Kasım 2026 09:00 · Kalan: ${M.days_to_race} gün · Veri: ${M.latest.date} · Üretim: ${M.generated}`;

// ---------- Tabs
const nav=document.getElementById('nav'),main=document.getElementById('main');
TABS.forEach(([id,label])=>{const b=h(`<button data-t="${id}">${label}</button>`);b.onclick=()=>show(id);nav.appendChild(b);main.appendChild(h(`<section class="tab" id="t-${id}"></section>`))});
const more=h(`<button class="more">Diğer ▾</button>`);nav.appendChild(more);const secwrap=h(`<div class="secwrap"></div>`);nav.appendChild(secwrap);
more.onclick=()=>{secwrap.classList.toggle('open');more.textContent=secwrap.classList.contains('open')?'Diğer ▴':'Diğer ▾'};
TABS2.forEach(([id,label])=>{const b=h(`<button class="sec" data-t="${id}">${label}</button>`);b.onclick=()=>show(id);secwrap.appendChild(b);main.appendChild(h(`<section class="tab" id="t-${id}"></section>`))});
const rendered={};
function show(id){if(!R[id])id='bugun';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.t===id));if(TABS2.some(x=>x[0]===id)){secwrap.classList.add('open');more.textContent='Diğer ▴'}document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('active',s.id==='t-'+id));if(!rendered[id]){rendered[id]=1;R[id](document.getElementById('t-'+id))}location.hash=id}
// tek eksen kuralı: iki ölçü = alt alta iki grafik, aynı x
function pair(sel,labels,a,b){const el=document.querySelector(sel);el.innerHTML='<div class="chart half"><canvas></canvas></div><div class="chart half"><canvas></canvas></div>';const [c1,c2]=el.querySelectorAll('canvas');
 new Chart(c1,{type:a.type||'line',data:{labels,datasets:[a.ds]},options:{maintainAspectRatio:false,spanGaps:true,plugins:{legend:{display:false},title:{display:true,text:a.title,align:'start',font:{size:12}}},scales:{x:{display:false},y:Object.assign({title:{display:true,text:a.unit||''}},a.y||{})}}});
 new Chart(c2,{type:b.type||'line',data:{labels,datasets:[b.ds]},options:{maintainAspectRatio:false,spanGaps:true,plugins:{legend:{display:false},title:{display:true,text:b.title,align:'start',font:{size:12}}},scales:{y:Object.assign({title:{display:true,text:b.unit||''}},b.y||{})}}});}
// ayakkabı eşlemesi (seans tipi → ayakkabı)
const shoeFor=(cw,isLong)=>{if(isLong)return 'Vomero Plus (MP bloğu: Adios Pro 4)';if(!cw)return null;const ty=cw.type||'';if(/LACTATE|TEMPO|STRIDES|ANAEROBIC|VO2/.test(ty))return 'Vomero Plus (7 Eki: Adios)';if(/BASE|RECOVERY|LONG/.test(ty))return 'Vomero Plus';return null};
const R={};

// ---------- BUGÜN
const st=(v,g,y,rev)=>{if(v==null)return 'n';if(rev)return v<=g?'g':v<=y?'y':'r';return v>=g?'g':v>=y?'y':'r'};
const sessionText=c=>{if(!c)return '<div class="sub">Plan dışı gün</div>';let s='';
 if(c.is_race)s+='<div class="title hl">🏁 YARIŞ GÜNÜ</div>';
 if(c.is_long){const w=P.weeks.find(x=>x.long_date===c.date);s+=`<div class="title">Uzun koşu · ${w.long_km} km</div><div>${w.long_brief}</div><div class="hl" style="margin-top:4px">🍯 ${w.fuel||''}</div>`}
 const mine=c.coach.filter(x=>x.source==='mine'),coach=c.coach.filter(x=>x.source!=='mine');
 mine.forEach(w=>{s+=`<div class="title">${w.name.replace(' (benim)','')}</div><div>${w.target||''}</div>`});
 coach.forEach(w=>{const ov=w.target?`<div style="margin-top:4px"><b>Karar:</b> ${w.target}</div>`:'';s+=`<div style="margin-top:6px"><span class="sub">Coach: ${w.name}${w.est_km?' '+w.est_km+' km':''}${w.est_min?' · '+w.est_min+' dk':''}</span> <span class="badge ${cls(w.rule)}">${w.rule}</span>${ov}</div>`});
 if(!c.coach.length&&!c.is_long&&!c.is_race)s+='<div class="sub">Coach seansı henüz yok — plana göre kolay koşu HR ≤148 veya dinlenme</div>';
 const sh=shoeFor(c.coach.find(x=>x.sport==='running'),c.is_long);if(sh&&!c.is_race)s+=`<div class="sub" style="margin-top:6px">👟 ${sh}</div>`;
 c.done.forEach(a=>{s+=`<div class="done" style="margin-top:6px">✓ ${a.name.replace('Sapanca - ','').replace('Kadıköy - ','')} ${a.km?a.km+' km · ':''}${a.min} dk${a.avg_hr?' · HR '+a.avg_hr:''}${a.km&&a.min?' · '+pace(a.min/a.km):''}</div>`});return s};
R.bugun=el=>{
 const L=M.latest,tc=M.today_card,tm=M.tomorrow_card;
 const cw=P.weeks.find(w=>w.status==='current')||P.weeks[0];
 const wkKm=cw.actual_km,pct=Math.min(100,Math.round(wkKm/cw.target_km*100));
 const dist=P.finish_distribution;const best=dist.reduce((a,b)=>b[1]>a[1]?b:a);
 el.innerHTML=`
 <div class="hero">
  <div class="card today"><h3>Bugün · ${fmtD(M.today)} ${tc?tc.dow:''} · Hafta ${tc?tc.week:'-'} · ${tc?tc.phase:''}</h3>${sessionText(tc)}</div>
  <div class="card"><h3>Yarın ${tm?tm.dow:''}</h3>${sessionText(tm)}</div>
 </div>
 <div class="grid g4" style="margin-top:14px">
  <div class="card"><h3><span class="dot ${st(L.readiness,60,40)}"></span>Readiness</h3><div class="stat">${L.readiness??'–'}</div><div class="sub">${L.recovery_h!=null?'toparlanma '+L.recovery_h+' sa':''} ${L.readiness_feedback?'· '+String(L.readiness_feedback).replace(/_/g,' ').toLowerCase():''}</div></div>
  <div class="card"><h3><span class="dot ${st(L.hrv,(L.hrv_weekly||70)-5,(L.hrv_weekly||70)-10)}"></span>HRV</h3><div class="stat">${L.hrv??'–'}<small>ms · baz ${L.hrv_weekly??'–'}</small></div><div class="sub">RHR ${L.rhr??'–'}</div></div>
  <div class="card"><h3><span class="dot ${st(L.sleep_h,7,6.3)}"></span>Uyku</h3><div class="stat">${L.sleep_h??'–'}<small>sa · skor ${L.sleep_score??'–'}</small></div><div class="sub">hedef ≥7.5 sa</div></div>
  <div class="card"><h3><span class="dot ${L.tsb==null?'n':L.tsb>-80?'g':L.tsb>-150?'y':'r'}"></span>Form (TSB)</h3><div class="stat">${L.tsb>0?'+':''}${L.tsb??'–'}</div><div class="sub">ATL ${L.atl} · CTL ${L.ctl} · ${L.status||''}</div></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>Bu hafta · ${fmtD(cw.start)}–${fmtD(cw.end)} · ${wkKm} / ${cw.target_km} km <span class="bar" style="display:inline-block;width:160px;height:8px;background:var(--border);border-radius:4px;vertical-align:middle;margin-left:8px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct>110?'var(--bad)':'var(--s1)'}"></i></span></h3>
  <div class="week7">${cw.days.map(d=>{const run=d.done.filter(a=>a.type==='running'||(a.name||'').includes('Çalıştır'));const km=run.reduce((s,a)=>s+(a.km||0),0);const c0=d.coach.find(x=>x.sport==='running');const tg=c0&&c0.target||'';const planned=d.is_long?cw.long_km+' km uzun':c0?(c0.source==='mine'?c0.name.replace(' (benim)','').replace(/\(.*$/,''):/^ATLA/.test(tg)?'Bisiklet / dinlenme':/^Kolay/i.test(tg)?tg.split('(')[0].split('HR')[0].trim():c0.name+(c0.est_km?' '+Math.round(c0.est_km)+' km':'')):'—';
   return `<div class="d ${d.is_today?'today':''} ${d.is_long?'long':''} ${run.length?'done':''}"><div class="lbl">${d.dow} ${fmtD(d.date).split(' ')[0]}</div>${run.length?`<div class="k">${km.toFixed(1)}</div><div class="lbl">km · HR ${run[0].avg_hr||'–'}</div>`:`<div class="k" style="color:var(--muted)">·</div><div class="lbl">${planned}</div>`}</div>`}).join('')}</div>
  <div class="note" style="margin-top:8px">${cw.notes}</div></div>
 <div class="grid g4" style="margin-top:14px">
  <div class="card"><h3>Yarışa</h3><div class="stat">${M.days_to_race}<small>gün</small></div><div class="sub">1 Kas 09:00</div></div>
  <div class="card"><h3>VO2max</h3><div class="stat">${L.vo2_precise||L.vo2}</div><div class="sub">Garmin tahmini ${L.race_pred?L.race_pred.marathon:'–'} (iyimser)</div></div>
  <div class="card"><h3>En uzun koşu</h3><div class="stat">${Math.max(...M.past_long.map(r=>r.km)).toFixed(1)}<small>km</small></div><div class="sub">hedef pik 28 km (17 Eki)</div></div>
  <div class="card"><h3>En olası bitiş</h3><div class="stat">${best[0]}</div><div class="sub">%${best[1]} · <4:00 %${dist[0][1]} · 4:30+ %${dist[3][1]}</div></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>Son not · ${M.log[0]?M.log[0].date:''}</h3><div>${M.log[0]?M.log[0].note:''}</div></div>
 <details class="sec"><summary>Genel değerlendirme, hedefler ve kurallar</summary><div class="body">
  <div class="grid g3">${P.goals.map(g=>`<div class="card"><h3>Hedef ${g.tier} — ${g.label}</h3><div class="stat">${g.time}</div><div class="sub">${g.pace}/km · ~%${Math.round(g.prob*100)}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:14px"><h3>Değerlendirme</h3><p><b>Motor hazır, şasi değil.</b> Kardiyovasküler kapasite (VO2max ${L.vo2}, eşik ~5:05/km, RHR ${L.rhr||48}) 4 saatlik maratona yeter; eksik olan <span class="hl">mesafe dayanıklılığı</span>. Tek öncelik: uzun koşuyu güvenle 28 km'ye çıkarmak. 17 Ekim hakem koşusu final hedefi belirler.</p></div>
  <div class="card" style="margin-top:14px"><h3>Kurallar</h3><ul>${P.global_rules.map(r=>`<li>${r}</li>`).join('')}</ul></div>
 </div></details>`;
};

R.ozet=el=>{

R.plan=el=>{
 el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="chart" id="c-weekplan"></div><div class="legend"><i style="background:${C.s1}"></i>hedef km <i style="background:${C.s3}"></i>gerçekleşen <i style="background:${C.s2}"></i>uzun koşu (plan) <i style="background:${C.s4}"></i>uzun koşu (gerçek)</div></div>`;
 const c=document.getElementById('c-weekplan');c.innerHTML='<canvas></canvas>';
 new Chart(c.firstChild,{type:'bar',data:{labels:P.weeks.map(w=>`H${w.n} ${fmtD(w.start)}`),datasets:[
  {label:'Hedef km',data:P.weeks.map(w=>w.target_km),backgroundColor:C.s1+'55',borderColor:C.s1,borderWidth:1},
  {label:'Gerçek km',data:P.weeks.map(w=>w.status==='future'?null:w.actual_km),backgroundColor:C.s3},
  {label:'Uzun (plan)',data:P.weeks.map(w=>w.long_km||null),type:'line',borderColor:C.s2,backgroundColor:C.s2,tension:.2},
  {label:'Uzun (gerçek)',data:P.weeks.map(w=>w.status==='future'?null:w.actual_long),type:'line',borderColor:C.s4,backgroundColor:C.s4,borderDash:[4,3]}]},
  options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{mode:'index'}},scales:{y:{title:{display:true,text:'km'},beginAtZero:true}}}});
 const cur=P.weeks.findIndex(w=>w.status==='current');
 P.weeks.forEach((w,wi)=>{
  const pct=Math.min(100,Math.round(w.actual_km/w.target_km*100));
  const expanded=(wi===cur||wi===cur+1);
  if(!expanded){el.appendChild(h(`<details class="sec"><summary>Hafta ${w.n} · ${fmtD(w.start)}–${fmtD(w.end)} · ${w.phase} · hedef ${w.target_km} km${w.status==='done'?` · gerçek ${w.actual_km} km`:''}${w.long_km?` · uzun ${w.long_km} km${w.actual_long&&w.status==='done'?' ('+w.actual_long+' ✓)':''}`:''}</summary><div class="body" id="wk-${w.n}"></div></details>`))}
  const wk=h(`<div class="week"><h2>Hafta ${w.n} · ${fmtD(w.start)}–${fmtD(w.end)} · <span class="badge">${w.phase}</span> <span class="sub">hedef ${w.target_km} km${w.status!=='future'?` · gerçek ${w.actual_km} km`:''}</span><div class="bar"><i style="width:${w.status==='future'?0:pct}%"></i></div>${w.long_km?`<span class="badge long">Uzun: ${w.long_km} km · ${fmtD(w.long_date)}</span>`:''}</h2>
   <div class="note" style="margin-bottom:8px">${w.notes}</div>
   <div class="card" style="padding:0 6px"><table class="plan"><tr><th>Gün</th><th>Garmin Coach</th><th>Karar (ne yapacaksın)</th><th>Yapıldı</th></tr></table></div></div>`);
  const tb=wk.querySelector('table');
  w.days.forEach(d=>{
   const runs=d.coach.filter(x=>x.sport==='running'&&x.source!=='mine'),mine=d.coach.filter(x=>x.source==='mine'),str=d.coach.filter(x=>x.sport!=='running');
   // Coach sütunu
   let coach=runs.map(c=>`<div><b>${c.name}</b>${c.est_km?' · '+c.est_km.toFixed(1)+' km':''}${c.est_min?' · '+c.est_min+' dk':''}</div>`).join('')||(d.is_race?'':'<span class="sub">—</span>');
   if(str.length)coach+=`<div class="str">+ ${str.map(s=>s.name.replace(' Antrenmanı','')).join(', ')}</div>`;
   // Karar sütunu
   let dec='';
   if(d.is_race)dec=`<div class="dec hl">🏁 YARIŞ — ${P.race_plan.morning[0]}, ${P.race_plan.morning[1]}</div>`;
   else if(d.is_long)dec=`<div class="dec">⭐ Uzun koşu <b>${w.long_km} km</b> <span class="badge ${!runs.length?'':runs.some(c=>c.est_km&&Math.abs(c.est_km-w.long_km)<1)?'uy':'degistir'}">${!runs.length?'plan':runs.some(c=>c.est_km&&Math.abs(c.est_km-w.long_km)<1)?'Coach ile aynı':'Coach yerine'}</span><details><summary class="sub">brifing</summary><div class="sub">${w.long_brief}<br>🍯 ${w.fuel||''}</div></details></div>`;
   else if(mine.length)dec=mine.map(m=>`<div class="dec">${m.name.replace(' (benim)','')} <span class="badge uy">Garmin'de</span><div class="sub">${m.target||''}</div></div>`).join('');
   else if(runs.length){const c=runs[0];const tg=c.target||'';
     if(/^ATLA/.test(tg))dec=`<div class="dec">Atla <span class="badge atla">ATLA</span><div class="sub">${tg.replace(/^ATLA[^→]*→\s*/,'')}</div></div>`;
     else if(tg){const ttl=tg.split('(')[0].split(' — ')[0].trim();dec=`<div class="dec">${ttl} <span class="badge ${cls(c.rule)}">${c.rule}</span>${ttl===tg.trim()?'':`<div class="sub">${tg}</div>`}</div>`;}
     else if(/DEĞİŞTİR/.test(c.rule))dec=`<div class="dec">${c.conflict?c.conflict.replace(/^→\s*/,''):'Değiştir'} <span class="badge degistir">${c.rule}</span></div>`;
     else dec=`<div class="dec">Coach'a uy <span class="badge uy">${c.rule}</span><div class="sub">${/BASE|RECOVERY/.test(c.type)?'Kolay, HR ≤148, konuşabilecek tempo':''}</div></div>`;}
   else if(d.date<M.today)dec='<span class="sub">—</span>';
   else dec='<div class="dec sub">Coach seansı henüz yok — kolay koşu veya dinlenme</div>';
   const sh=shoeFor(runs[0]||mine[0],d.is_long);if(sh&&!d.is_race&&(runs.length||mine.length||d.is_long))dec+=`<div class="sub">👟 ${sh}</div>`;
   // Yapıldı
   const done=d.done.map(a=>`<div class="done">✓ ${a.name.replace('Sapanca - ','').replace('Kadıköy - ','').replace(/\s*\(.*$/,'')}<div class="sub">${a.km?a.km+' km · ':''}${a.min} dk${a.avg_hr?' · HR '+a.avg_hr:''}${a.km&&a.min&&a.type!=='cycling'?' · '+pace(a.min/a.km):''}</div></div>`).join('')||(d.date<M.today?'<span class="todo">koşu yok</span>':'');
   tb.appendChild(h(`<tr class="${d.is_today?'today':''} ${d.is_long?'long':''}"><td class="day">${d.dow}<small>${fmtD(d.date)}${d.is_today?' · bugün':''}</small></td><td class="coach">${coach}</td><td>${dec}</td><td>${done}</td></tr>`));
  });
  (expanded?el:document.getElementById('wk-'+w.n)).appendChild(wk);
 });
 el.appendChild(h(`<details class="sec"><summary>Genel kurallar</summary><div class="body"><div class="card"><ul>${P.global_rules.map(r=>`<li>${r}</li>`).join('')}</ul></div></div></details>`));
};

 el.innerHTML=`<div class="grid g2">

 <details class="sec"><summary>Geçmiş uzun koşular ve split analizleri</summary><div class="body">

  <div class="card" style="margin-top:14px"><table><tr><th>Tarih</th><th>km</th><th>Süre</th><th>Pace</th><th>Ort HR</th><th>Max</th><th>Drift</th><th>Not</th></tr>
  ${past.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.km}</td><td>${Math.floor(r.min/60)}:${String(Math.round(r.min%60)).padStart(2,'0')}</td><td>${r.pace_str}</td><td>${r.avg_hr}</td><td>${r.max_hr}</td><td>${r.drift_pct!=null?r.drift_pct+'%':'–'}</td><td class="sub">${r.note||lrNote(r)}</td></tr>`).join('')}</table></div>
  <div id="splits"></div></div></details>`;
 new Chart(document.querySelector('#c-lp canvas'),{type:'line',data:{labels:M.long_prog.map(x=>`H${x.week} ${fmtD(x.date)}`),datasets:[
  {label:'Plan',data:M.long_prog.map(x=>x.plan_km),borderColor:C.s2,backgroundColor:C.s2,tension:.2},

  options:{maintainAspectRatio:false,scales:{y:{beginAtZero:true,title:{display:true,text:'km'}}}}});
 new Chart(document.querySelector('#c-pl canvas'),{type:'bubble',data:{datasets:[{label:'Uzun koşu',data:past.map(r=>({x:r.date,y:r.km,r:Math.max(4,(r.avg_hr-130)/3),hr:r.avg_hr,p:r.pace_str})),backgroundColor:past.map(r=>r.avg_hr>165?C.s8+'99':r.avg_hr>158?C.s4+'99':C.s3+'99'),borderColor:past.map(r=>r.avg_hr>165?C.s8:r.avg_hr>158?C.s4:C.s3)}]},
  options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.raw.x}: ${c.raw.y} km · ${c.raw.p}/km · HR ${c.raw.hr}`}}},scales:{x:{type:'category',labels:past.map(r=>r.date),ticks:{callback:(v,i)=>fmtD(past[i].date)}},y:{beginAtZero:true,title:{display:true,text:'km'}}}}});
 // splits
 const sp=document.getElementById('splits');
 M.activities.filter(a=>a.splits).forEach(a=>{
  const id='sp'+a.id;sp.appendChild(h(`<div class="card" style="margin-top:14px"><h3>${a.name} · ${a.date} · ${a.km} km · TE ${a.training_effect} (${a.te_label}) ${a.drift_pct!=null?'· drift '+a.drift_pct+'%':''}</h3><div id="${id}"></div>${a.weather?`<div class="sub">Hava: ${a.weather}</div>`:''}</div>`));

 });
