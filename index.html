<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Maraton Paneli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{color-scheme:light;--bg:#f4f4f2;--surface:#fcfcfb;--surface2:#fff;--border:#e3e2dd;--text:#0b0b0b;--text2:#52514e;--muted:#6f6e6a;
 --s1:#2a78d6;--s1l:#9ec5f4;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;--goodtx:#006300;--badtx:#b02a2a;--warntx:#8a5a00;
 --k-easy:#2a78d6;--k-long:#eb6834;--k-quality:#4a3aa7;--k-race:#e87ba4;--k-rest:#b9b8b3;--tint:#eef4fc}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface2:#222221;--border:#333330;--text:#fff;--text2:#c3c2b7;--muted:#8a8985;
 --s1:#3987e5;--s1l:#184f95;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --goodtx:#3da53d;--badtx:#e66767;--warntx:#e0a020;--k-easy:#3987e5;--k-long:#d95926;--k-quality:#9085e9;--k-race:#d55181;--k-rest:#5a5955;--tint:#152238}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1000}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 16px 0}
.htop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.htop h1{margin:0;font-size:17px}.htop .sub{color:var(--text2);font-size:12.5px}
.count{margin-left:auto;font-weight:700;font-size:15px}.count small{font-weight:400;color:var(--text2);font-size:12px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:9px 12px;font-size:14.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text);border-color:var(--s1);font-weight:650}
main{max-width:1100px;margin:0 auto;padding:14px 16px 70px}
section.view{display:none}section.view.active{display:block}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;min-width:0}
.grid>.card{margin-bottom:0}.grid{margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--text2);font-weight:650;letter-spacing:.01em}
.card h4{margin:12px 0 4px;font-size:12.5px;color:var(--text2);font-weight:650}
.sub{color:var(--text2);font-size:12.5px}.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
/* hero */
.hero{border-left:6px solid var(--k-easy);padding:16px 18px}
.hero.k-long{border-left-color:var(--k-long)}.hero.k-quality{border-left-color:var(--k-quality)}.hero.k-rest{border-left-color:var(--k-rest)}.hero.k-race{border-left-color:var(--k-race)}
.hero .title{font-size:25px;font-weight:750;line-height:1.2;margin:4px 0 10px}
.c3{margin:6px 0 2px}.c3 .l{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border)}.c3 .l:last-child{border-bottom:0}.c3 .k{flex:0 0 64px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}.c3 .v{font-size:18px;font-weight:650;line-height:1.3}
@media(max-width:640px){.c3 .v{font-size:16px}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.cap{border-color:var(--text2)}.chip.kind{background:var(--tint)}
ol.struct{margin:0 0 10px;padding-left:20px}ol.struct li{margin:3px 0}ol.struct ol.struct{margin:4px 0}
.why{font-size:13.5px;color:var(--text2);margin:6px 0}
.flex{font-size:13px;background:var(--tint);border-radius:8px;padding:7px 10px;margin:8px 0}
.fuel{font-size:13px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coachwas{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.garmin{font-size:13px;margin-top:6px}
.pol{font-size:12px;font-weight:650;color:var(--text2);background:var(--tint);border-radius:5px;padding:0 5px}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-weight:650;font-size:13px}
.st::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.st.g::before{background:var(--good)}.st.y::before{background:var(--warn)}.st.r::before{background:var(--bad)}.st.n::before{background:var(--muted)}
.st.g{color:var(--goodtx)}.st.y{color:var(--warntx)}.st.r{color:var(--badtx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:8px}
.tile{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-width:0}
.tile .k{font-size:11.5px;color:var(--text2)}.tile .v{font-size:20px;font-weight:700;line-height:1.2}.tile .d{font-size:11.5px;color:var(--text2)}
.tile.y{border-color:var(--warn)}.tile.r{border-color:var(--bad)}
/* alerts */
.alert{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}.alert:last-child{border:0}
.alert .ic{width:18px;flex:none;text-align:center}
/* week strip */
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.d7{background:var(--surface2);border:1px solid var(--border);border-top:4px solid var(--k-easy);border-radius:8px;padding:6px 6px 8px;font-size:12px;min-height:92px;min-width:0;overflow-wrap:anywhere}
.d7.k-long{border-top-color:var(--k-long)}.d7.k-quality{border-top-color:var(--k-quality)}.d7.k-rest{border-top-color:var(--k-rest)}.d7.k-race{border-top-color:var(--k-race)}
.d7.today{outline:2px solid var(--s1);outline-offset:1px}
.d7 .dd{font-weight:700;display:flex;justify-content:space-between}.d7 .tt{margin:3px 0;line-height:1.25;color:var(--text)}.d7 .km{color:var(--text2)}
.d7 .kl{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.dv{font-size:11.5px;font-weight:650}.dv.ok{color:var(--goodtx)}.dv.warn{color:var(--warntx)}.dv.bad{color:var(--badtx)}.dv.miss{color:var(--muted)}
@media(max-width:640px){.week7{grid-template-columns:repeat(4,minmax(0,1fr))}.hero .title{font-size:22px}}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--text2);font-weight:650;font-size:12px}
tr.today td{background:var(--tint)}
.tbl{overflow-x:auto}
table.days td:first-child{white-space:nowrap;font-weight:650;width:74px}
table.days .ct{color:var(--text2)}
.kbadge{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--k-easy)}
.kbadge.k-long{background:var(--k-long)}.kbadge.k-quality{background:var(--k-quality)}.kbadge.k-rest{background:var(--k-rest)}.kbadge.k-race{background:var(--k-race)}
details.wk{margin-bottom:8px}details.wk>summary,details.more>summary{cursor:pointer;list-style:none;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-weight:650}
details.wk>summary::before,details.more>summary::before{content:"▸ ";color:var(--muted)}details[open].wk>summary::before,details[open].more>summary::before{content:"▾ "}
details.wk>.body,details.more>.body{padding:10px 2px 0}
details.more{margin-bottom:12px}
.card details.more>summary{padding:6px 10px;font-size:13px}
/* roadmap */
.road{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.road.mini{grid-auto-columns:minmax(120px,1fr);margin-top:8px}
.ph{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px}
.ph.current{outline:2px solid var(--s1)}.ph.done{opacity:.72}
.ph .n{font-weight:700;font-size:13.5px}.ph .lk{font-size:20px;font-weight:750;color:var(--text)}.ph .cp{margin-top:6px;color:var(--text2)}
/* misc */
.chart{position:relative;height:250px}.chart.sm{height:170px}.chart.tall{height:320px}
.pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:12px}
.pill.on{background:var(--s1);color:#fff;border-color:var(--s1);cursor:pointer}.pill.f{cursor:pointer}
.rc{border-left:4px solid var(--s1);padding-left:10px;margin:10px 0}
.rc .lv{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase}
.rc a,.card a{color:var(--s1)}
#map{height:380px;border-radius:10px}
.big{font-size:30px;font-weight:750;line-height:1.1}
ul.tight{margin:4px 0;padding-left:18px}ul.tight li{margin:3px 0}
.legend{font-size:12px;color:var(--text2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
.lightbar{margin:-4px 0 10px;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600}
.lightbar.y{background:rgba(250,178,25,.18);color:var(--warntx)}.lightbar.r{background:rgba(208,59,59,.15);color:var(--badtx)}.lightbar.n{background:var(--tint);color:var(--text2)}
.kv>div{margin:3px 0;font-size:13px}.kv .k{color:var(--text2);font-size:12px;font-weight:650;margin-right:4px}.kv ul.tight,.kv .tbl{margin-top:2px}
/* panel */
.dec{border-left:4px solid var(--border);padding:2px 0 2px 10px;margin:10px 0}
.dec .row{gap:6px}.vote{font-size:12px;font-weight:650;color:var(--text2)}
.minority{margin-top:4px;padding:6px 8px;background:var(--tint);border-radius:8px}
.trg{font-size:12.5px;margin-top:3px}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;border:1px solid var(--border);color:var(--muted)}
.tg.triggered{background:rgba(208,59,59,.15);color:var(--badtx);border-color:var(--bad)}.tg.clear{color:var(--goodtx)}
.msg{padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px}.msg:last-child{border:0}
@media(max-width:640px){.htop .sub{display:none}
 table.days,table.days tbody,table.days tr,table.days td{display:block;width:100%}table.days tr:first-child{display:none}
 table.days tr{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:6px 8px;background:var(--surface2)}
 table.days td{border:0;padding:3px 0}table.days td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
 table.days td:first-child{width:auto}}
.foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
/* basit mod: tek bakışta Bugün + Plan */
.modebtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
body.basit nav{display:none}body.basit .hwrap{padding-bottom:10px}
.simple{max-width:560px;margin:0 auto}
.s-kind{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:750;margin:6px 0 8px}
.s-km{font-size:18px;font-weight:600;color:var(--text2)}
.s-line{font-size:16px;line-height:1.4;padding:7px 0;border-top:1px solid var(--border)}
.s-k{display:inline-block;min-width:60px;margin-right:8px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.s-next,.s-done{margin-top:8px;font-size:14.5px;color:var(--text2)}
.s-dot{display:inline-block;width:10px;height:10px;flex:0 0 10px;border-radius:50%;background:var(--k-easy)}
.s-dot.k-long{background:var(--k-long)}.s-dot.k-quality{background:var(--k-quality)}.s-dot.k-race{background:var(--k-race)}
.s-dot.k-rest{background:transparent;box-shadow:inset 0 0 0 2px var(--k-rest)}.s-kind .s-dot{width:14px;height:14px;flex-basis:14px}
.s-week{display:flex;justify-content:space-between;margin:18px 2px 6px;font-size:13.5px;font-weight:700;color:var(--text2)}
.s-row{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.s-row.today{box-shadow:0 0 0 2px var(--s1);border-color:transparent}.s-row.past{opacity:.55}
.s-d{width:62px;flex:0 0 62px;font-size:14px;color:var(--text2)}.s-w{flex:1;font-weight:600}
.s-r{font-variant-numeric:tabular-nums;color:var(--text2);white-space:nowrap}.s-goal{margin:18px 2px 0;font-size:14px;color:var(--text2);text-align:center}
</style>
</head>

ic": "Hedef", "text": "Etiket içeriği D3: Güvenli / Sabır (varsayılan) / Güçlü bitiş (~4:07–4:09, sub-4 değil) / Sub-4 denemesi (start öncesi ayrı karar).", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U4", "topic": "Test ve hedef", "text": "Karar testi tek ve önceden yazılı; test bloğunda CAF yok; ilk km ortalamadan çıkar; hızlı tur (hızlı uçtan >5 sn) ≥2 → A kapanır; kadans kilidinde HR oy hakkını kaybeder; >18 °C'de eşikler +3 bpm.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U5", "topic": "Test ve hedef", "text": "Erken kilit: MP ön kilidi 18 Eki, kesin MP 25 Eki, hava satırı ve hedef 30 Eki 12:00.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U6", "topic": "Hacim", "text": "Hiçbir hafta 60 km'yi geçmez; taper haftası öncekinden uzun olmaz; plan km'si tavandır, +0,3 km tolerans; aşan km sonraki kolay günden düşülür.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli.", "trigger": "T-HACIM"}, {"id": "U7", "topic": "Uzun koşu", "text": "Pik ≤28 km (HE vetosu); pik tamamen kolay, MP'siz, hızlı bitiş yok; en uzun koşu ile en büyük MP bloğu aynı gün olmaz.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U8", "topic": "Hacim", "text": "2 haftalık taper, yoğunluk MP ile korunur, haftada 4–5 koşu; yarış haftası 23–23,5 km; 27 Eki kısa MP.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U9", "topic": "Yoğunluk", "text": "VO2max, anaerobik, depar, <3 dk tekrar yok; strides tek hızlı uyaran, ayrı adım, %85 efor.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U10", "topic": "Yoğunluk", "text": "Haftada ≤2 sert gün, aralarında ≥48 sa. Sert gün: MP/eşik/eşik P yok; uyku/toparlanma → mesafe korunur, HR tavanı −3. Kaçan uzun koşu taşınmaz.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U18", "topic": "Toparlanma", "text": "Tek sabah kartı; sporcu 4 şey girer (ağrı, Aşil, hastalık, migren); Garmin sayılarını panel okur; ağrı puanı plana bakılmadan verilir.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U19", "topic": "Sağlık", "text": "Koşu içi ağrı: ≤2/10 devam; 3/10 kalite biter; ≥4/10, artan ya da aksama → dur, ertesi gün koşu yok.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U20", "topic": "Sağlık", "text": "Vetolar: ateşte 48 sa ateşsiz geçmeden koşu yok; 29 Eki 09:00'dan sonra ≥38,0 °C → start yok; NSAİİ yasağı; parasetamol tavanı; migren atak günü kalite/uzun yok (M6); 31 Eki 18:00 ishal kesimi.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U21", "topic": "Sağlık", "text": "175 HR güvenlik alarmı yok; kalp belirtisinde dur, bütün hedefler düşer.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U22", "topic": "Garmin Coach", "text": "Garmin Coach: K1 Kapat (11/11); ölçüm sürer; işlem sporcuda (tercihen 5 Eki).", "status": "sporcu seçimi", "why": "Sporcu seçimi (4 Eki): Coach açık kalsın, önerileri görmezden gelinsin: coach_policy.mode = 'yok-say' (Coach seansları takvimde görünür, yapılmaz; etiket 'Coach — yok say'). Panelin K1 'kapat' hükmü ve 26 Eki'de kapatma yalnız öneri olarak kalır. · Panel: Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli. · KTS-08: K2'de Long Workout Day = Pazar (ya da Çarşamba), Cumartesi Coach'ta antrenman günü değil; Coach bildirimleri ve yarış tahmini bildirimi 5 Eki'de kapanır; panel 12/16/23/31 Eki akşamı takvimi okur; kapatma önerisi 23 Eki akşamı (yalnız öneri).", "user_choice": "Coach açık kalsın, önerileri görmezden gelinsin: coach_policy.mode = 'yok-say' (Coach seansları takvimde görünür, yapılmaz; etiket 'Coach — yok say'). Panelin K1 'kapat' hükmü ve 26 Eki'de kapatma yalnız öneri olarak kalır."}, {"id": "U23", "topic": "Beslenme", "text": "Günlük KH gün tipine göre; protein 1,6–1,8 g/kg; taper'da KH düşmez; train-low ve yeni takviye yok; ferritin/hemogram önerisi.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U24", "topic": "Beslenme", "text": "Jel tetiği workout adım notu; tek km listesi start −10 dk + 5-9-12-17-21-25-29-32-37; kaçan jel telafi edilmez; istasyonda yalnız su ve sünger.", "status": "sporcu seçimi", "why": "Sporcu seçimi (4 Eki): C30 sporcu seçimi: tek km listesi start −10 dk + 5-10-15-20-25-30-35-40 (9 jel). Diğer kurallar aynen. · Panel: Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli.", "user_choice": "C30 sporcu seçimi: tek km listesi start −10 dk + 5-10-15-20-25-30-35-40 (9 jel). Diğer kurallar aynen."}, {"id": "U25", "topic": "Beslenme", "text": "Kahve hiçbir gün atlanmaz (veto); yarışta kahve + CAF km 17 ve 29 (~300 mg); tam doz 17 Eki'de bir kez prova; baş ağrısı ≥4/10 → yarışta tek CAF (km 29); T-CAF.", "status": "sporcu seçimi", "why": "Sporcu seçimi (4 Eki): C30 sporcu seçimi: yarışta kahve + CAF km 15 ve 30 (~300 mg); 17 Eki tam doz provası km 15 ve 25; baş ağrısı ≥4/10 → yarışta yalnız km 30 CAF. Kahve vetosu ve T-CAF aynen. · Panel: Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli.", "user_choice": "C30 sporcu seçimi: yarışta kahve + CAF km 15 ve 30 (~300 mg); 17 Eki tam doz provası km 15 ve 25; baş ağrısı ≥4/10 → yarışta yalnız km 30 CAF. Kahve vetosu ve T-CAF aynen."}, {"id": "U26", "topic": "Beslenme", "text": "SaltStick km 9, 21, 32; sıvı 400–600 ml/sa, tavan 800; ter testi 10 ve 17 Eki.", "status": "sporcu seçimi", "why": "Sporcu seçimi (4 Eki): C30 sporcu seçimi: SaltStick km 10, 20, 30 (jelle). Sıvı ve ter testi kuralları aynen. · Panel: Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli. · KTS-02: 17 Eki sıvı yelekte 2 × 500 ml + kapıda 750 ml, hedef 1,3–1,6 L; 20–22 Eki bardak provası.", "user_choice": "C30 sporcu seçimi: SaltStick km 10, 20, 30 (jelle). Sıvı ve ter testi kuralları aynen."}, {"id": "U27", "topic": "Beslenme", "text": "Yarış kutusu bugün ayrılır, açılmaz; Maurten Gel 100 siparişi en geç 7 Eki; hafta içi SiS.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U28", "topic": "Beslenme", "text": "Yükleme 30–31 Eki 8–9 g/kg (taban 7); 29 Eki öğün atlanmaz; yarış sabahı kahvaltı 120–150 g + kahve evde, start −10 dk jel, 07:45–08:00 hurma (denendiyse).", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U29", "topic": "Ayakkabı", "text": "Adios merdiveni; yeni ayakkabı + yeni yoğunluk aynı gün olmaz; ertesi sabah ve 48. saat kontrolü; kilitten sonra yalnız Adios → Vomero; şüphede Vomero; Barbaros MP −15'ten hızlı değil.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli. · 30 km notu: 17 Eki Adios yok; adım 3 = 24 Eki, kilit 26 Eki sabahı (§6.2)."}, {"id": "U30", "topic": "Yarış", "text": "Yarış evreleri Fren 0–10 · Ritim 10–30 · Cesaret 30+; kapılarda önce tabela süresi; kayıp zaman ≤3 sn/km ile ≥10 km'ye yayılır.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U31", "topic": "Yarış", "text": "Hava: R0–R3 × T0–T2, ayarlar toplanır; ≥+10 sn/km → Güçlü bitiş ve S kapanır; satır 30 Eki 12:00.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U32", "topic": "Yarış", "text": "Lojistik: konaklama en geç 11 Eki; kit 30 Eki; bölme 24 Eki; acil bilgi göğüs numarası arkasında; yedek jel yelekte; 'hedefinden hızlı balonu önüne alma'.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U33", "topic": "Saat", "text": "Yarışta Workout (PacePro değil); otomatik tur kapalı; her tabelada tur; 1 tabela = 1 adım, 43 adım; ana ekranda son tur süresi; GPS +%0,5–1, telafi yok.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U34", "topic": "Saat", "text": "HR bölgeleri dondurulur (LTHR 177); Maraton profili; 24 Eki'den sonra saat kurgusu değişmez; yalnız titreşim; 'titreşimde önce ekrana bak'.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U35", "topic": "Davranış", "text": "Rota kapıda biter, seans bitince koşu biter; uzun koşu uzatılmaz; bank yok; 'hızlı km başarı değil, ihlal'; eğer–o zaman cümleleri 9 Eki'ye kadar; tek rapor şablonu; 26 Eki'den readiness/HRV ekranı sporcuya kapanır.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "U36", "topic": "İlk hafta", "text": "4 Eki dinlenme, 5 Eki koşusuz + Kuvvet-B, 6 Eki kolay 8 km + 4 strides (saatte yüklü; güncelleme: 145 üstü yavaşla, 6:20'den hızlı koşma); ilk haftanın görevleri.", "status": "uzlaşı", "why": "Tur 3 uzlaşısı (ayrıca oylanmadı); C maddesiyle çakışırsa C geçerli."}, {"id": "KT1-01", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "17 Eki km 19,5–27,5 adımlarında saatteki esas hedef tempo 6:15–6:45 olur (saate 6:10–7:15 girilir). HR ≤152 nota fren olarak yazılır; 155 kaldırılır. 6:10'dan hızlı her tur ihlal turu sayılır. ≥2 ihlal turu olursa: 18 Eki ön kilit bir bant aşağıdan açılır, 20 Eki MP bandı 5 sn yavaşlar, C36 'davranış kaynaklı' notuyla okunur. Son 8 km'de ana ekran 'tur ort. HR + tur temposu' olur. 18 Eki toparlanma süresi >54 sa ve ≥2 ihlal turu varsa 20 Eki kolay 8 km'ye döner.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 11, "against": 0, "abstain": 0}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle km 19,5–27,5 kuralları yalnız 17 Eki YEDEK seansında geçerli; 30 km'de km 20–30 6:25–6:50, HR 152 üstü yavaşla, 6:10'dan hızlı tur → sonraki kapıda bitir. ≥2 ihlal → 18 Eki ön kilit bir bant aşağıdan (aynen); 20 Eki MP zaten iptal."}, {"id": "KT1-02", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "13 Eki Kuvvet-A'dan yüklü baldır/soleus setleri çıkarılır; kalanlar leg press ≤45 kg 3×10, tek bacak köprü 3×12, yan plank/dead bug. Step-down (15 cm, 1×6/bacak) ve tibialis (1×12) 5 ve 12 Eki Kuvvet-B'ye vücut ağırlığıyla eklenir; 13 Eki'de 2 set, RIR ≥3. O hafta için 'Kuvvet-A DOMS'u Adios'a yazılmaz' istisnası kaldırılır. 16 Eki Adios kararı şu soruya bağlanır: '14 ve 15 Eki sabahı kriterler temiz mi ve 15 Eki akşam baldır testi iki tarafta eşit mi?'", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT1-03", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "A tetik 1 eşiği >23,1 km'den >22,3 km'ye çekilir (aşılırsa 17 Eki 25 km). H1 uyum kapısı: 6–10 Eki'de +0,3 km'yi aşan ≥2 koşu varsa 17 Eki otomatik 27 km / 2:50 olur. km 19,5 sonrası 8 km evden geçmeyen tek döngü olur ve tam 27,5 km'de kapıda biter. Pik GPS km'si >27,8 çıkarsa ihlal yazılır ve 24 Eki MP teyidi 6 km'den 4 km'ye iner.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle tetik 1/2 ve H1 uyum kapısı 30 km'nin ön şartıdır: tutmazsa YEDEK, yedeğin içinde bu kısaltmalar aynen (25 / 24 / 27 km)."}, {"id": "KT1-04", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Sabah kartının 4. maddesi (kemik noktası basma + 10 tek ayak sekme) 6–25 Eki arasında her koşu sabahı yapılır. Ferritin, hemogram ve 25-OH D vitamini 5–9 Eki arasında yaptırılır; öneri değil, H1 görevi. Birleşik eşik: E sarısı + herhangi bir noktasal hassasiyet → 48 sa koşu yok ve aynı hafta hekim. E sarısı tek başına bile olsa 17 Eki Adios bölümü yapılmaz. Naviküler basma testi 13, 17 ve 24 Eki'den sonra iki sabah üst üste yapılır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT1-05", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Ateş ya da boyun altı belirtiden sonra ilk MP/kalite en erken belirti başlangıcından 7 gün sonra; şart: aynı tempoda 2 kolay koşuda HR tabandan ≤+5 bpm. Bu süre 25 Eki'yi geçerse MP teyidi yapılmaz ve bant bir aşağı iner. Boyun altı belirti 31 Eki 18:00'de sürüyorsa start yok. Etiket kuralı derecelenir: boyun üstü, ateşsiz, 72 sa içinde düzelen → değişmez; yarışa ≤10 gün kala ateşli ya da boyun altı → en fazla Güvenli; yarışa ≤14 gün kala herhangi bir hastalıkta Güçlü bitiş ve Sub-4 kapanır. Sabah ateş ölçümü 22 Eki'de başlar. 29–30 Eki kapalı alanda maske öneri olur.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT1-06", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "10→11 Eki kayarsa: en fazla 20 km / 2:05; 13 Eki testi 14 Eki'ye kayar; o hafta Kuvvet-A yok. 17→18 Eki kayarsa: en fazla 24 km / 2:30, Adios bölümü yok; MP ön kilidi 19 Eki; 20 Eki MP 21 Eki'ye kayar ve iniş 2 iptal olur; 20 Eki Kuvvet-A iptal; ayakkabı kilidi 22 Eki. Migrende %80 kuralı aynı tavanlara bağlanır (H1 ≤20 km, H2 ≤22 km ve ≤2:15). H2'de ikinci kaydırma gerekirse pik iptal, etiket en fazla Sabır, telafi yok.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle: 17 Eki Pazar'a kayarsa 30 km yok, en fazla 24 km / 2:30; 20 Eki kolay 8 km aynen kalır."}, {"id": "KT1-07", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Yarışta Adios şartları (hepsi): Adios birikimi ≥45 km, yorgun bacakta ≥8 km temiz bölüm, 13, 17 ve 24 Eki'nin 48. saat kontrollerinin üçü yeşil. Biri tutmazsa Vomero. C27 'değişim yok' seçilirse yarış varsayılanı Vomero olur; Adios ancak 24 ve 27 Eki yeşilse ve 25 Eki'de yazılı seçilirse. Yeni Vomero çifti 'gerekli' olur: ilk koşusu ≤10 Eki, 17 Eki dahil ≥40 km. K30 kapısına 'baldır sıkışması → MP +10 ve istasyonlarda 20 sn yürüme' satırı eklenir.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle 17 Eki Adios'suz → 'yorgun bacakta ≥8 km' şartı sağlanamaz; yarışta C27 'değişim yok' kuralı uygulanır (varsayılan Vomero; Adios ancak 24 ve 27 Eki yeşil + 25 Eki yazılı seçim). Entegratör eşlemesi; panel teyidi bekler. · KTS-07 ek şartları (≥14 km Adios, 24 Eki MP Adios'la, 15/15) geçerli."}, {"id": "KT1-08", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "6 Eki akşam eksantrik baldır yalnız iki bacakla, 1×10; tek bacak eksantrik 13 Eki'ye kadar yok. İniş 1 en fazla 2×400 m. 9 Eki ön uyluk DOMS ≥2/10 ise 10 Eki 20 km olur (18 değil). 9 Eki akşam testinde taraflar karşılaştırılır: 15 tekrarı ağrısız tamamlayamayan taraf varsa ya da taraflar arasında ≥3 tekrar fark varsa doku kapısı sarı sayılır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT1-09", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Yarış haftası ağrı karar ağacı: iki taraflı, kas gövdesinde, ≤2/10, ısınınca azalan → değişiklik yok. Tek taraflı ≥3/10 ve >48 sa, noktasal kemik ağrısı ya da sekmede ağrı → Güvenli + Vomero. Arada kalırsa 28 Eki'de 10 dk jog testi. H3 toplamı >43,5 km olursa aşan km 28 Eki'den düşülür. 25 Eki varsayılanı koşusuz olur. 31 Eki shakeout saatte 20 dk süre adımıyla biter.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT1-10", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "B: 10 Eki 27 km için kapı (hepsi): 9 Eki toparlanma süresi ≤12 sa, HRV ≥67 iki gece, baldır testi iki tarafta eşit, 6–8 Eki ortalama HR ≤148. Biri tutmazsa 22 km ve iskelet A'ya döner. 28 km: yalnız H1 uyum kapısı temizse; 28,0 km'de seans biter, 2:55 sabit. A + aşılama (i): 15 Eki MP ≤4 km ve 13 Eki testi 2×4 km; (ii) önerilmez. TT: en erken 20 Eki 12:00 (olmazsa 21 Eki ve iniş 2 iptal); 20 Eki Kuvvet-A iptal; 18 Eki toparlanma süresi >54 sa ise TT yok.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · Sporcu seçimi (4 Eki): C11 TT isteğe bağlı (sporcu seçimi): TT seçilirse zamanlama kuralları aynen geçerli. · 30 km seçimiyle TT seçeneği kalktı; 28 km seçeneği konu dışı.", "user_choice": "C11 TT isteğe bağlı (sporcu seçimi): TT seçilirse zamanlama kuralları aynen geçerli."}, {"id": "KT2-01", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "2:55 = geçen süre (Adios değişimi dahil). Rota: km 0–19,5 kapıda biter; kalan 8 km evden 4 × (1 km git, 1 km dön), kapı geçişleri km 21,5/23,5/25,5/27,5. Kapıdan geçerken geçen süre 2:42:00'yi geçtiyse koşu biter. L9 ya da tetik 1/2 varsa koşu km 23,5 kapısında biter. 10 Eki hareket temposu >6:18 ise 17 Eki baştan 26–27 km yazılır. Km 19,5 sonrası adım notu: '2:42 geçtiyse kapıda bit'. Ölçüt: GPS km ≤27,8, geçen süre ≤2:55, km 19,5 sonrası tur ort. HR ≤155.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle rota km 0–20 döngü + 5 × 1 km git-dön (kapılar 22/24/26/28/30,0); 2:42 kuralı yerine 'geçen süre 3:10'u geçtiyse sonraki kapıda bit'. Bu yamanın 27,5 km rotası YEDEK seansta geçerli."}, {"id": "KT2-02", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "16 Eki yazılı Adios kararına 4. soru: '8 Eki'de 6:15'ten hızlı tur ≤1 ve 13 Eki'de 5:47'den hızlı tur 0 mı?' Hayırsa Adios bölümü yok (C27 değişimsiz). Km 19,5 sonrası 8 adımın saat hedefi tempo 6:15–6:45, HR ≤155 fren. Km 19,5 sonrası herhangi bir tur 6:05'ten hızlıysa koşu bir sonraki kapı geçişinde biter. Ölçüt: km 19,5–27,5'te 6:05'ten hızlı tur sayısı 0.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C27 varsayılanı (evde Adios değişimi). · 30 km seçimiyle 16 Eki dört soru (Adios kararı) kalktı; 6:05 kuralı yerine 30 km'de 6:10'dan hızlı tur → sonraki kapıda bitir. YEDEK seansta yama aynen (Vomero)."}, {"id": "KT2-03", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "§12.1'e 'test koruma' bölümü. Testi kısaltan ya da kolaya çeviren tetik çıkarsa (T2, C16, S/D/H) test bir kez 14 Eki'ye kayar; 13 Eki 10 km kolay olur; o hafta Kuvvet-A yok (14→17 Eki ≥72 sa korunur). U sarısında test 2×3 km, aynı C9 tablosu, sonuç 'koşullu', A-aday açılamaz. Test hiç yapılamazsa MP = B (5:55), A-aday ve Güçlü bitiş kapalı, 24 Eki yalnız aşağı yönlü, K10_HR=163. 18 Eki kilit metni testin sürümünü (tam/kısaltılmış/kaymış/yok) tek satırda yazar.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT2-04", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Yarışta yedek Yeme alarmı kapalı, yalnız workout çökerse açılır; 'alındı' kuralı yarıştan çıkar. Bütün yarış adımlarında yavaş uç 12:00 (fiilen yavaş uyarısı yok). Antrenman ve yarışta tek protokol: 'hızlı' titreşimi → bu km bandın yavaş ucu; 3. ve 4. kademe sporcu kuralı olmaktan çıkar, panel FIT'ten sayar. 24 Eki MP bloğunda km 9 jeli 10–15 sn yürüyerek alınır. Bütçe: 24 Eki'de tempo uyarısı ≤1/5 km ve yavaş uyarısı 0; aşılırsa yarışta R2.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C18 R1 (varsayılan). · Sporcu seçimi (4 Eki): C30 sporcu seçimiyle 24 Eki jelleri start + km 5 + km 10; MP bloğundaki km 5 jeli koşarken alınır (C33 yürümesiz). Diğer kısımlar aynen.", "user_choice": "C30 sporcu seçimiyle 24 Eki jelleri start + km 5 + km 10; MP bloğundaki km 5 jeli koşarken alınır (C33 yürümesiz). Diğer kısımlar aynen."}, {"id": "KT2-05", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Ekran 2: Son tur ort. HR, Son tur süresi, Tur sayısı. HR ölçütü: 'K10 ve K11 tabelalarında son tur ort. HR > X'. K21'den 'son 3 tur' çıkar; yerine kart ±60 sn + RPE + 'son tur iki tabela üst üste MP+10'dan yavaş'. Göğüs bandı yoksa K10'un HR kolu kalkar. Saat start halısında başlatılır; fark varsa karta kalemle yazılır. Prova: 17 Eki km 10 ve 21, 24 Eki blok sonu; ölçüt 3/3 doğru, her biri ≤15 sn.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · Sporcu seçimi (4 Eki): C19 sporcu seçimi (bant yok): yarışta K10'un HR kolu kalkar, yalnız tabela süresi. Diğer kısımlar aynen.", "user_choice": "C19 sporcu seçimi (bant yok): yarışta K10'un HR kolu kalkar, yalnız tabela süresi. Diğer kısımlar aynen."}, {"id": "KT2-06", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Ana ekrana 'Tur sayısı' alanı (N. tabelada basıştan sonra N+1). 24 Eki 14 km'nin tamamı K1–K14 notlu tur adımı olarak koşulur; ölçüt: kaçan ya da çift basış 0, ≥2 ise yarışta km bitişli yedek düzen. Dört R satırının yarış seansları 24–25 Eki'de yüklenir, her biri bir kez açılıp 43 adım doğrulanır, 30 Eki'de yalnız takvime atanır. Kayıp tabela: saatin km'si önceki tabelaya göre +1,2 olunca bas. workouts.py adım sayacı 24 Eki'den önce kapanır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT2-07", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Rüzgâr K–KD ise (R0 ya da R1) km 11–25,8 adımlarında saatte hızlı uç = MP (−8 tolerans yok), not 'K14 Rüzgâr arkada: MP'. K21 asimetrik: karttan >30 sn öndeysen km 25,8'e kadar MP+5. Bilek kartına U dönüşü (25,8) kontrol süresi; dönüşte öndeysen ilk 5 km MP+5. Eğer–o zaman cümlesi 3 zorunlu olur. Ölçüt: K21 farkı ≤+30 sn; ikinci yarı/ilk yarı oranı kart oranının ≤+%3 üstünde.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT2-08", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Sporcuya her gün ≤3 satırlık tek mesaj: 'Bugün / Fren (tek sayı) / Dikkat (tek kural)'; ışık ve neden gösterilmez. Koşu içi kurallar ≤3. Rapor 8 → 4 alan (ağrı+yer, mide, atlanan jel, serbest not); gerisi FIT'ten. Güncelleme 07:30'a kadar gelmezse neden sorulmaz: ağrı ≥2 ya da readiness <40 ya da HRV durumu BALANCED değil → kolay ≤45 dk, değilse plan. Test ve pik günlerinde güncelleme yoksa seans 24 sa kayar. Ölçüt: uygulama ≥%90; iki hafta altındaysa kural kartı 7'den 5'e iner.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT2-10", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Fiziksel taahhüt aracı: S yarış seansı yalnız önkoşul 1 ve 2 25 Eki'de sağlanmışsa yüklenir; 30 Eki'de önkoşul 3 tutmazsa saatten silinir. Saatte ve bilek kartında yalnız seçilen etiketin seansı ve satırı bulunur. S'nin K21 çıkışı: 'toplam >2:00:00 ya da RPE ≥7 → Güçlü bitiş kartı'. Yürümesiz yalnız S'de; Sabır ile seçilirse K10 ve K21 toleransı ±30 sn. Ölçüt: 30 Eki 12:00'de saatte tek yarış seansı ve tek kart satırı.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · Sporcu seçimi (4 Eki): C33 yürümesiz seçildi: Sabır'da K10 ve K21 toleransı ±30 sn etkin. C35 Sub-4 eki önerildiği gibi (önkoşullu).", "user_choice": "C33 yürümesiz seçildi: Sabır'da K10 ve K21 toleransı ±30 sn etkin. C35 Sub-4 eki önerildiği gibi (önkoşullu)."}, {"id": "KT3-01", "topic": "Tur 5 · KT3 yamaları (ölçüm, altyapı, lojistik, hava)", "text": "(1) §9.1'e 'Veri kaydı: Her saniye' satırı eklensin (son gün 9 Eki). (2) Kadans kuralı panel tarafında uygulansın: blok süresinin >%20'sinde |HR-kadans|<=3 ise HR oy hakkını kaybeder. (3) Geçerlilik kontrolü: jog'da HR 60 sn'de >=10 bpm düşmüyorsa test koşullu sayılsın. (4) Bant yoksa kullanılacak tablo bugün yazılsın: <=153 B+ (A-aday açılmaz), 154-159 B, 160-165 C+, >=166 C. (5) Bant yoksa yarışta K10 HR kuralı kaldırılsın, yalnız tabela süresine bakılsın. (6) C19 varsayılanı 13 ve 24 Eki için 'zorunlu' yapılsın.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C19 göğüs bandı alınmazsa ya da zamanında gelmezse. · Sporcu seçimi (4 Eki): C19 sporcu seçimi (bant yok): (4) bant yoksa tablosu ve (5) K10 HR kolunun kalkması etkin; (6) 'zorunlu' varsayılanı uygulanmaz. (1)–(3) aynen.", "user_choice": "C19 sporcu seçimi (bant yok): (4) bant yoksa tablosu ve (5) K10 HR kolunun kalkması etkin; (6) 'zorunlu' varsayılanı uygulanmaz. (1)–(3) aynen."}, {"id": "KT3-02", "topic": "Tur 5 · KT3 yamaları (ölçüm, altyapı, lojistik, hava)", "text": "(1) Ofset kalibrasyonu: 8/10 Eki 145-154 bpm turlarının medyan temposu bilek tablosuyla kıyaslansın. Fark >=8 sn/km (~3 bpm) ise C9 eşikleri ofset kadar kaydırılsın; karar 12 Eki'ye kadar. (2) Aynı sensör kuralı: 13 Eki, 24 Eki ve yarış aynı sensörle. Sensör farklıysa 24 Eki >=4 bpm kuralı geçersiz. (3) A-aday'ın ikinci teyidi HR dışı olsun: 24 Eki MP bloğunda RPE <=4 ve turların >=%80'i bantta, ya da TT <=24:10. (4) Yarış öncesi kontrol listesine 'bant simgesi sabit' eklensin; bant düşerse HR kapıları okunmasın.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C19 bant alınırsa (önerilir/zorunlu). · Sporcu seçimi (4 Eki): Bantlı kapsam; bant alınmadığı için (1) ofset kalibrasyonu ve (4) bant simgesi uygulanmaz, (2) aynı saat kendiliğinden sağlanır. (3)'ün TT kolu geçerli: bantsız düzende A-aday yolu 20 Eki TT ≤24:10. [30 km seçimiyle 20 Eki TT kalktı (C11): TT kolu artık yok; tek yol 24 Eki HR dışı teyit.] · 30 km seçimi + TT'nin kalkması: bantsız düzende A-aday yolu olarak (3)'ün 24 Eki HR dışı teyidi (RPE ≤4, MP turlarının ≥%80'i bantta) entegratörce açıldı; panel teyidi bekler. · KTS-01: 24 Eki 2,5 km sürümünde 3 turun 3'ü bantta ve RPE ≤4 → A teyidi okunur.", "user_choice": "Bantlı kapsam; bant alınmadığı için (1) ofset kalibrasyonu ve (4) bant simgesi uygulanmaz, (2) aynı saat kendiliğinden sağlanır. (3)'ün TT kolu geçerli: bantsız düzende A-aday yolu 20 Eki TT ≤24:10. [30 km seçimiyle 20 Eki TT kalktı (C11): TT kolu artık yok; tek yol 24 Eki HR dışı teyit.]"}, {"id": "KT3-03", "topic": "Tur 5 · KT3 yamaları (ölçüm, altyapı, lojistik, hava)", "text": "(1) Hava düzeltme formülü yazılsın: 15 °C üstündeki her 1 °C için -1 bpm; çiy >=13 ise ek -2 bpm. 13 ve 24 Eki'ye uygulansın. (2) 24 Eki aşağı tetiği: bantla >=4, bilekle >=6 bpm, ve ikinci sinyalle birlikte (RPE >=6 ya da bantta tur oranı <%80). Tek başına yalnız bilgi. (3) TT seçilirse kural <=24:10 A teyit, >24:10 A kapanır; '>24:40 bant aşağı' silinsin. (4) C36'nın 17 Eki eşiği >=156'ya çekilsin ya da tetik yalnız 13 Eki'ye bağlansın.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: Risk C11 'TT' seçilirse artar. · 30 km seçimiyle TT kalktı; (3) uygulanmaz. (4) C36 17 Eki eşiği ≥156 30 km'nin son 8 km'sine uygulanır."}, {"id": "KT3-04", "topic": "Tur 5 · KT3 yamaları (ölçüm, altyapı, lojistik, hava)", "text": "(1) Kritik günlerde güncelleme start'tan >=45 dk önce çalışsın: 10/17/24 Eki ve 13 Eki; 17 Eki ve 1 Kas'ta 05:45. Orkestratör sporcu onayıyla kursun. (2) §4.3'e sporcunun okuyacağı 3 sayı yazılsın: Kırmızı = HRV LOW ya da (HRV <67 iki gece ve RHR >=52); Sarı-U = son gece <5 sa ya da iki gece <6 sa; Sarı-S = RHR >=52. Sabah kartı aynen kalsın. (3) 26 Eki sonrası 07:00'ye kadar güncelleme yoksa o gün ekran gizleme askıya alınsın. (4) Güncelleme hata verirse sporcuya bildirim gitsin.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17."}, {"id": "KT3-05", "topic": "Tur 5 · KT3 yamaları (ölçüm, altyapı, lojistik, hava)", "text": "(1) 24 Eki'ye kadar kütüphaneye MARATON R0/R1/R2(hedefsiz)/R3/GÜVENLİ sürümleri yüklensin; 24 Eki R0 i ralı uygulansın: MP 2,5 km (3 tur; 3/3 bantta ve RPE ≤4 ise A teyidi okunur). İki şart tutmazsa ya da ışık sarı-D, turuncu veya kırmızıysa 12–14 km kolay.", "status": "kabul (son kırmızı takım)", "vote": {"for": 4, "against": 0, "abstain": 0}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (4/4). Senaryo: 18 Eki uyanıştaki tek T2 değeri (>54 sa) 24 Eki MP bloğunu C22'den sert biçimde siliyordu; değer 24 Eki'den 6 gün önce okunuyor ve 30 km sonrası >54 olasılığı ~%60. Blok düşerse bantsız ve TT'siz düzende A-aday, Güçlü bitiş ve Sub-4'ün tek yolu kapanır. Uygulandığı yer: nihai-plan.md §0, §2 (18, 21, 22, 23, 24 Eki), §4.4, §6.2, §12.2, §15 madde 31; schedule 18/21/22/23/24 Eki; T-24EKI."}, {"id": "KTS-02", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "17 Eki: yelekte 2×500 ml, kapı önünde (eve girmeden) 750 ml; hedef toplam 1,3–1,6 L, içilen ml rapora yazılır. Km 20, 25 ve 28 jelleri yürümeden, koşarak alınır. Ter oranı ≥0,9 L/sa ya da kilo kaybı >%2,5 çıkarsa yarışta havadan bağımsız 8 SB'de 10 sn yürüme uygulanır; karar 18 Eki kilit metnine yazılır. 20–22 Eki kolay koşularında koşarken bardaktan içme provası en az 3 kez yapılır; ortalama alım <80 ml ise 8 SB yürüme. Km 30 CAF jeli 29,72 SB'den alınıp elde tutulan bardakla alınır (bilek kartına yazılır).", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: 17 Eki taşıma düzeniyle içilebilecek ~0,4 L (~130 ml/sa) sıvı hedefinin (400–600 ml/sa) altında kalıyor; ter testi kuralı ölçülemiyordu. Yürümesiz yarışta bardaktan gerçekçi alım ~250–350 ml/sa ve 9 jeli koşarak almak prova edilmiyordu. Uygulandığı yer: nihai-plan.md §0 (C30, C33 satırları), §2 (16, 17, 18, 20–22, 30 Eki), §7.2, §7.3, §7.5, §7.7, §8.4, §8.6, §9.5 (K29); schedule 16/17/18/20/21/22/30 Eki ve 1 Kas; nutrition, race_plan."}, {"id": "KTS-03", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "Km 0–20, 20 adet 1 km'lik mesafe adımına bölünsün (toplam 30 adım ≤50; jel notları km 5, 10, 15). Kural iki kademeli olsun: 1. ihlal turu → sonraki 2 tur 6:40–6:50; 2. ihlal turu → sonraki kapıda bit. Km 0–20'de eşik 6:05. Önceden yazılı sonuç (sporcu 12 Eki'ye kadar onaylar): FIT'te ≥2 ihlal varken koşuya devam edilirse 24 Eki MP en fazla 2,5 km ve A-aday kapalı. Ölçüt: km 20–30 turlarının ≥%80'i 6:25–6:50 bandında, <6:10 tur ≤1.", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: Km 0–20'de km bölümü canlı görünmüyordu; km 20–30 bandı doğal temposundan 15–35 sn yavaş. Kural ya uygulanmaz (~%30) ya da 30 km'yi masum bir turla 22–24'te keser (~%15). Uygulandığı yer: nihai-plan.md §2 (12, 17, 18, 24 Eki), §3.1, §3.2, §9.3, §12.2, §14.4; schedule 12/17/18/24 Eki (17 Eki saat seansı 30 adım); T-A6."}, {"id": "KTS-04", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "17 Eki HR kısaltması '2 km HR >155 ve tur temposu 6:35'ten hızlı' olsun; tempo 6:35'ten yavaşken HR >155 yalnız bilgi, 2 km HR >160 yine kesme. C36 17 Eki kolu ve Tetik 6, ancak km 22–30 turlarının ≥%80'inde |HR−kadans| >3 ise okunsun; değilse 'okunamadı'. 13 Eki 'normal' = tempo bandında 10 turdan ≥8, RPE ≤6, sonuç C değil. 'Koşullu' etiketi yalnız kadans kilidinden ya da jog testinden geliyorsa ön şart tutmuş sayılsın. Panel kilit oranını ve jog HR düşüşünü 16 Eki listesine yazsın.", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: Bantsız bilek HR'si iki kapıyı yanlış tetikleyebiliyordu: 13 Eki 'koşullu' sonucu 30 km'yi sensör artefaktıyla düşürebilir (~%35–40); 17 Eki km 20–30'da kardiyak kayma kısaltmayı, C36'yı ve Tetik 6'yı birlikte ateşleyebilir. Uygulandığı yer: nihai-plan.md §2 (13, 16, 17 Eki), §3.1, §4.4, §12.1, §12.2, §12.4; schedule 13/16/17 Eki; T-C36, T-A6."}, {"id": "KTS-05", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "Şartları ikiye ayır. Sert (biri bile → YEDEK): T1, ağrı ≥3, baldır <15/15, kemik/Aşil, ışık sarı-D/turuncu/kırmızı. Yumuşak: H1 aşım, 11 Eki T2, 13 Eki koşullu/kaymış, 10 Eki 22,3–23,0 km. Tek yumuşak ihlal → 28 km sürekli (kapı 28'de biter); iki yumuşak → YEDEK. 'Temiz' = GPS ≤22,3, plansız HR ≥157 toplam ≤10 dk, 6:15'ten hızlı tur ≤1, ağrı ≤2. Kararı panel 16 Eki 20:00'ye kadar tek satırla verir; 21:00'de takvimde yalnız seçilen seans kalır (sporcu onayıyla). 05:45 güncellemesi 06:15'e kadar gelmezse pik kaymaz; 16 Eki kararı ve sporcunun §4.3 satırı geçerli olur. Ölçüt: GPS km karara uyar (≤30,3 / ≤28,3 / koşu ≤27,8). Uymazsa 20 Eki 6 km ve 24 Eki MP ≤2,5 km.", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: 7 ön şartın hepsinin tutma olasılığı ~%25–35; listeyi sporcu yazıyor ve sabah seansı kendisi seçiyordu. Şart tutmazken 30 km'yi başlatma ya da YEDEK'i 30'a tamamlama ~%35; 05:45 güncellemesi gelmezse pik teknik nedenle düşüyordu (~%10); 'temiz' tanımsızdı. Uygulandığı yer: nihai-plan.md Baştaki 30 km bölümü, §0, §2 (10, 11, 13, 14, 16, 17, 18, 20 Eki), §2.1, §4.3, §4.4, §9.3, §12.2, §14.4; schedule 10/11/13/14/16/17/18/20 Eki; T-A1, T-UZUN."}, {"id": "KTS-06", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "YEDEK yürüyüş adımına tempo hedefi 9:00–13:00 eklensin (9:00'dan hızlı → titreşim; not 'Yürü. Koşma = ihlal'). FIT ölçütü: yürüyüş adımında 8:00/km'den hızlı ≥200 m'lik parça olmamalı. İhlal varsa 20 Eki 6 km ve 24 Eki MP ≤2,5 km. Döngü 12 Eki'ye kadar GPS ile ölçülsün ve git-dön kolu, 30,0 kapısı GPS 29,9–30,2'ye düşecek şekilde ayarlansın; ölçü 16 Eki listesine yazılsın. 30,0'da saat kaydedilsin; kayıt bitiş konumu ev ±100 m olmalı.", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: YEDEK'te son 2,5 km'nin hedefi yalnız HR <110 idi; yürüyüş koşuya dönerse (~%40) şart tutmayan günde fiilen 30 km sürekli koşu olur. Km 0–20 döngüsü ölçülmediği için 30,0 kapısı GPS 30,3–30,5'e kayabiliyordu. Uygulandığı yer: nihai-plan.md §2 (12, 16, 17, 18, 20 Eki), §3.1, §9.3, §14.4; schedule 12/16/17/18/20 Eki (YEDEK saat seansı yürüyüş adımı)."}, {"id": "KTS-07", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "Yarışta Adios için şunlar eklensin: en uzun Adios koşusu ≥14 km, 24 Eki MP bloğu (4 ya da 2,5 km) Adios'la yapılmış, 24 Eki ertesi ve 26 Eki 48. saatte baldır 0/10 ve tek ayak 15 baldır kaldırma iki tarafta 15/15. 24 Eki MP yapılmadıysa yarış Vomero ile koşulur, kesin. 17 Eki ayakkabısı 9 Eki'de yazılı seçilsin: yeni Vomero yalnız 17 Eki'ye kadar ≥40 km (10 Eki 22 km dahil) birikmiş ve ağrısızsa; değilse eski çift. 30 km yeni çiftin ilk >22 km koşusu olamaz.", "status": "kabul (son kırmızı takım)", "vote": {"for": 3, "against": 0, "abstain": 1}, "why": "Son kırmızı takım yaması (05-tur5/kirmizi-takim-son.md); ≥3/4 kabul, veto yok (3/3). Senaryo: 17 Eki Adios'suz kaldığı için 'yorgun bacakta ≥8 km' şartı düşmüştü; Adios en uzun koşusu 13–14 km olan bir ayakkabı olarak seçilebiliyordu. 17 Eki'nin hangi Vomero ile koşulacağı belirsizdi. Uygulandığı yer: nihai-plan.md §0 (C27 satırı), §2 (9, 24, 25, 26 Eki), §6.2–6.6, §13; schedule 9/17/24/25/26 Eki; shoes."}, {"id": "KTS-08", "topic": "Son kırmızı takım (sporcu seçimleri birleşik planı)", "text": "Coach'ta Long Workout Day = Pazar ya da Çarşamba yapılsın ve Cumartesi Coach'ta antrenman günü olmasın (son gün 5 Eki). 12, 16, 23 ve 31 Eki akşamı panel takvimi yalnız okusun ve ertesi gün saatte tek panel seansı olduğunu doğrulasın; değilse
