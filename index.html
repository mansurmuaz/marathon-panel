<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>İstanbul Maratonu 2026 · Koç Paneli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
<style>
:root{
  color-scheme: light;
  --bg:#f9f9f7; --card:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6b6a65;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
  --t-kolay:#1baf7a; --t-uzun:#2a78d6; --t-kalite:#eb6834; --t-kuvvet:#4a3aa7; --t-yaris:#e34948; --t-dinlenme:#c3c2b7;
  --accent:#2a78d6; --accent-wash:rgba(42,120,214,.10);
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --radius:14px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --z1:#86b6ef; --z2:#5598e7; --z3:#2a78d6; --z4:#1c5cab; --z5:#104281;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0d0d0d; --card:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
    --t-kolay:#199e70; --t-uzun:#3987e5; --t-kalite:#d95926; --t-kuvvet:#9085e9; --t-yaris:#e66767; --t-dinlenme:#5a5a56;
    --accent:#3987e5; --accent-wash:rgba(57,135,229,.16); --good-ink:#0ca30c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --z1:#184f95; --z2:#256abf; --z3:#3987e5; --z4:#6da7ec; --z5:#9ec5f4;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ring)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 8px}
.brand{font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.count{text-align:right;line-height:1.1}
.count b{font-size:26px;font-weight:650;letter-spacing:-.02em}
.count span{display:block;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
main{padding:16px 0 64px}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:26px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:0 0 6px;font-weight:620}
p{margin:0 0 8px}
.muted{color:var(--muted)} .ink2{color:var(--ink2)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--ring);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gridc{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.gridc{grid-template-columns:1fr}}
@media (max-width:560px){.grid3{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:12px}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:620;letter-spacing:-.01em;margin-top:2px}
.tile .d{font-size:12px;color:var(--ink2);margin-top:2px}
/* hero */
.hero{padding:6px 0 4px}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hero h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:2px 0 12px;font-weight:680}
.targets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.target{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:8px 12px;min-width:92px}
.target .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.target .v{font-size:17px;font-weight:620}
.watch{display:flex;gap:8px;align-items:flex-start;background:var(--accent-wash);border-radius:12px;padding:10px 12px;font-size:14px}
.watch b{white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--wash);border-radius:999px;padding:3px 9px}
.t-kolay{background:var(--t-kolay)} .t-uzun{background:var(--t-uzun)} .t-kalite{background:var(--t-kalite)}
.t-kuvvet{background:var(--t-kuvvet)} .t-yaris{background:var(--t-yaris)} .t-dinlenme{background:var(--t-dinlenme)}
/* verdict */
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;border-radius:999px;padding:3px 10px;border:1px solid var(--ring)}
.verdict i{font-style:normal;display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:11px}
.v-iyi i{background:var(--good)} .v-dikkat i{background:var(--warn);color:#000} .v-sorun i{background:var(--crit)}
ul.tight{margin:6px 0 0;padding-left:18px} ul.tight li{margin:3px 0}
.kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:8px}
.kv b{color:var(--ink);font-weight:600}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sd{background:var(--card);border:1px solid var(--ring);border-radius:10px;padding:7px 4px 6px;text-align:center;font-size:12px;position:relative;overflow:hidden;cursor:pointer}
.sd:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c,var(--t-dinlenme))}
.sd .dn{color:var(--muted)} .sd .km{font-weight:620;font-size:14px} .sd .st{font-size:11px;color:var(--muted);min-height:15px}
.sd.today{outline:2px solid var(--ink);outline-offset:-1px}
.sd.done .st{color:var(--good-ink)}
/* plan */
.week{margin-bottom:14px}
.weekhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.weekhead .wt{font-weight:640}
.weekhead .wk{font-size:13px;color:var(--muted);white-space:nowrap}
.wfocus{font-size:13px;color:var(--ink2);margin:0 0 8px}
details.day{border-top:1px solid var(--ring)}
details.day:first-of-type{border-top:0}
details.day summary{list-style:none;display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:10px 2px;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day .dd{font-size:12px;color:var(--muted);line-height:1.2}
details.day .dd b{display:block;color:var(--ink);font-size:15px}
details.day .dt{display:flex;gap:8px;align-items:center;min-width:0}
details.day .dt span.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.day .dk{font-size:13px;color:var(--ink2);white-space:nowrap}
details.day .body{padding:0 2px 12px 68px;font-size:14px;color:var(--ink2)}
@media (max-width:480px){details.day .body{padding-left:2px}}
details.day.today summary{background:var(--accent-wash);border-radius:10px}
details.day.past .dt{opacity:.75}
.donemark{color:var(--good-ink);font-size:12px;font-weight:600}
.opt{font-size:11px;color:var(--muted);border:1px solid var(--ring);border-radius:6px;padding:0 5px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ring);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
details.tbl summary{font-size:13px;color:var(--muted);cursor:pointer;margin-top:6px}
/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .lbl{fill:var(--ink2);font-weight:600}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .axisl{stroke:var(--axis);stroke-width:1}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ctitle h3{margin:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:14px;height:2px;border-radius:1px}
.legend i.box{width:10px;height:10px;border-radius:3px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--ring);box-shadow:0 4px 18px rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;display:none;max-width:240px}
#tip .tv{font-size:14px;font-weight:650}
#tip .tr{display:flex;align-items:center;gap:6px}
#tip .tr i{display:inline-block;width:12px;height:2px;border-radius:1px}
/* race */
.goal{border-radius:12px;padding:12px;background:var(--card);border:1px solid var(--ring)}
.goal .gk{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.goal .gt{font-size:24px;font-weight:660;letter-spacing:-.02em}
.goal .gp{font-size:13px;color:var(--ink2)}
.goal .gc{font-size:12px;color:var(--muted);margin-top:4px}
.goal.main{border-color:var(--ink)}
#map{height:360px;border-radius:12px;overflow:hidden;border:1px solid var(--ring);background:var(--wash)}
.leaflet-container{font:inherit}
.tiles-dark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.kmicon{background:var(--card);color:var(--ink);border:1px solid var(--ring);border-radius:999px;font-size:10px;font-weight:650;text-align:center;line-height:18px}
.timeline{position:relative;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--ring)}
.timeline li:last-child{border-bottom:0}
.timeline .tm{font-weight:640;font-variant-numeric:tabular-nums}
.ifthen{display:grid;grid-template-columns:1fr;gap:8px}
.ifthen div{background:var(--card);border:1px solid var(--ring);border-radius:12px;padding:10px 12px;font-size:14px}
.ifthen b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--ring);font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}
.seg{display:inline-flex;background:var(--wash);border-radius:999px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--ring)}
.ex:last-child{border-bottom:0}
.ex .en{font-weight:600}
.ex .ed{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap}
.ex .ec{grid-column:1/-1;font-size:13px;color:var(--muted)}
.principle{padding:12px 0;border-bottom:1px solid var(--ring)}
.principle:last-child{border-bottom:0}
.principle b{display:block;font-size:16px;margin-bottom:2px}
.mantra{font-size:20px;font-weight:650;letter-spacing:-.01em;text-align:center;padding:18px 12px}
.decision{padding:10px 0;border-bottom:1px solid var(--ring)}
.decision:last-child{border-bottom:0}
.decision .q{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.decision .a{font-weight:600;margin:2px 0}
.decision .x{font-size:13px;color:var(--ink2)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:24px 0 40px}
details.fold{margin-top:22px}
details.fold>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0 10px;display:flex;justify-content:space-between}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"+";font-size:17px;line-height:1}
details.fold[open]>summary:after{content:"–"}
details.decision>summary{list-style:none;cursor:pointer}
details.decision>summary::-webkit-details-marker{display:none}
.todo .check span.due{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.todo .check.late span.due{color:var(--crit)}
.btn{border:1px solid var(--ring);background:var(--card);color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;margin-top:10px}
#band{display:none}
@media print{
  body.print-band header, body.print-band main, body.print-band footer, body.print-band #tip{display:none !important}
  body.print-band{background:#fff;color:#000}
  body.print-band #band{display:block;width:9cm;font:11px/1.35 system-ui,sans-serif}
  #band table{width:100%;border-collapse:collapse} #band td,#band th{border:1px solid #999;padding:2px 4px;text-align:right} #band td:first-child,#band th:first-child{text-align:left}
}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.cnote{font-size:12px;color:var(--muted);margin-top:6px}
.hb{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.hb .tr{position:relative;height:14px;background:var(--wash);border-radius:4px}
.hb .tg{position:absolute;top:0;bottom:0;border:1px dashed var(--axis);border-radius:4px}
.hb .br{position:absolute;top:3px;bottom:3px;left:0;background:var(--accent);border-radius:3px}
.hb .vl{grid-column:2;font-size:12px;color:var(--ink2);margin-top:-4px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brand">İstanbul Maratonu<small id="raceSub"></small></div>
      <div class="count"><b id="cd"></b><span id="cdl"></span></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="tip" role="status" aria-live="polite"></div>
<footer class="wrap" id="foot"></footer>
<style>
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock .lk{width:min(320px,86vw);text-align:center}
#lock .lk-t{font-size:20px;font-weight:650;margin-bottom:4px}
#lock .lk-s{font-size:13px;color:var(--muted);min-height:18px}
#lk-pad{width:100%;height:auto;touch-action:none;margin-top:18px;user-select:none;-webkit-user-select:none}
#lk-pad .nd{fill:var(--card);stroke:var(--axis);stroke-width:2}
#lk-pad .nd.on{fill:var(--accent);stroke:var(--accent)}
#lk-pad .ln{stroke:var(--accent);stroke-width:5;stroke-linecap:round;fill:none;opacity:.8}
#lock.bad #lk-pad .nd.on{fill:var(--crit);stroke:var(--crit)}
#lock.bad #lk-pad .ln{stroke:var(--crit)}
#lock.bad .lk{animation:lkshake .35s}
@keyframes lkshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
<div id="lock" aria-label="Kilit ekranı">
  <div class="lk">
    <div class="lk-t">Kilitli</div>
    <div class="lk-s" id="lk-msg">Deseni çiz</div>
    <svg id="lk-pad" viewBox="0 0 300 300" role="img" aria-label="Desen alanı"></svg>
  </div>
</div>

function renderRehber(el){
  const nav = h("div",{class:"seg",role:"group","aria-label":"Rehber"});
  SUBS.forEach(([k,l]) => nav.append(h("button",{"aria-pressed": String(k === SUB), onclick:() => showTab("rehber/"+k)}, l)));
  const body = h("div");
  el.append(nav, body);
  ({kuvvet:renderStrength, beslenme:renderNutrition, zihin:renderZihin, kurul:renderKurul}[SUB] || renderStrength)(body);
}

const RENDER = {bugun:renderToday, plan:renderPlan, yaris:renderRace, rehber:renderRehber, veri:renderData};

/* ---------- başlat ---------- */
(function init(){
  const nav = document.getElementById("tabs"), main = document.getElementById("main");
  TABS.forEach(([id,l]) => { nav.append(h("button",{role:"tab","data-id":id,onclick:()=>showTab(id)}, l)); main.append(h("section",{class:"tab",id:"s-"+id,role:"tabpanel"})); });
  const left = diffDays(TODAY, D.meta.race_date);
  document.getElementById("cd").textContent = left > 0 ? `${left} gün` : (left === 0 ? "Bugün!" : "✓");
  document.getElementById("cdl").textContent = left > 0 ? "yarışa" : (left === 0 ? "1 Kasım, 09:00" : "tamamlandı");
  document.getElementById("raceSub").textContent = `${fmtDay(D.meta.race_date)} ${D.meta.race_year||""} · ${D.meta.race_time}`;
  document.getElementById("foot").textContent = `Güncelleme: ${D.meta.built} · Veri: Garmin + Apple Health`;
  showTab((location.hash||"#bugun").slice(1));
  addEventListener("hashchange", () => showTab(location.hash.slice(1)));
})();
</script>
