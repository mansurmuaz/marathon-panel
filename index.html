<style>

 --s1:#2a78d6;--s1l:#9ec5f4;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--s8:#e34948;
 --good:#0ca30c;--warn:#fab219;--serious:#ec835a;--bad:#d03b3b;--goodtx:#006300;--badtx:#b02a2a;--warntx:#8a5a00;
 --k-easy:#2a78d6;--k-long:#eb6834;--k-quality:#4a3aa7;--k-race:#e87ba4;--k-rest:#b9b8b3;--tint:#eef4fc}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--surface2:#222221;--border:#333330;--text:#fff;--text2:#c3c2b7;--muted:#8a8985;
 --s1:#3987e5;--s1l:#184f95;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
 --goodtx:#3da53d;--badtx:#e66767;--warntx:#e0a020;--k-easy:#3987e5;--k-long:#d95926;--k-quality:#9085e9;--k-race:#d55181;--k-rest:#5a5955;--tint:#152238}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.hwrap{max-width:1100px;margin:0 auto;padding:10px 16px 0}
.htop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.htop h1{margin:0;font-size:17px}.htop .sub{color:var(--text2);font-size:12.5px}
.count{margin-left:auto;font-weight:700;font-size:15px}.count small{font-weight:400;color:var(--text2);font-size:12px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:9px 12px;font-size:14.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--text);border-color:var(--s1);font-weight:650}
main{max-width:1100px;margin:0 auto;padding:14px 16px 70px}
section.view{display:none}section.view.active{display:block}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid>.card{margin-bottom:0}.grid{margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--text2);font-weight:650;letter-spacing:.01em}
.sub{color:var(--text2);font-size:12.5px}.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
/* hero */
.hero{border-left:6px solid var(--k-easy);padding:16px 18px}
.hero.k-long{border-left-color:var(--k-long)}.hero.k-quality{border-left-color:var(--k-quality)}.hero.k-rest,.hero.k-cross{border-left-color:var(--k-rest)}.hero.k-race{border-left-color:var(--k-race)}
.hero .title{font-size:25px;font-weight:750;line-height:1.2;margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.cap{border-color:var(--text2)}
ol.struct{margin:0 0 10px;padding-left:20px}ol.struct li{margin:3px 0}
.why{font-size:13.5px;color:var(--text2);margin:6px 0}
.flex{font-size:13px;background:var(--tint);border-radius:8px;padding:7px 10px;margin:8px 0}
.fuel{font-size:13px;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coachwas{font-size:13px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.coachwas s{color:var(--muted)}
.garmin{font-size:13px;margin-top:6px}
/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-weight:650;font-size:13px}
.st::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.st.g::before{background:var(--good)}.st.y::before{background:var(--warn)}.st.r::before{background:var(--bad)}.st.n::before{background:var(--muted)}
.st.g{color:var(--goodtx)}.st.y{color:var(--warntx)}.st.r{color:var(--badtx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:8px}
.tile{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.tile .k{font-size:11.5px;color:var(--text2)}.tile .v{font-size:20px;font-weight:700;line-height:1.2}.tile .d{font-size:11.5px;color:var(--text2)}
.tile.y{border-color:var(--warn)}.tile.r{border-color:var(--bad)}
/* alerts */
.alert{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px}.alert:last-child{border:0}
.alert .ic{width:18px;flex:none;text-align:center}
/* week strip */
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.d7{background:var(--surface2);border:1px solid var(--border);border-top:4px solid var(--k-easy);border-radius:8px;padding:6px 6px 8px;font-size:12px;min-height:92px}
.d7.k-long{border-top-color:var(--k-long)}.d7.k-quality{border-top-color:var(--k-quality)}.d7.k-rest,.d7.k-cross{border-top-color:var(--k-rest)}.d7.k-race{border-top-color:var(--k-race)}
.d7.today{outline:2px solid var(--s1);outline-offset:1px}
.d7 .dd{font-weight:700;display:flex;justify-content:space-between}.d7 .tt{margin:3px 0;line-height:1.25;color:var(--text)}.d7 .km{color:var(--text2)}
.dv{font-size:11.5px;font-weight:650}.dv.ok{color:var(--goodtx)}.dv.warn{color:var(--warntx)}.dv.bad{color:var(--badtx)}.dv.miss{color:var(--muted)}
@media(max-width:640px){.week7{grid-template-columns:repeat(4,minmax(0,1fr))}.hero .title{font-size:22px}}
/* tables */
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{color:var(--text2);font-weight:650;font-size:12px}
tr.today td{background:var(--tint)}
.tbl{overflow-x:auto}
table.days td:first-child{white-space:nowrap;font-weight:650;width:74px}
table.days .ct{color:var(--text2)}table.days .ct .pol{font-size:11.5px;font-weight:650}
.pol.UY{color:var(--goodtx)}.pol.DEG{color:var(--warntx)}.pol.ATLA{color:var(--badtx)}
.kbadge{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--k-easy)}
.kbadge.k-long{background:var(--k-long)}.kbadge.k-quality{background:var(--k-quality)}.kbadge.k-rest,.kbadge.k-cross{background:var(--k-rest)}.kbadge.k-race{background:var(--k-race)}
details.wk{margin-bottom:8px}details.wk>summary,details.more>summary{cursor:pointer;list-style:none;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-weight:650}
details.wk>summary::before,details.more>summary::before{content:"▸ ";color:var(--muted)}details[open].wk>summary::before,details[open].more>summary::before{content:"▾ "}
details.wk>.body,details.more>.body{padding:10px 2px 0}
details.more{margin-bottom:12px}
.bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden;display:inline-block;width:110px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--s1)}

.road{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.ph{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px}
.ph.current{outline:2px solid var(--s1)}.ph.done{opacity:.72}
.ph .n{font-weight:700;font-size:13.5px}.ph .lk{font-size:20px;font-weight:750;color:var(--text)}.ph .cp{margin-top:6px;color:var(--text2)}
/* misc */
.chart{position:relative;height:250px}.chart.sm{height:170px}.chart.tall{height:320px}
.pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px;font-size:12px}
.pill.on{background:var(--s1);color:#fff;border-color:var(--s1);cursor:pointer}.pill.f{cursor:pointer}
.rc{border-left:4px solid var(--s1);padding-left:10px;margin:10px 0}
.rc .lv{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase}
.rc a{color:var(--s1)}
#map{height:380px;border-radius:10px}
.big{font-size:30px;font-weight:750;line-height:1.1}
.distbar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0}
.distbar div{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:650;color:#111}
ul.tight{margin:4px 0;padding-left:18px}ul.tight li{margin:3px 0}
.legend{font-size:12px;color:var(--text2);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
.lightbar{margin:-4px 0 10px;padding:7px 10px;border-radius:8px;font-size:13.5px;font-weight:600}
.lightbar.y{background:rgba(250,178,25,.18);color:var(--warntx)}.lightbar.r{background:rgba(208,59,59,.15);color:var(--badtx)}.lightbar.n{background:var(--tint);color:var(--text2)}
.d7 .kl{font-size:10.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
@media(max-width:640px){.htop .sub{display:none}
 table.days,table.days tbody,table.days tr,table.days td{display:block;width:100%}table.days tr:first-child{display:none}
 table.days tr{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:6px 8px;background:var(--surface2)}
 table.days td{border:0;padding:3px 0}table.days td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
</style>
</head>

": "'Shortage' etiketi Garmin'in yük dağılımı hedefinden geliyor; maraton hazırlığı için bağlayıcı değil."}, {"type": "LACTATE_THRESHOLD", "label": "Eşik", "action": "DEĞİŞTİR", "how": "Günü tut, içeriği benim: 2×10' / 2×12' / 3×8' @5:08–5:15, HR ≤172.", "why": "Coach eşik pace'i (4:45) gerçek eşiğinden ~20 sn hızlı."}, {"type": "ANAEROBIC_CAPACITY", "label": "Anaerobik", "action": "DEĞİŞTİR → strides", "how": "25–30' kolay + 6×20\" strides (%85 efor, sprint değil), aralar yürüyüş.", "why": "Maratona katkısı ~0, sakatlık riski var."}, {"type": "VO2MAX", "label": "VO2max", "action": "DEĞİŞTİR → strides / ATLA", "how": "Build'de strides; son 2 haftada ATLA (Coach taper'ı 9–13 gün ve son haftaya VO2 koyabiliyor).", "why": "Hedef yarış için öncelik değil."}, {"type": "STRENGTH_CORE", "label": "Core", "action": "UY", "how": "Cuma dinlenme gününe veya kolay gün akşamına.", "why": "Ucuz sakatlık sigortası."}, {"type": "STRENGTH_CIRCUIT", "label": "Tam Gövde Dairesel", "action": "UY (Salı akşamı)", "how": "Kalite günü akşamı (zor gün zor). Uzun koşudan önceki 2 gün yapma. Taper'da sadece core.", "why": "Kolay günler kolay kalsın."}, {"type": "REST", "label": "Dinlenme", "action": "UY", "how": "Bisiklet/yürüyüş serbest, HR <120.", "why": ""}], "rules": [{"id": "pain_stop", "text": "Kemikte noktasal ağrı, tek ayak sekmede ağrı ya da aksama → koşu O GÜN biter, ertesi gün koşu yok, bana (panele) yaz.", "why": "Kemik stresi erken yakalanırsa 1–2 hafta, geç yakalanırsa 6–12 hafta. Önceki sakatlık en güçlü risk faktörü (Lagas 2020)."}, {"id": "stop", "text": "Plandaki km bir TAVANdır. Saat seansı bitince koşu biter; soğuma yürüyüştür.", "why": "Son 4 haftada koşuların yarısında plan aşıldı (6→10, 16→19, 6→7.4). Tendon/kemik kas ve kalpten 2–3 hafta geriden gelir."}, {"id": "freeze", "text": "Uzun koşuda plan km'si %5'ten fazla aşılırsa bir sonraki uzun koşu ARTMAZ (aynı km tekrarlanır).", "why": "Aşımın somut bedeli olsun; 30 günlük en uzun tabanı plansız büyümesin."}, {"id": "bank", "text": "'İyi hissediyorum' fazlası uzun koşuya değil, hafta içi kolay koşuya +1–2 km olarak gider — ve bunu önceden panelde görürsün, koşarken karar vermezsin.", "why": "Karar koşu öncesi verilir, koşu sırasında değil."}, {"id": "easy", "text": "Kolay: HR ≤150 (sıcak/yokuş ≤153). Pace sonuçtur.", "why": "LT1 tahmini ~150–155; son 3 kolay koşun (146–147) tam doğru yerde."}, {"id": "one_q", "text": "Haftada 1 kalite seansı (Salı) + uzun koşudaki MP bloğu. Başka hızlı iş yok.", "why": "Sınırlayıcı dayanıklılık, hız değil."}, {"id": "spike", "text": "Uzun koşu, son 30 günün en uzununu %10'dan fazla aşmaz (19→21→23→25).", "why": "Frandsen 2025 BJSM (n=5.205): son 30 günün en uzununu %10–30 aşan seans sakatlık hızı ×1.64, %30–100 ×1.52, >%100 ×2.28. Plan aşımı bu eşiği kendiliğinden deler: 21 yerine 23 = +%21."}, {"id": "rest", "text": "Cuma tam dinlenme. Pazartesi koşu yok (bisiklet/yürüyüş). Pazar çok kolay 30'.", "why": "Haftada 2 darbesiz gün; hacim uzun koşu + kaliteye."}, {"id": "strides", "text": "Strides = 20 sn, %85 efor (10K yarış hissi), son 5 sn yavaşla; saatin pace'ine bakma. Aralar yürüyüş.", "why": "Hedef 4:25–4:45 iken 4:04'e kaçtı; efor tanımı daha kolay tutulur."}, {"id": "pain", "text": "Aynı yerde 2 gün süren ağrı → o hafta uzun koşu −%20, kalite yok, bana (panele) not düş.", "why": ""}, {"id": "sleep", "text": "Uyku <6 sa iki gece üst üste → kalite seansı kolay koşuya döner.", "why": "Uyku kısıtı sakatlık riskini ve toparlanmayı etkiler."}, {"id": "missed_long", "text": "Kaçan uzun koşu bir sonraki haftaya taşınmaz; progresyon oradan devam eder (10 Eki kaçarsa pik 23 km).", "why": "Sıkıştırma = sıçrama."}, {"id": "illness", "text": "Taper'da hastalık: boyun üstü (burun/boğaz) → kolay kısa koşu serbest; ateş/boyun altı (göğüs, kas ağrısı) → koşu yok, yarışa 3 gün kala ateş varsa yarış kararını birlikte veririz.", "why": "'Neck check' kuralı."}], "readiness_rules": {"red": ["Readiness < 30", "HRV 7g bazın ≥10 ms altında 2 gün üst üste", "Ağrı (kemi a trail tırnağı."}], "adios_pro4": {"verdict": "RİSKLİ — sadece sıkı koşullarla kabul edilebilir", "spec": "Lab (RunRepeat): 36.6/28.5 mm, drop 8.1 (marka 39/33, 6 mm), 200 g, EnergyRods 2.0 (%60 fulcrum), Lightstrike Pro 29.3 Asker-C (Pro 3: 37.6 — çok daha yumuşak), enerji dönüşü %80.4, torsiyon 22.7 N (süper ayakkabılar arasında en az rijitlerden), topuk 80.4 mm / baş parmak 69.5 mm (Pro 3: 84.0 / 77.8 — 8 mm daralma).", "sources": "6 bağımsız kaynak: RunRepeat lab, BelieveInTheRun (inceleme + ilk izlenim), RunningShoesGuru, SoleReview, Doctors of Running, Trendyol. (1. turdaki 'kaçın' tek cümleye dayanıyordu; bu tur mekanizma seviyesinde 5/6 konsensüs.)", "findings": ["HIZ KAPILI: SoleReview en iyi çalışma bölgesini <4:30/km olarak veriyor; senin tüm hedef bandın (5:40–6:20) bunun dışında. BitR: 'yavaş tempoda anlamsız, yüksek RPM'de gerçek rengini gösteriyor'. DoR (Matt Klein, DPT): '5K–yarı maraton ayakkabısı, daha uzun için yeterince stabil değil'. Muhalif: DoR eş-yorumcu David 'yarı/maratonda parlıyor' (1 ses).", "TOPUK: RunRepeat topuk sayacı 1/5, 'her topuk vurumlusu için dengesiz'; SoleReview: oyuk topuk boşluğu sıkışıyor, topuk vuruşunda negatif efektif drop.", "ÖN AYAK / AŞİL: BitR tek makalede 3 gerçek yarış günü vakası (mor tırnak, km 35'te uyuşma, km 16'da parçalanan topuk) ve 'yapısal, numara hatası değil' (aynı koşucu iki numarada). SoleReview + DoR mekanizmayı doğruluyor.", "EN YAKIN ANALOG: 4:25'lik (≈6:17/km) bir pacer yarış sonunda 'çubukları arkta hissettim' diyor.", "PRO 3 daha affediciydi ('halkın süper ayakkabısı'); Pro 4 'eğitim tekerleklerini kaldırdı'.", "Dayanıklılık: ~160 km zirve, ~725 km yapısal. Numara: oybirliğiyle +0.5 (SoleReview: büyütmek rocker verimini düşürür — açık trade-off).", "TR: erkek ~10.200–16.000 TL (Trendyol resmi satıcı rozetli tercih; adidas.com.tr 403)."], "conditions": ["+0.5 numara zorunlu", "≥2 test koşusu, biri ≥15–18 km hedef tempoda (sorunlar km 24–35'te çıkıyor, shakeout'ta değil)", "Her testten sonra ayak kontrolü: morarma/uyuşma/sıcak nokta = kesin dur", "Sadece yarış günü, antrenman hacmi için değil", "Yedek yarış ayakkabısı hazır (Vomero Plus)"]}, "mine": ["Adios Pro 4 kararı sporcunun; koşullu kabul: +0.5 numara, 2 test — 8 Eki kolay 7 km + strides (oturuş), 17 Eki karar koşusunun 8 km MP bloğu (yarış temposunda, yorgun bacakta).", "Test yarış temposunda olmalı, eşik (5:10) seansında değil: ayakkabı yavaş tempoda dengesiz raporlanıyor, topuk basanlar için dezavantaj (16-race-day-evidence).", "17 Eki'de uyuşma, sıcak nokta, topuk kayması veya baldır/Aşil ağrısı → yarış Vomero Plus. Kazanç büyük ihtimalle %1–2; risk almaya değmez.", "Vomero Plus: Garmin'de 219 km (öncesi Apple dönemi dahil ~300+); yarışa kadar yeterli, yeni ayakkabı yok.", "Yedek: Vomero Plus yarışa ~550 km ile girer. İstersen şimdi ikinci bir Vomero Plus (ya da aynı kalıp) al, 30–50 km alıştır — hem uzun koşu hem yedek yarış ayakkabısı. Adios en fazla 20 km test edilebiliyor; raporlanan sorunlar km 24–35'te."]}, "glossary": [["Temel (Base)", "Kolay aerobik koşu, HR ≤150 (sıcak/yokuşta 153), konuşabilirsin. Antrenmanın çoğu. Mitokondri, kılcal damar, yağ yakımı."], ["Toparlanma (Recovery)", "Çok kolay koşu, HR ≤140. Amaç adaptasyon değil kan dolaşımı; zor günün ertesinde. Yavaş gitmek beceri ister."], ["Eşik (Lactate Threshold)", "Laktatın birikmeye başladığı yoğunluk; sende HR ~176–179, pace ~5:05–5:10. Seansta bant 5:08–5:15, HR ≤172, toplam 20–30 dk."], ["Tempo", "Eşiğin hemen altında, 20–30 dk sürekli (sen 14 Eyl'de 5.5 km @ 5:04, HR 173). Eşik ile aynı aile; haftada toplam 1 tane yeter."], ["Maraton temposu (MP)", "Yarışta tutacağın tempo: ~5:55–6:00 (4:10–4:15 planı). 3 Eki (5 km), 17 Eki (8 km, karar), 24 Eki (5 km) uzun koşu içinde."], ["Anaerobik kapasite", "60–90 sn tam gaz tekrarlar (Coach: 7×1' @ 4:05). Laktat toleransı, 1500–5K finali. Maratona faydası ≈0, sakatlık riski yüksek → strides'a çeviriyoruz."], ["VO2max seansı", "3–5 dk tekrarlar @ ~4:35–4:50 (5K temposu civarı), eşit dinlenme. Oksijen kullanım tavanını iter. Build'de kısaltılır, taper'da atlanır."], ["Strides", "6 × 20 sn kontrollü hızlanma, %85 efor (10K yarış hissi), aralar yürüyüş. Laktat birikmez; form/kadans/sinir-kas uyarımı. Sprint değil."], ["Uzun koşu", "Haftanın en uzun koşusu, gövde HR ≤152, son bölüm ≤158. Pik 25 km (10 Eki, yarıştan 3 hf önce). Kas dayanıklılığı, glikojen ekonomisi, bağırsak antrenmanı."], ["Koş-yürü (Galloway)", "Planlı yürüyüş molaları (örn. 4' koş / 1' yürü). Pes değil strateji; yarışta C planı (km 30+ kötü giderse)."], ["Drift / decoupling", "Sabit eforda hız/HR oranının ilk yarıdan ikinci yarıya bozulması. <%5 iyi işaret ama tek başına hazır olma ölçütü değil (ısıya çok duyarlı)."], ["Training Effect (TE)", "Garmin 0–5: 2–3 koruma, 3–4 geliştirme, 4–5 aşırı yükleme. Uzun koşu 3.2–3.8, eşik 3.5–4.2 beklenir."], ["ATL / CTL / TSB", "ATL = 7 günlük yorgunluk, CTL = 42 günlük fitness, TSB = CTL−ATL = form. Build'de TSB −50…−150 normal; yarış günü +15…+25 hedef."], ["ACWR", "Akut/kronik yük oranı. Sakatlık tahmin gücü yazı-tura düzeyinde (Impellizzeri 2021) — bilgi amaçlı; karar kuralı tek seans sıçraması (%10)."], ["Running tolerance", "Garmin'in 'bu hafta taşıyabileceğin km' tahmini. Validasyonu yok — hedef değil, üst sınır bilgisi."], ["Readiness", "Garmin'in uyku + HRV + toparlanma + yük bileşkesi. Validasyonu sınırlı; tek başına karar vermez — panelde hazırlık ışığının bir girdisi."], ["HRV", "Kalp atım aralığı değişkenliği; yüksek ve stabil = toparlanmış. 7 günlük bazdan 10 ms düşüş = yükü azalt sinyali."], ["Taper", "Yarıştan 2–3 hafta önce hacmi %30–50 azaltıp yoğunluğu koruma. Fitness kaybolmaz, yorgunluk gider; performans +%2–3."], ["Karb yükleme", "Yarıştan 2–3 gün önce 8–10 g/kg/gün karbonhidrat (530–660 g). Glikojen depolarını doldurur; 'duvar'ı öteler."], ["Bağırsak antrenmanı", "Koşarken karbonhidrat alımına mideyi alıştırma: 30 → 60 g/sa'a 3–4 haftada kademeli çıkış. Jel toleransı öğrenilir."]], "previous_coach": [{"topic": "Uzun koşu 21→ document.getElementById('hcount').innerHTML=M.days_to_race>0?`${M.days_to_race} gün <small>1 Kas 09:00</small>`:M.days_to_race===0?'BUGÜN YARIŞ':'Yarış bitti';

const nav=document.getElementById('nav'),main=document.getElementById('main'),R={},done={};
VIEWS.forEach(([id,l])=>{const b=h(`<button data-v="${id}">${l}</button>`);b.onclick=()=>show(id);nav.appendChild(b);main.appendChild(h(`<section class="view" id="v-${id}"></section>`))});
function show(id){if(!R[id])id='bugun';nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));
 document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('active',s.id==='v-'+id));
 if(!done[id]){done[id]=1;try{R[id](document.getElementById('v-'+id))}catch(e){document.getElementById('v-'+id).innerHTML=`<div class="card">Bu görünüm çizilemedi: ${esc(e.message)}</div>`;console.error(e)}}
 if(location.hash!=='#'+id)history.replaceState(null,'','#'+id);window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

/* ---------- ortak parçalar ---------- */
function mineChips(m){if(!m)return'';const c=[];
 if(m.km_max)c.push(`<span class="chip cap">${m.km&&m.km!==m.km_max?m.km+' km · tavan '+m.km_max:'≤ '+m.km_max} km</span>`);else if(m.km===0)c.push(`<span class="chip">koşu yok</span>`);
 if(m.min)c.push(`<span class="chip">~${m.min} dk</span>`);if(m.hr_cap)c.push(`<span class="chip cap">HR ≤ ${m.hr_cap}</span>`);if(m.pace)c.push(`<span class="chip">${esc(m.pace)}</span>`);return `<div class="chips">${c.join('')}</div>`}
function coachLine(day){if(!day.coach.length)return '';return day.coach.filter(c=>c.source!=='mine').map(c=>{
 const km=c.est_km?` ${(+c.est_km).toFixed(1)} km`:'',mn=c.est_min?` · ${c.est_min} dk`:'';const act=c.policy||'';
 const strike=/ATLA|DEĞİŞTİR/.test(act)&&!/strength|STRENGTH/.test(c.type);
 return `${strike?'<s>':''}Coach: ${esc(c.name)}${km}${mn}${strike?'</s>':''} <span class="pol ${polcls(act)}">→ ${esc(act)}</span>`}).join('<br>')}
function mineGarmin(day){const g=day.coach.find(c=>c.source==='mine');return g?`<div class="garmin">⌚ Saatte: <b>${esc(g.name.replace(' (benim)',''))}</b>${g.completed?' · tamamlandı ✓':''}</div>`:''}
function doneLine(day){const r=day.done.filter(a=>a.type==='running');const o=day.done.filter(a=>a.type!=='running');
 return r.map(a=>`<b>${a.km.toFixed(1)} km</b> · ${a.pace}/km · HR ${a.avg_hr??'-'}`).join('<br>')+(o.length?`<div class="sub">${o.map(a=>esc(a.name)+' '+Math.round(a.min)+' dk').join(' · ')}</div>`:'')}

/* ================= BUGÜN ================= */
function lightBar(){const L=M.light;if(L.stale)return `<div class="lightbar n">Bugünün Garmin verisi henüz yok (son: ${fmtD(L.date)}) — hazırlığı hissine göre değerlendir.</div>`;
 if(L.level==='y'||L.level==='r')return `<div class="lightbar ${L.level}">${L.level==='r'?'KIRMIZI':'SARI'} ışık (${esc(L.reasons.join(', '))}) → ${esc(L.action)}</div>`;return ''}
function raceBlock(){const rp=P.race_plan,g=A.goal_model;return `<div class="flex"><b>Hedef:</b> ${esc(rp.default)} · merkez ${esc(g.central)}<br><b>İlk 10 km:</b> ${esc(rp.segments[0].pace)} → ${esc((rp.segments.find(s=>s.km==='6–21')||{}).pace||'')} · HR ${esc((rp.segments.find(s=>s.km==='6–21')||{}).hr||'')}<br><b>Yakıt:</b> ${rp.fuel.slice(0,4).map(f=>esc(f.t)+': '+esc(f.what)).join(' · ')}<br><a href="#yaris">Tam yarış planı →</a></div>`}
R.bugun=el=>{
 const t=M.today_card,m=t&&t.mine,L=M.light,lt=M.latest;
 let hero;
 if(!m){hero=`<div class="card hero"><div class="eyebrow">Bugün · ${t?t.dow+' '+fmtD(t.date):fmtD(M.today)}</div><div class="title">Planda karar yok</div><div class="why">${M.days_to_race<0?'Yarış sonrası: toparlanma — ilk hafta yürüyüş/bisiklet, koşuya dönüşü koçla konuş.':'schedule.json\'da bugün için karar yok — dinlen ya da koça sor.'}</div></div>`}
 else{const ran=t.done.some(a=>a.type==='running');
  hero=`<div class="card hero ${kcls(m.kind)}">
   <div class="eyebrow">Bugün · ${t.dow} ${fmtD(t.date)}${M.phase?' · '+esc(M.phase.name):''}</div>
   <div class="title">${esc(m.title)}</div>${lightBar()}${mineChips(m)}${m.kind==='race'?raceBlock():''}
   ${m.structure&&m.structure.length?`<ol class="struct">${m.structure.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
   ${m.fuel?`<div class="fuel">⛽ ${esc(m.fuel)}</div>`:''}
   ${m.strength?`<div class="fuel">💪 ${esc(m.strength)}</div>`:''}
   ${m.why?`<div class="why"><b>Neden:</b> ${esc(m.why)}</div>`:''}
   ${m.flex?`<div class="flex">↔ ${esc(m.flex)}</div>`:''}
   ${mineGarmin(t)}
   ${t.coach.some(c=>c.source!=='mine')?`<div class="coachwas">${coachLine(t)}</div>`:''}
   ${ran?`<div class="coachwas">✓ Yapıldı: ${doneLine(t)} ${dev(t.dev)}</div>`:''}
  </div>`}
 // hazırlık
 const acwr=lt.atl&&lt.ctl?(lt.atl/lt.ctl).toFixed(2):null;
 const tile=(k,v,d,cls='')=>`<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v??'–'}</div><div class="d">${d||''}</div></div>`;
 const hrvD=lt.hrv!=null&&lt.hrv_weekly?lt.hrv-lt.hrv_weekly:null;
 const light=`<div class="card"><div class="row"><h3 style="margin:0">Hazırlık</h3><span class="st ${L.stale?'n':L.level}">${L.stale?'VERİ ESKİ':stLbl[L.level]}</span><span class="sub">${L.stale?`⚠ bugünün verisi yok — son: ${fmtD(L.date)}`:''}</span></div>
  <div class="sub" style="margin-top:4px">${L.reasons.length?esc(L.reasons.join(' · '))+' → ':''}${esc(L.action)}</div>
  <div class="tiles">
   ${tile('Readiness',lt.readiness,lt.readiness_level?lt.readiness_level.toLowerCase():'',lt.readiness==null?'':lt.readiness<30?'r':lt.readiness<50?'y':'')}
   ${tile('Uyku (son gece)',lt.sleep_h!=null?lt.sleep_h.toFixed(1)+' sa':null,L.sleep3?`3 gece ort. ${L.sleep3} sa`:'',(lt.sleep_h!=null&&lt.sleep_h<5)||(L.sleep3!=null&&L.sleep3<6.5)?'y':'')}
   ${tile('HRV',lt.hrv,hrvD!=null?`7g baz ${lt.hrv_weekly} (${hrvD>0?'+':''}${hrvD}) · 2 gün kuralı`:'',L.reasons.some(x=>x.startsWith('HRV'))?(L.level==='r'?'r':'y'):'')}
   ${tile('Dinlenik HR',lt.rhr,L.rhr_base?`baz ${L.rhr_base}`:'',lt.rhr&&L.rhr_base&&lt.rhr-L.rhr_base>=5?'y':'')}
   ${tile('Toparlanma',lt.recovery_h!=null?Math.round(lt.recovery_h)+' sa':null,'Garmin',lt.recovery_h!=null&&lt.recovery_h>36?'y':'')}
   ${(()=>{const S=M.week_sum[M.week[0]?.week]||{};return tile('Bu hafta',(S.done_km??0)+' km','plan '+(S.plan_km??'–')+' km'+(S.race?' + yarış':''),'')})()}
  </div></div>`;
 // yarın
 const tm=M.tomorrow_card,tmm=tm&&tm.mine;
 const tomorrow=`<div class="card"><h3>Yarın · ${tm?tm.dow+' '+fmtD(tm.date):''}</h3>${tmm?`<div style="font-weight:700;font-size:16px"><span class="kbadge ${kcls(tmm.kind)}"></span>${esc(tmm.title)}</div>${mineChips(tmm)}<div class="sub">${esc(tmm.why||'')}</div>${tm.coach.some(c=>c.source!=='mine')?`<div class="coachwas">${coachLine(tm)}</div>`:''}${mineGarmin(tm)}`:'<div class="sub">Kayıt yok</div>'}</div>`;
 // uyarılar
 const al=[];const ad=M.adherence;
 if(ad.n)al.push([ad.over>=2?'⚠':'✓',`Son 28 gün plan uyumu: <b>${ad.n-ad.over}/${ad.n}</b> gün plana uygun${ad.extra_km?` · fazladan <b>${ad.extra_km} km</b>`:''}. ${ad.over>=2?'Tavan = bitiş çizgisi; fazlası hafta içine.':''}`]);
 if(M.spike)al.push([M.spike.level==='ok'?'✓':'⚠',`Sıradaki uzun koşu ${fmtD(M.spike.date)} <b>${M.spike.km} km</b>, son 30 günün en uzununu (${M.spike.max30} km) <b>%${M.spike.pct}</b> aşıyor${M.spike.level!=='ok'?' — sınırda: plan km\'sinde dur.':''}`]);
 const cw=M.weekly.find(w=>w.week===M.week[0]?.date);const pw=cw?M.weekly[M.weekly.indexOf(cw)-1]:null;
 if(cw&&pw)al.push(['📊',`Geçen hafta ${pw.km} km · bu hafta plan ${cw.plan_km} km`]);
 L.reasons.forEach(r=>al.push(['⚠',esc(r)]));
 const oq=P.open_questions||[];const alerts=`<div class="card"><h3>Dikkat</h3>${al.map(a=>`<div class="alert"><span class="ic">${a[0]}</span><span>${a[1]}</span></div>`).join('')}${oq.length?`<details class="more" style="margin:8px 0 0" ${oq.some(q=>q.startsWith('ÖNCELİKLİ'))?'open':''}><summary>❓ Sana sorularım (${oq.length})</summary><div class="body">${oq.map(q=>`<div class="alert"><span class="ic">❓</span><span>${esc(q)}</span></div>`).join('')}</div></details>`:''}</div>`;
 // hafta şeridi
 const ws=M.week_sum[M.week[0]?.week]||{plan_km:0,done_km:0};const KL={easy:'kolay',recovery:'toparlanma',long:'uzun',quality:'kalite',strides:'strides',rest:'dinlenme',cross:'çapraz',race:'yarış',shakeout:'shakeout'};
 const week=`<div class="card"><h3>Bu hafta · plan ${ws.plan_km} km${ws.race?' + yarış':''} · yapılan ${ws.done_km} km</h3><div class="week7">${M.week.map(d=>{const m=d.mine;return `<div class="d7 ${m?kcls(m.kind):''} ${d.is_today?'today':''}"><div class="dd"><span>${d.dow}</span><span class="muted">${d.date.slice(8)}</span></div>${m?`<div class="kl">${KL[m.kind]||''}</div>`:''}<div class="tt">${m?esc(m.title):'—'}</div><div class="km">${m&&m.km?'plan '+m.km+' km':''}</div>${d.run_km?`<div class="dv ${d.dev&&d.dev.level!=='ok'?d.dev.level:'ok'}">${d.dev&&(d.dev.level==='bad'||d.dev.level==='warn')?'⚠':'✓'} ${d.run_km.toFixed(1)} km</div>`:''}${d.dev&&(d.dev.level==='bad'||d.dev.level==='warn')?`<div class="dv ${d.dev.level}">${esc(d.dev.text)}</div>`:''}</div>`}).join('')}</div></div>`;
 // son koşu
 const lr=M.last_run;const last=lr?`<div class="card"><h3>Son koşu · ${fmtD(lr.date)}</h3><div style="font-weight:700">${esc(lr.name)}</div>
   <div class="tiles">${tile('Mesafe',lr.km.toFixed(1)+' km',lr.planned?`tavan ${lr.planned.km_max??'-'} km`:'')}${tile('Pace',lr.pace_str+'/km','')}${tile('Ort. HR',lr.avg_hr,lr.planned&&lr.planned.hr_cap?`tavan ${lr.planned.hr_cap}`:'',lr.planned&&lr.planned.hr_cap&&lr.avg_hr>lr.planned.hr_cap?'y':'')}${tile('Plan uyumu',lr.dev?({ok:'✓',warn:'~',bad:'✗',miss:'–'}[lr.dev.level]):'–',lr.dev?esc(lr.dev.text):'')}</div>
   ${lr.note?`<div class="why" style="margin-top:8px">${esc(lr.note)}</div>`:''}${lr.weather?`<div class="sub">${esc(lr.weather)}</div>`:''}</div>`:'';
 // yol haritası mini
 const nextCP=P.phases.find(p=>p.status!=='done'&&p.checkpoint);
 const road=`<div class="card"><h3>Yol haritası</h3><div class="sub">Faz: <b>${M.phase?esc(M.phase.name):'—'}</b></div>${nextCP?`<div style="margin-top:6px">Sıradaki kontrol noktası: <b>${esc(nextCP.checkpoint)}</b></div>`:''}
   <div class="sub" style="margin-top:6px">Hedef (ön): <b>${esc(A.goal_model.central)}</b> · aralık ${esc(A.goal_model.range)} — <a href="#yaris">Yarış</a></div></div>`;
 el.innerHTML=hero+light+`<div class="grid g2">${tomorrow}${alerts}</div>`+week+`<div class="grid g2">${last}${road}</div>`;
};

R.plan=el=>{
 const road=`<div class="card"><h3>Yol haritası — yarışa ${M.days_to_race} gün</h3><div class="road">${P.phases.map(p=>`<div class="ph ${p.status}">
  <div class="n">${p.n}. ${esc(p.name)}</div><div class="sub">${fmtD(p.start)} – ${fmtD(p.end)}</div>
  <div style="margin-top:6px">Uzun: <span class="lk">${p.long?p.long.km:'-'}</span> km${p.actual_long&&p.status!=='future'?` <span class="sub">(en uzun ${p.actual_long})</span>`:''}</div>
  <div>Hafta: <b>${p.actual_km}</b> / plan ${p.plan_km??p.target_km} km</div><div class="sub">Kalite: ${esc(p.quality||'-')}</div>
  ${p.checkpoint?`<div class="cp">🎯 ${esc(p.checkpoint)}</div>`:''}${p.note?`<div class="cp">${esc(p.note)}</div>`:''}</div>`).join('')}</div></div>`;
 const ladder=`<div class="card"><h3>Uzun koşu merdiveni (≥12 km) — yapılan ve plan</h3><div class="chart" id="c-ladder"></div><div class="legend"><i style="background:${C.s2}"></i>yapılan<i style="background:${C.s1l};border:1px solid ${C.s1}"></i>plan<i style="background:${C.s5}"></i>yarış</div><div class="sub">Kural: her uzun koşu son 30 günün en uzununu ~%10'dan fazla aşmaz.</div></div>`;
 // haftalar
 const weeks={};M.days.forEach(d=>{(weeks[d.week]=weeks[d.week]||[]).push(d)});
 const cur=M.week[0]?.date;
 const wkHtml=Object.entries(weeks).filter(([w])=>w>='2026-09-14').map(([w,ds])=>{
  const ph=P.phases.find(p=>p.start===w);const race=ds.some(d=>d.mine&&d.mine.kind==='race');const S=M.week_sum[w]||{};const pk=S.partial?(ph?ph.target_km:null):S.plan_km,dk=S.done_km||0;
  return `<details class="wk" ${w===cur?'open':''}><summary>${fmtD(w)} haftası${ph?' · '+esc(ph.name):''} <span class="sub">— plan ${pk!=null?pk:'—'} km${race?' + yarış':''} · yapılan ${dk} km</span></summary><div class="body tbl"><table class="days">
   <tr><th>Gün</th><th>Coach</th><th>Karar (koç)</th><th>Yapılan</th></tr>
   ${ds.map(d=>{const m=d.mine;return `<tr class="${d.is_today?'today':''}"><td>${d.dow} ${d.date.slice(8)}</td>
    <td class="ct" data-l="Coach">${d.coach.filter(c=>c.source!=='mine').map(c=>`${esc(c.name)}${c.est_km?' '+(+c.est_km).toFixed(1)+' km':''}${c.est_min&&!c.est_km?' '+c.est_min+' dk':''}<br><span class="pol ${polcls(c.policy)}">${esc(c.policy||'')}</span>`).join('<br>')||'<span class="muted">—</span>'}</td>
    <td data-l="Karar (koç)">${m?`<span class="kbadge ${kcls(m.kind)}"></span><b>${esc(m.title)}</b>${m.km_max?` <span class="sub">≤${m.km_max} km</span>`:''}${m.hr_cap?` <span class="sub">HR ≤${m.hr_cap}</span>`:''}${m.structure&&m.structure.length?`<div class="sub">${m.structure.map(esc).join(' → ')}</div>`:''}${m.why?`<div class="sub"><i>${esc(m.why)}</i></div>`:''}${m.by&&m.by!=='yeni koç'?`<div class="sub muted">(${esc(m.by)})</div>`:''}`:'<span class="muted">—</span>'}${d.coach.some(c=>c.source==='mine')?'<div class="sub">⌚ saatte</div>':''}</td>
    <td data-l="Yapılan">${d.done.length?doneLine(d)+' '+dev(d.dev):(d.dev?dev(d.dev):'')}</td></tr>`}).join('')}
  </table></div></details>`}).join('');
 const zones=`<div class="card"><h3>Bölgeler (${esc(A.updated)})</h3><div class="tbl"><table><tr><th>Bölge</th><th>HR</th><th>Pace</th><th>Kullanım</th></tr>${A.zones.map(z=>`<tr><td><b>${esc(z.name)}</b></td><td>${esc(z.hr)}</td><td>${esc(z.pace)}</td><td class="sub">${esc(z.use)}</td></tr>`).join('')}</table></div>
  <div class="sub" style="margin-top:6px">Eşik tahmini <b>${esc(A.lt_estimate.pace)}</b> — ${A.lt_estimate.evidence.map(e=>fmtD(e.date)+': '+esc(e.desc)).join(' · ')}. ${esc(A.lt_estimate.garmin.note)}</div></div>`;
 const pol=`<div class="card"><h3>Garmin Coach politikası</h3><div class="sub" style="margin-bottom:6px">Coach = takvim + toparlanma sensörü; içerik koçtan. Saatte "(benim)" seansı varsa o geçerli.</div><div class="tbl"><table><tr><th>Coach seansı</th><th>Aksiyon</th><th>Nasıl</th><th>Neden</th></tr>${P.coach_policy.map(p=>`<tr><td><b>${esc(p.label)}</b><div class="sub">${esc(p.type)}</div></td><td><span class="pol ${polcls(p.action)}">${esc(p.action)}</span></td><td>${esc(p.how)}</td><td class="sub">${esc(p.why)}</td></tr>`).join('')}</table></div></div>`;
 const rules=`<div class="card"><h3>Kurallar</h3>${P.rules.map(r=>`<div class="alert"><span class="ic">•</span><span><b>${esc(r.text)}</b>${r.why?`<div class="sub">${esc(r.why)}</div>`:''}</span></div>`).join('')}
  <h3 style="margin-top:12px">Hazırlık ışığı</h3><div class="sub"><span class="st r">KIRMIZI</span> ${P.readiness_rules.red.map(esc).join(' · ')} → ${esc(P.readiness_rules.actions.red)}</div><div class="sub" style="margin-top:4px"><span class="st y">SARI</span> ${P.readiness_rules.yellow.map(esc).join(' · ')} → ${esc(P.readiness_rules.actions.yellow)}</div></div>`;
 el.innerHTML=road+ladder+`<h3 class="eyebrow" style="margin:16px 2px 8px">Gün gün: Coach · Karar · Yapılan</h3>`+wkHtml+`<div class="grid g2">${zones}${rules}</div>`+pol;
 const ld=M.ladder;chart(document.getElementById('c-ladder'),{type:'bar',data:{labels:ld.map(x=>fmtD(x.date)),datasets:[{label:'km',data:ld.map(x=>x.km),backgroundColor:ld.map(x=>x.kind==='done'?C.s2:x.title&&/MARATON/.test(x.title)?C.s5:C.s1l),borderColor:ld.map(x=>x.kind==='done'?C.s2:x.title&&/MARATON/.test(x.title)?C.s5:C.s1),borderWidth:ld.map(x=>x.kind==='done'?0:1.5)}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>`${ld[i.dataIndex].km} km — ${ld[i.dataIndex].kind==='done'?'yapılan':'plan: '+(ld[i.dataIndex].title||'')}`}}},scales:{y:{beginAtZero:true,title:{display:true,text:'km'}},x:{grid:{display:false}}}}});
};

/* ================= TREND ================= */
R.trend=el=>{
 const wk=M.weekly.filter(w=>w.week>='2026-04-27');const cw=M.weekly.find(w=>w.week===M.week[0]?.date);
 const ef=M.ef,lastEf=ef.length?ef[ef.length-1]:null;
 const preds=M.preds,lp=preds.length?preds[preds.length-1].marathon:null;
 const tile=(k,v,d)=>`<div class="tile"><div class="k">${k}</div><div class="v">${v??'–'}</div><div class="d">${d||''}</div></div>`;
 const max30=Math.max(0,...M.runs.filter(r=>r.date>=new Date(new Date(M.today)-30*864e5).toISOString().slice(0,10)&&r.date<=M.today).map(r=>r.km));
 const kpi=`<div class="card"><h3>Özet</h3><div class="tiles">${tile('Bu hafta',cw?cw.km+' km':null,cw?'plan '+cw.plan_km:'')}${tile('4 hf ort.',cw&&cw.avg4?cw.avg4+' km':null,'önceki 4 hafta')}${tile('30 gün en uzun',max30.toFixed(1)+' km','')}${tile('HR 150\'de pace',lastEf?pace(lastEf.pace150):null,'kolay koşu verimi')}${tile('VO2max',M.latest.vo2,'Garmin')}${tile('Garmin tahmini',lp,'ilk maratonda iyimser')}</div></div>`;
 el.innerHTML=kpi+`
  <div class="card"><h3>Haftalık koşu hacmi (km) — Apple + Garmin, plan</h3><div class="chart tall" id="c-vol"></div><div class="legend"><i style="background:${C.s1}"></i>yapılan<i style="background:${C.s1l}"></i>plan<i style="background:${C.s2}"></i>önceki 4 hf ort.</div><div class="sub">Mayıs–Ağustos medyanı ~29 km/hf; Eylül 45–59. Zirve planı ${Math.max(...M.weekly.filter(w=>w.future).map(w=>w.plan_km),0)} km. Koşusuz haftalar 0 olarak gösterilir.</div></div>
  <div class="grid g2">
   <div class="card"><h3>Aerobik verim: HR 150'de tahmini pace</h3><div class="chart" id="c-ef"></div><div class="legend"><i style="background:${C.s1}"></i>Garmin kolay koşu<i style="background:${C.s3}"></i>Apple aylık medyan</div><div class="sub">Yukarı = daha hızlı. Kolay koşularda hız/HR oranı; ısı ve yokuş gürültü ekler — trende bak.</div></div>

   <div class="card"><h3>Uyku (saat)</h3><div class="chart sm" id="c-sleep"></div><div class="legend"><i style="background:${css('--warn')}"></i>&lt;6.5 sa (3 gece ort. bu altına inerse sarı ışık)</div></div>
  </div>
  <div class="grid g2">
   <div class="card"><h3>Garmin yükü: akut vs kronik${M.latest.atl&&M.latest.ctl?' · oran '+(M.latest.atl/M.latest.ctl).toFixed(2):''}</h3><div class="chart sm" id="c-load"></div><div class="sub">Akut ≈ son 7 gün, kronik ≈ son ~4 hafta. Oran bilgi amaçlı — sakatlık tahmin gücü zayıf (Impellizzeri 2021); karar kuralı tek seans sıçraması.</div></div>
   <div class="card"><h3>Garmin maraton tahmini (dk)</h3><div class="chart sm" id="c-pred"></div><div class="sub">VO2max tabanlı; ilk maratonda uzun koşu geçmişini yeterince tartmaz. Koç modeli: ${esc(A.goal_model.central)}.</div></div>
  </div>`;
 // hacim
 chart(document.getElementById('c-vol'),{data:{labels:wk.map(w=>fmtD(w.week)),datasets:[
  {type:'bar',label:'yapılan',data:wk.map(w=>w.future?null:w.km),backgroundColor:C.s1,stack:'a'},
  {type:'bar',label:'plan (kalan)',data:wk.map(w=>w.future?w.plan_km:(w.week===M.week[0]?.date?Math.max(0,w.plan_km-w.km):null)),backgroundColor:C.s1l,stack:'a'},
  {type:'line',label:'önceki 4 hf ort.',data:wk.map(w=>w.future?null:w.avg4),borderColor:C.s2,pointRadius:0,tension:.3}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{afterBody:i=>{const w=wk[i[0].dataIndex];return `koşu ${w.n} · en uzun ${w.longest} km${w.ramp!=null?' · değişim %'+w.ramp:''}`}}}},scales:{x:{stacked:true,grid:{display:false},ticks:{maxRotation:0,autoSkip:true,maxTicksLimit:12}},y:{stacked:true,beginAtZero:true,title:{display:true,text:'km'}}}}});
 // EF
 const dn=s=>Date.parse(s+'T12:00:00Z')/864e5,nd=v=>new Date(v*864e5).toISOString().slice(0,10);
 const efm=M.ef_month.map(m=>({x:dn(m.month+'-15'),y:m.pace150,l:m.month}));
 chart(document.getElementById('c-ef'),{type:'scatter',data:{datasets:[{label:'Garmin',data:ef.map(p=>({x:dn(p.date),y:p.pace150,l:fmtD(p.date),n:p.name})),backgroundColor:C.s1},{label:'Apple ay',data:efm,backgroundColor:C.s3,pointStyle:'rectRot',pointRadius:5,showLine:true,borderColor:C.s3}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>`${i.raw.l}: ${pace(i.raw.y)}/km${i.raw.n?' — '+i.raw.n:''}`}}},scales:{x:{type:'linear',min:dn(M.today)-180,max:dn(M.today)+3,ticks:{callback:v=>fmtD(nd(v)),maxTicksLimit:7,maxRotation:0},grid:{display:false}},y:{reverse:true,ticks:{callback:v=>pace(v)},title:{display:true,text:'dk/km'}}}}});
 // kalibrasyon
 const cal=M.calib.filter(c=>c.src!=='LONG');chart(document.getElementById('c-cal'),{type:'scatter',data:{datasets:[{label:'lap',data:cal.filter(c=>c.src==='lap').map(c=>({x:c.pace,y:c.hr,d:c.date})),backgroundColor:C.s7},{label:'seans',data:cal.filter(c=>c.src!=='lap').map(c=>({x:c.pace,y:c.hr,d:c.date,n:c.note})),backgroundColor:C.s2,pointRadius:6}]},
  options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>`${fmtD(i.raw.d)}: ${pace(i.raw.x)}/km · HR ${i.raw.y}${i.raw.n?' — '+i.raw.n:''}`}}},scales:{x:{reverse:true,title:{display:true,text:'pace (dk/km) → hızlı'},ticks:{callback:v=>pace(v)}},y:{title:{display:true,text:'HR'}}}}});
 // toparlanma
 const dd=M.daily.filter(d=>d.date>='2026-08-22');const lab=dd.map(d=>fmtD(d.date));
 const small=(id,ds,yt,extra={})=>chart(document.getElementById(id),{data:{labels:lab,datasets:ds},options:Object.assign({plugins:{legend:{display:ds.length>1,position:'bottom'}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:6,maxRotation:0}},y:{title:{display:!!yt,text:yt}}}},extra)});
 small('c-hrv',[{type:'line',label:'gece',data:dd.map(d=>d.hrv??null),borderColor:C.s1,pointRadius:2,spanGaps:true},{type:'line',label:'7g baz',data:dd.map(d=>d.hrv_weekly??null),borderColor:C.s2,pointRadius:0,spanGaps:true}],'ms');
 small('c-rhr',[{type:'line',label:'RHR',data:dd.map(d=>d.rhr??null),borderColor:C.s1,spanGaps:true,pointRadius:2}],'bpm');
 small('c-sleep',[{type:'bar',label:'uyku',data:dd.map(d=>d.sleep_h??null),backgroundColor:dd.map(d=>d.sleep_h!=null&&d.sleep_h<6.5?css('--warn'):C.s1)}],'sa');
 small('c-load',[{type:'line',label:'akut',data:dd.map(d=>d.atl??null),borderColor:C.s1,pointRadius:0,spanGaps:true},{type:'line',label:'kronik',data:dd.map(d=>d.ctl??null),borderColor:C.s2,pointRadius:0,spanGaps:true}],'');
 const toMin=s=>{if(!s)return null;const p=s.split(':').map(Number);return p.length===3?p[0]*60+p[1]+p[2]/60:p[0]+p[1]/60};
 chart(document.getElementById('c-pred'),{type:'line',data:{labels:preds.map(p=>fmtD(p.date)),datasets:[{label:'Garmin maraton',data:preds.map(p=>toMin(p.marathon)),borderColor:C.s1}]},options:{plugins:{legend:{display:false},tooltip:{callbacks:{label:i=>preds[i.dataIndex].marathon}}},scales:{x:{grid:{display:false}},y:{ticks:{stepSize:0.5,callback:v=>{const s=Math.round(v*60);return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}}}}}});
};

/* ================= YARIŞ ================= */
R.yaris=el=>{
 const g=A.goal_model,rp=P.race_plan,c=M.course;const cols=[C.s3,C.s1,C.s4,C.s2];
 const goal=`<div class="card"><h3>Hedef modeli · ${esc(g.status)}</h3><div class="row"><span class="big">${esc(g.central)}</span><span class="sub">aralık ${esc(g.range)} · güncelleme ${fmtD(g.updated)}</span></div>
  <div class="distbar">${g.dist.map((d,i)=>`<div style="flex:${d[1]};background:${cols[i]}" title="${esc(d[0])}: %${d[1]}">${d[1]>=10?esc(d[0])+' %'+d[1]:''}</div>`).join('')}</div>
  <div class="legend">${g.dist.map((d,i)=>`<i style="background:${cols[i]}"></i>${esc(d[0])} %${d[1]}`).join('')}</div>
  <ul class="tight">${g.method.map(m=>`<li class="sub">${esc(m)}</li>`).join('')}</ul>
  <div class="flex"><b>Karar:</b> ${esc(g.decision)}</div><div class="sub">Sonraki güncelleme: ${esc(g.next_update)}</div></div>`;
 const pacing=`<div class="card"><h3>Tempo planı — ${esc(rp.default)}</h3><div class="sub" style="margin-bottom:6px">${esc(rp.status)}</div><div class="tbl"><table><tr><th>km</th><th>Nerede</th><th>Pace</th><th>HR</th><th>İpucu</th></tr>${rp.segments.map(s=>`<tr><td><b>${esc(s.km)}</b></td><td>${esc(s.where)}</td><td>${esc(s.pace)}</td><td>${esc(s.hr)}</td><td class="sub">${esc(s.cue)}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:10px">Karar noktaları</h3><ul class="tight">${rp.decision_points.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`;
 const scen=(rp.scenarios||[]).length?`<div class="card"><h3>Senaryolar (hava / rüzgâr / C planı)</h3><div class="tbl"><table>${rp.scenarios.map(s=>`<tr><td style="white-space:nowrap"><b>${esc(s.name)}</b></td><td>${esc(s.plan)}</td></tr>`).join('')}</table></div></div>`:'';
 const fuel=`<div class="card"><h3>Yakıt planı</h3><div class="tbl"><table>${rp.fuel.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f.t)}</b></td><td>${esc(f.what)}</td></tr>`).join('')}</table></div><div class="sub" style="margin-top:6px">İstasyonlar (resmi harita): ${c.aid.map(a=>`<span class="pill">${a[0].toFixed(1)} ${a[1].includes('Sünger')?'🧽':'🥤'}</span>`).join('')}</div></div>`;
 const mapc=`<div class="grid g2"><div class="card"><h3>Parkur</h3><div id="map"></div><div class="legend"><i style="background:${C.s1}"></i>rota<i style="background:${C.s3}"></i>su+beslenme<i style="background:${C.s4}"></i>su+sünger<i style="background:${C.s8}"></i>start/finiş/dönüş</div></div>
  <div class="card"><h3>Yükseklik profili (${c.race.gain_m} m tırmanış)</h3><div class="chart tall" id="c-ele"></div><div class="tbl"><table>${c.sections.map(s=>`<tr><td><b>${esc(s.km)}</b></td><td>${esc(s.desc)}</td><td class="sub">${esc(s.note)}</td></tr>`).join('')}</table></div></div></div>`;
 const morning=`<div class="grid g2"><div class="card"><h3>Yarış sabahı</h3><ul class="tight">${rp.morning.map(m=>`<li>${esc(m)}</li>`).join('')}</ul><h3 style="margin-top:10px">Cut-off</h3>${Object.entries(c.cutoffs).map(([k,v])=>`<span class="pill">${k} ${v}</span>`).join('')}</div>
  <div class="card"><h3>Kontrol listesi</h3><ul class="tight">${rp.checklist.map(m=>`<li>☐ ${esc(m)}</li>`).join('')}</ul>${(rp.logistics||[]).length?`<h3 style="margin-top:10px">Lojistik (2026)</h3><ul class="tight">${rp.logistics.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}</div></div>`;
 const sh=P.shoes;const shoes=`<details class="more"><summary>Ayakkabı</summary><div class="body"><div class="card"><ul class="tight">${sh.mine.map(m=>`<li>${esc(m)}</li>`).join('')}</ul><div class="tbl"><table><tr><th>Ayakkabı</th><th>Rol</th><th>Not</th></tr>${sh.current.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="sub">${esc(s.spec)}</div></td><td>${esc(s.role)}</td><td class="sub">${esc(s.why)}</td></tr>`).join('')}</table></div>
  <details class="more" style="margin-top:8px"><summary>Adios Pro 4 araştırma notları (önceki koç)</summary><div class="body sub"><p>${esc(sh.adios_pro4.verdict)} — ${esc(sh.adios_pro4.spec)}</p><ul class="tight">${sh.adios_pro4.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div></details></div></div></details>`;
 const N=P.nutrition;const nut=`<details class="more"><summary>Beslenme ürünleri ve ilkeler</summary><div class="body"><div class="card"><div class="sub">${esc(N.note||'')}</div><div class="tbl"><table><tr><th>Ürün</th><th>Karb</th><th>Kafein</th><th>Na</th><th>Karar</th></tr>${N.products.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="sub">${esc(p.note)}</div></td><td>${p.carb} g</td><td>${p.caffeine} mg</td><td>${p.sodium} mg</td><td><b>${esc(p.verdict)}</b><div class="sub">${esc(p.why)}</div></td></tr>`).join('')}</table></div><ul class="tight">${N.principles.map(x=>`<li class="sub">${esc(x)}</li>`).join('')}</ul></div></div></details>`;
 el.innerHTML=goal+pacing+scen+fuel+mapc+morning+shoes+nut;
 if(window.L){const map=L.map('map',{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
  const line=L.polyline(c.route_latlon,{color:C.s1,weight:4}).addTo(map);map.fitBounds(line.getBounds(),{padding:[10,10]});
  const near=km=>{const n=c.route_latlon.length;return c.route_latlon[Math.min(n-1,Math.round(km/c.route_len_km*(n-1)))]};
  c.markers.forEach(([n,km])=>{if(/START|FINISH|DÖNÜŞ/.test(n))L.circleMarker(near(km),{radius:7,color:C.s8,fillColor:C.s8,fillOpacity:1}).addTo(map).bindTooltip(n,{permanent:true,direction:'right'});else if(+n.replace('K','')%5===0)L.circleMarker(near(km),{radius:4,color:C.s1,fillOpacity:1}).addTo(map).bindTooltip(n)});
  c.aid.forEach(([km,n])=>{const col=n.includes('Sünger')?C.s4:C.s3;L.circleMarker(near(km),{radius:5,color:col,fillColor:col,fillOpacity:1}).addTo(map).bindTooltip(`${km.toFixed(1)} km — ${n}`)})}
 else document.getElementById('map').innerHTML='<div class="sub">Harita yüklenemedi.</div>';
 const es=c.elev_series;chart(document.getElementById('c-ele'),{type:'line',data:{datasets:[{label:'m',data:es.map(p=>({x:p[0],y:p[1]})),borderColor:C.s1,backgroundColor:C.s1+'33',fill:true,pointRadius:0,tension:.2}]},
  options:{parsing:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>`km ${i[0].raw.x.toFixed(1)}`,label:i=>`${Math.round(i.raw.y)} m`}}},scales:{x:{type:'linear',min:0,max:42.2,ticks:{stepSize:5},title:{display:true,text:'km'}},y:{min:0,title:{display:true,text:'m'}}}}});
};

/* ================= KÜTÜPHANE ================= */
R.kutuphane=el=>{
 const rs=M.research||[];const topics=[...new Set(rs.map(r=>r.topic))];
 const res=`<div class="card"><h3>Araştırma bulguları (${rs.length})</h3>${rs.length?`<div id="rf">${['Tümü',...topics].map((t,i)=>`<span class="pill f ${i===0?'on':''}" data-t="${esc(t)}">${esc(t)}</span>`).join('')}</div><div id="rl"></div>`:'<div class="sub">Araştırma derleniyor (research/ klasörü).</div>'}</div>`;
 const pc=`<div class="card"><h3>Önceki koç ↔ yeni koç</h3><div class="tbl"><table><tr><th>Konu</th><th>Hüküm</th><th>Gerekçe</th></tr>${P.previous_coach.map(p=>`<tr><td><b>${esc(p.topic)}</b>${p.previous?`<div class="sub">${esc(p.previous)}</div>`:''}</td><td>${esc(p.mine)}</td><td class="sub">${esc(p.why)}</td></tr>`).join('')}</table></div></div>`;
 const acts=`<details class="more"><summary>Tüm aktiviteler (Garmin, ${M.activities.length})</summary><div class="body tbl"><table><tr><th>Tarih</th><th>Aktivite</th><th>km</th><th>dk</th><th>Pace</th><th>HR</th><th>Not</th></tr>${M.activities.map(a=>`<tr><td>${fmtD(a.date)}</td><td>${esc(a.name)}</td><td>${a.km?a.km.toFixed(1):''}</td><td>${Math.round(a.min)}</td><td>${a.type==='running'&&a.km>0.3?pace(a.min/a.km):''}</td><td>${a.avg_hr??''}</td><td class="sub">${esc(a.note||'')}</td></tr>`).join('')}</table></div></details>`;
 const ap=M.apple;const apple=`<details class="more"><summary>Apple Watch geçmişi (Eyl 2025 – Ağu 2026)</summary><div class="body"><div class="card"><div class="tbl"><table><tr><th>Ay</th><th>km</th><th>Koşu</th><th>En uzun</th><th>HR 150'de pace</th></tr>${ap.monthly.map(m=>`<tr><td>${m.month}</td><td>${m.km}</td><td>${m.runs}</td><td>${m.longest_km}</td><td>${m.easy_ef_median?pace(1000/(m.easy_ef_median*150)):'-'}</td></tr>`).join('')}</table></div>
  ${ap.race15k?`<div class="sub" style="margin-top:8px">15K İstanbul 2025: ${esc(ap.race15k.time)} · resmi pace ${esc(ap.race15k.pace_official)} · HR ${ap.race15k.avg_hr}</div>`:''}
  <h3 style="margin-top:10px">İşaretler</h3><ul class="tight">${ap.flags.filter(f=>!/load_jump/.test(f.type)).map(f=>`<li class="sub">${fmtD(f.date_from)}${f.date_to!==f.date_from?'–'+fmtD(f.date_to):''}: ${esc(f.note)}</li>`).join('')}</ul></div></div></details>`;
 const gl=`<details class="more"><summary>Sözlük</summary><div class="body"><div class="card"><table>${P.glossary.map(g=>`<tr><td><b>${esc(g[0])}</b></td><td class="sub">${esc(g[1])}</td></tr>`).join('')}</table></div></div></details>`;
 const lg=`<details class="more"><summary>Günlük notlar (${M.log.length})</summary><div class="body"><div class="card"><table>${M.log.map(l=>`<tr><td style="white-space:nowrap">${fmtD(l.date)}</td><td class="sub">${esc(l.note)}</td></tr>`).join('')}</table></div></div></details>`;
 const ar=M.archive;const arch=`<details class="more"><summary>Arşiv — önceki koçun planı (17–24 Eyl)</summary><div class="body"><div class="card">
  <h3>Haftalar</h3><div class="tbl"><table><tr><th>Hf</th><th>Faz</th><th>Uzun</th><th>Brif</th></tr>${(ar.weeks||[]).map(w=>`<tr><td>${w.n}</td><td>${esc(w.phase)}</td><td>${w.long_km}</td><td class="sub">${esc(w.long_brief)}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:10px">Kurallar</h3><ul class="tight">${(ar.global_rules||[]).map(r=>`<li class="sub">${esc(r)}</li>`).join('')}</ul>
  <h3 style="margin-top:10px">Coach kuralları</h3><ul class="tight">${(ar.coach_rules||[]).map(r=>`<li class="sub"><b>${esc(r.label)}</b> ${esc(r.action)} — ${esc(r.why)}</li>`).join('')}</ul>
  ${ar.review&&ar.review.adopted?`<h3 style="margin-top:10px">Dış göz (18 Eyl) — kabul</h3><ul class="tight">${ar.review.adopted.map(r=>`<li class="sub">${esc(r)}</li>`).join('')}</ul><h3>Ret</h3><ul class="tight">${ar.review.rejected.map(r=>`<li class="sub">${esc(r)}</li>`).join('')}</ul>`:''}
  </div></div></details>`;
 el.innerHTML=res+pc+acts+apple+gl+lg+arch;
 if(rs.length){const draw=t=>{document.getElementById('rl').innerHTML=rs.filter(r=>t==='Tümü'||r.topic===t).map(r=>`<div class="rc"><div class="lv">${esc(r.topic)} · ${esc(r.level)}</div><div><b>${esc(r.claim)}</b></div>${r.implication?`<div class="sub">→ ${esc(r.implication)}</div>`:''}<div class="sub">${(r.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')}${r.file?` · <span class="muted">${esc(r.file)}</span>`:''}</div></div>`).join('')};draw('Tümü');
  document.querySelectorAll('#rf .pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('#rf .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');draw(p.dataset.t)})}

</script>
