aftalık izlemede HRV <67 ve RHR ≥50 → sonraki hafta −%20."}, {"id": "T-RHR", "decision": "U16", "check": "metric", "metric": "rhr_vs_base", "op": ">=", "value": 4, "days": 1, "text": "RHR ≥52 (vekil: 14 kayıt medyanı ~48 + 4) → S-sarısı; HRV 2 gece <67 ile birlikteyse kırmızı."}, {"id": "T-T2-UZUN", "decision": "C22", "check": "metric", "metric": "recovery_h", "op": ">", "value": 42, "days": 1, "text": "T2: kolay uzun (≤22 km) ertesi sabah toparlanma süresi >42 sa → sonraki kalite ~%60. 24–28 km sonrası eşik 54 sa (17 Eki 30 km sonrası 18 Eki T2 yalnız bilgi; >72 sa → 24 Eki MP 2,5 km, KTS-01), MP'li uzun 72 sa, kalite 30 sa (elle bağlam). Sonraki kalite 13 Eki testiyse test kısalmaz, bir kez 14 Eki'ye kayar (KT2-03).", "dates": ["2026-10-11"]}, {"id": "T-HACIM", "decision": "U6", "check": "metric", "metric": "weekly_km", "op": ">", "value": 60, "days": 1, "text": "T5: son tamamlanan hafta plan +%5'i aştı (H2 58,5 km × 1,05 = 61,4, ama Z3 tavanı 60 km → eşik 60; H1 için 50,4, H3 için 38,9 elle) → aşan km sonraki kolay günden düşülür. Hiçbir hafta 60 km'yi geçmez."}, {"id": "T-UZUN", "decision": "C2", "check": "metric", "metric": "long_km", "op": ">", "value": 30.3, "days": 1, "text": "Son 7 günün en uzun koşusu mutlak tavanı (30,0 + 0,3 = 30,3 km; 17 Eki 30 km sporcu seçimi) aştı → ihlal; uzun koşu asla uzatılmaz, 30,0'da evde durulur (U35). YEDEK uygulandıysa tavan 27,8 km (elle; aşılırsa 24 Eki MP zaten 4 km). 10 Eki GPS 22,3–23,0 km → 17 Eki için yumuşak ihlal (KTS-05: tek yumuşak → 28 km); YEDEK uygulanırsa kendi kısaltması: >22,3 km → 25 km (A tetik 1, KT1-03). KTS-05: GPS km 16 Eki kararına uymalı (30 → ≤30,3 · 28 → ≤28,3 · YEDEK → koşu ≤27,8); uymazsa 20 Eki 6 km ve 24 Eki MP ≤2,5 km."}, {"id": "T-A1", "decision": "C4", "check": "manual", "text": "30 km ön şartı (E3, 06-ek-30km.md): 10 Eki ≤22,3 km ve temiz, tetik 1/2 ve T1 yok; H1'de plan km'sini aşan ≤1 koşu. Biri tutmazsa 17 Eki YEDEK (27,5 km koşu + 2,5 km yürüyüş) ve yedeğin kendi kısaltmaları: A tetik 1 (10 Eki >22,3 km ya da kolay gün fizyoloji eşiği) → 25 km; T1 (decoupling >%7, HR kayması >8 bpm, ağrı ≥3/10'dan 2'si) → 24 km; ikisi de km 23,5 kapısında biter (KT2-01). H1 uyum: +0,3 km'yi aşan ≥2 koşu → 27 km / 2:50 (KT1-03). 10 Eki hareket temposu >6:18 → YEDEK uygulanırsa 26–27 km (30 km ön şartı değil). KTS-05 (geçerli kural): sert şartlar (10 Eki T1, ağrı ≥3, baldır <15/15, kemik/Aşil, 17 Eki sabahı sarı-D/turuncu/kırmızı) → YEDEK; yumuşak (H1 aşım, 11 Eki T2 >42, 13 Eki koşullu/kaymış, 10 Eki 22,3–23,0 km): tek → 28 km, iki → YEDEK. Karar panelin, 16 Eki 20:00."}, {"id": "T-A6", "decision": "C8", "check": "manual", "text": "A tetik 6: 17 Eki son 5 km HR >158 iken tempo 6:30'dan yavaş → 18 Eki ön kilidinde bir bant aşağı. 30 km'de: km 20 sonrası 6:10'dan hızlı tur = ihlal ve kısaltma (sonraki kapıda bitir); ≥2 ihlal turu → ön kilit bir bant aşağıdan açılır (KT1-01). YEDEK seansta: L9 (km 10 1:02:30'dan erken) → km 23,5 kapısında biter, A-aday kapanır (KT2-01); 6:05'ten hızlı tur → sonraki kapıda bitir (KT2-02). KTS-03: ihlal iki kademeli (km 0–20 eşik 6:05, km 20–30 6:10): 1. ihlal → sonraki 2 tur 6:40–6:50; 2. ihlal → sonraki kapıda bit; ≥2 ihlal varken devam → 24 Eki MP ≤2,5 km ve A-aday kapalı. KTS-04: Tetik 6 yalnız km 22–30 turlarının ≥%80'inde |HR − kadans| >3 ise okunur."}, {"id": "T-A7", "decision": "C12", "check": "manual", "text": "A tetik 7: H1'de üç kolay koşudan ikisinde ort. HR >148 → 20 Eki MP seansı kolaya döner. 30 km notu: 20 Eki MP zaten iptal (kolay 8 km); tetik ateşlenirse 24 Eki MP bloğu da kolaya döner (entegratör eşlemesi)."}, {"id": "T-C18", "decision": "C18", "check": "manual", "text": "7 Eki saat testinde km başına >1 sahte titreşim → antrenmanda 8 sn tolerans, yarışta R2 (tempo hedefi yok, yalnız son tur süresi)."}, {"id": "T-TEST", "decision": "C8", "check": "manual", "text": "Test koruma (KT2-03): T2, C16 ya da S/D/H-sarısı → 13 Eki testi bir kez 14 Eki'ye kayar, 13 Eki 10 km kolay, o hafta Kuvvet-A yok; U-sarısı → 2×3 km, koşullu, A-aday açılamaz; test hiç yapılamazsa MP = B (5:55), A-aday ve Güçlü bitiş kapalı, K10_HR 163."}, {"id": "T-24EKI", "decision": "C10", "check": "manual", "text": "24 Eki aşağı tetiği (KT3-03): blok ort. HR 13 Eki'den bilekle ≥6 bpm yüksek (bant yok) ve ikinci sinyal (RPE ≥6 ya da bantta tur oranı <%80) → bir bant aşağı; tek başına yalnız bilgi. Uyarı bütçesi (tempo uyarısı ≤1/4 km, yavaş 0) aşılırsa yarışta R2 (KT2-04); kaçan/çift basış ≥2 → yarışta km bitişli yedek düzen (KT2-06). KTS-01: MP bloğu kararı 24 Eki sabahı; 4 km için hepsi: toparlanma ≤36 sa, HRV 2 gece <67 değil, RHR ≤51, ağrı ≤1/10, 23 Eki baldır 15/15, 21–22 Eki 6:15–6:25 tur HR'si 10 Eki'den ≤+4 bpm. Tek şart tutmazsa ya da 18 Eki T2 >72 sa: 2,5 km (3/3 bantta ve RPE ≤4 → A teyidi okunur). İki şart ya da sarı-D/turuncu/kırmızı → 12–14 km kolay; bu durumda HR dışı teyit (A-aday, Güçlü bitiş, Sub-4) yapılamaz."}], "coach_messages": [{"expert": "İlk maraton uzmanı (Higdon / Galloway / Steffny)", "text": "Bu dört hafta sabır işi: kolay günler gerçekten kolay, 17 Ekim'de 2:55 dolunca kapıda dur; yarışta ilk 10 km frenli, istasyonlarda yürü. [Sporcu seçimi sonrası: istasyonlarda yürüme yok (C33); T1/T2 havada km 30'a kadar 8 SB'de otomatik yürüme.] [Sporcu seçimi sonrası: 17 Eki 30 km sürekli koşu (açık risk notuyla), 30,0'da evde dur; ön şart tutmazsa 27,5 km + 2,5 km yürüyüş.]"}, {"expert": "Pfitzinger ekolü", "text": "17 Eki'de 27,5 km'yi kolay koş, 13 Eki testinde bandı tut; maratonu son 10 km kazandırır, ilk 10 km kaybettirir. [Sporcu seçimi sonrası: 17 Eki 30 km sürekli koşu (açık risk notuyla), 30,0'da evde dur; ön şart tutmazsa 27,5 km + 2,5 km yürüyüş.]"}, {"expert": "Norveç eşik altı ekolü", "text": "13 Eki'de ikinci blokta HR 159'u geçerse hızlanma yok, bant düşer; kontrollü kalite, kontrollü yarış, 17 Eki'de 152 fren."}, {"expert": "80/20 polarize ekol (Seiler / Esteve-Lanao / Fitzgerald)", "text": "Kolay günlerin kolay, 6:15'ten yavaş ve HR ≤148 olsun; 17 Eki'de son 8 km'de bile 6:05'ten hızlı tur yok, hız 1 Kasım'a. [Entegratör notu: 30 km seçimiyle 17 Eki km 20–30 bandı 6:25–6:50; ihlal turu km 0–20'de 6:05'ten, km 20–30'da 6:10'dan hızlı tur (KTS-03).]"}, {"expert": "Spor hekimi + fizyoterapist", "text": "Pikte 27,5 km'de kapıda dur, km 19,5 sonrası 6:15'ten hızlı tur yok; tek taraflı ağrı ya da kemikte noktasal hassasiyette koşma, hemen bildir. [Sporcu seçimi sonrası: 17 Eki 30 km sürekli koşu (açık risk notuyla), 30,0'da evde dur; ön şart tutmazsa 27,5 km + 2,5 km yürüyüş.]"}, {"expert": "Spor beslenme uzmanı", "text": "Kahveyi hiçbir gün atlama; 17 Eki'de yedi jel ve iki CAF'ı yarış saatinde dene, yarışta yeni ürün yok. [Sporcu seçimi sonrası: 17 Eki 30 km provası 7 jel (start + km 5, 10, 15 CAF, 20, 25 CAF, 28; km 20, 25, 28 koşarak, KTS-02), YEDEK'te 6 jel; iki CAF aynen (C30).]"}, {"expert": "Veri fizyoloğu (Firstbeat / Garmin / Strava)", "text": "Saatteki her hızlı km bir veri noktası değil, bir ihlaldir. Bant tak, tur bas, kapıda bitir; sayıları biz okuruz. [Sporcu seçimi sonrası: göğüs bandı yok (C19); bilek HR, bant yoksa tablosu ve kadans kilidi kuralı.]"}, {"expert": "Spor psikoloğu / yarış günü uygulama uzmanı", "text": "Hızlı km başarı değil, ihlaldir: titreşimde bandın yavaş ucuna in, rota kapıda bitince dur, Kasım'da ilk 10 km fren."}, {"expert": "İstanbul Maratonu parkur ve lojistik uzmanı", "text": "Gidişte poyraz seni arkadan iter: km 11–25,8'de MP'den hızlı koşma, saati start halısında başlat, km 30'a kadar sabret."}, {"expert": "Jack Daniels ekolü", "text": "13 Eki 2×5 km testi bugünkü MP'ni ölçer, km 30'dan sonrasını değil; temiz ölçsün diye kolay günleri gerçekten kolay koş."}, {"expert": "Hansons ekolü", "text": "17 Eki 27,5 km'ye fazla anlam yükleme, ekolümün 26 km tavanını zaten aşıyor; dayanıklılığı birikmiş yorgunluk kurar, MP günlerinde MP'den hızlı koşma. [Sporcu seçimi sonrası: 17 Eki 30 km sürekli koşu (açık risk notuyla), 30,0'da evde dur; ön şart tutmazsa 27,5 km + 2,5 km yürüyüş.]"}], "phases": [{"name": "H0 — Dinlenme (4 Eki)", "start": "2026-10-04", "end": "2026-10-04", "quality": "Yok", "checkpoint": "Yarış kutusu ayrıldı; Gel 100 sayıldı", "note": "3 Eki 25 km sonrası; readiness 16.", "actual_km": 0, "plan_km": 0, "actual_long": null, "status": "done"}, {"name": "H1 — Toparlanma (5–11 Eki)", "start": "2026-10-05", "end": "2026-10-11", "target_km": 48, "long_km": 22, "quality": "Yok (kolay + strides; 7 Eki saat testi)", "checkpoint": "10 Eki 22 km: yakıt kapısı ~54 g/sa (5 jel), ter testi 1, tetik 1–2", "note": "C5; C13; uzun koşu payı %46 (C38).", "actual_km": 0, "plan_km": 48.0, "actual_long": null, "status": "current"}, {"name": "H2 — Pik ve karar testi (12–18 Eki)", "start": "2026-10-12", "end": "2026-10-18", "target_km": 58.5, "long_km": 30, "quality": "13 Eki MP karar testi 2×5 km", "checkpoint": "13 Eki bant adayı; 16 Eki 20:00 panel kararı (30 / 28 / YEDEK; sert/yumuşak ön şartlar, KTS-05); 17 Eki pik; 18 Eki MP ön kilidi (T2 yalnız bilgi, KTS-01); test kayarsa 14 Eki (KT2-03)", "note": "C6 (56) → 58,5 km: 17 Eki 30 km sporcu seçimi (E3); YEDEK uygulanırsa 56. C8; C14; 2 sert gün (13, 17 Eki). Uzun koşu payı %51 (C38). 28 km sürümünde H2 56,5.", "actual_km": 0, "plan_km": 58.5, "actual_long": null, "status": "future"}, {"name": "H3 — Taper 1 (19–25 Eki)", "start": "2026-10-19", "end": "2026-10-25", "target_km": 37, "long_km": 14, "quality": "24 Eki tam prova 14 km, içinde 4 km MP (24 Eki sabahı şartlarla; biri tutmazsa 2,5 km, ikisi tutmazsa kolay — KTS-01); 20 Eki MP iptal → kolay 8 km (17 Eki ölçütü tutmazsa 6 km)", "checkpoint": "18–19 Eki koşu yok; 24 Eki saat kurgusu donar, Adios adım 3; 25 Eki MP kesin; 26 Eki ayakkabı kilidi", "note": "C7 (42) → plan 37 km + isteğe bağlı 3 (20 Eki 8 km kolay, 25 Eki koşusuz, KT1-09); Kuvvet-A yok; yalnız aşağı yönlü (C10). Toplam >43,5 km olursa aşan km 28 Eki'den düşülür.", "actual_km": 0, "plan_km": 37.0, "actual_long": null, "status": "future"}, {"name": "Yarış haftası (26 Eki–1 Kas)", "start": "2026-10-26", "end": "2026-11-01", "target_km": 23, "long_km": 8, "quality": "27 Eki MP 3 km (karar yok)", "checkpoint": "30 Eki 12:00 hava satırı + hedef etiketi; 1 Kas 09:00 yarış", "note": "U8; yarış km'si hafta toplamına girmez.", "actual_km": 0, "plan_km": 23.0, "actual_long": null, "status": "future"}], "readiness": {"rules": [{"id": "r-hrv2", "level": "yellow", "metric": "hrv_vs_base", "op": "<=", "value": -6, "days": 2, "text": "S-sarısı: HRV 2 gece üst üste baz altı ({v} ms; vekil, eşik 67) — kalite aynı süre kolay, kolay günde HR −3, uzun koşuda MP yok. RHR ≥52 de varsa KIRMIZI (U16)"}, {"id": "r-rhr", "level": "yellow", "metric": "rhr_vs_base", "op": ">=", "value": 4, "days": 1, "text": "S-sarısı: RHR bazın {v} bpm üstünde (≈52+) — kalite aynı süre kolay, HR −3 (U16)"}, {"id": "r-sleep2", "level": "yellow", "metric": "sleep_h", "op": "<", "value": 6, "days": 2, "text": "U-sarısı: 2 gece üst üste uyku 6 sa altı ({v} sa) — kalitede MP/ana blok ~%60 (C21), kolay günde HR −3, uzun koşu mesafe korunur HR −3 (U17)"}, {"id": "r-sleep1", "level": "yellow", "metric": "sleep_h", "op": "<", "value": 5, "days": 1, "text": "U-sarısı: son gece uyku 5 sa altı ({v} sa) — kalitede MP/ana blok ~%60 (C21), uzun koşuda HR −3 (U17)"}, {"id": "r-rec36", "level": "yellow", "metric": "recovery_h", "op": ">", "value": 36, "days": 1, "text": "U-sarısı: toparlanma süresi {v} sa (36 üstü) — kalite kapısı U ile kapalı: MP/ana blok ~%60 (C21); readiness ile tek girdi (U16)"}, {"id": "r-ready40", "level": "yellow", "metric": "readiness", "op": "<", "value": 40, "days": 1, "text": "U-sarısı: readiness {v} (40 altı, C20) — yalnız ana nedeni uyku ise ve uyku satırı yanmamışsa sayılır; toparlanma süresiyle tek girdi (U16). Tek başına kırmızı yakmaz"}, {"id": "r-t2-42", "level": "yellow", "metric": "recovery_h", "op": ">", "value": 42, "days": 1, "text": "T2 (C22): ertesi sabah toparlanma {v} sa — kolay uzun ≤22 km sonrasıysa (>42) sonraki kalite ~%60; T2 + T3 ya da S/D sarısı → sonraki kalite kolay"}, {"id": "r-t2-54", "level": "yellow", "metric": "recovery_h", "op": ">", "value": 54, "days": 1, "text": "T2 (C22): toparlanma {v} sa — 24–28 km kolay uzun sonrasıysa (>54) sonraki kalite ~%60; ilk 24–28 km'de ≤60 sa ve T3 yoksa yalnız bilgi"}, {"id": "r-t2-72", "level": "yellow", "metric": "recovery_h", "op": ">", "value": 72, "days": 1, "text": "T2 (C22): toparlanma {v} sa (72 üstü) — MP'li uzun sonrası eşiği de aşıldı; sonraki kalite ~%60, S/D sarısıyla birlikteyse kolay"}], "groups": [{"group": "S · Sistemik", "inputs": "Gece HRV (yeşil ≥67; sarı <67 2 gece; kırmızı + RHR ≥52) · HRV durumu 7 g (UNBALANCED sarı; LOW ≥3 gün kırmızı) · RHR (≤51 yeşil; ≥52 sarı)"}, {"group": "U · Uyku ve yük", "inputs": "Uyku (≥6 sa yeşil; 2 gece <6 ya da son gece <5 sarı) · toparlanma süresi (≤36 yeşil; >36 sarı) · readiness (<40 ve neden uyku → sarı; kırmızı yakmaz)"}, {"group": "D · Doku", "inputs": "Ağrı (0–1 yeşil; 2/10 iki taraflı DOMS sarı; noktasal kemik, sekmede ağrı, gece ağrısı, aksama, tek taraflı ≥3/10 >48 sa, 'tık' kırmızı) · baldır/Aşil tutukluğu (≤15 dk sarı; >15 dk 2 sabah kırmızı)"}, {"group": "H · Hastalık", "inputs": "Boyun üstü sarı; boyun altı ya da ateş ≥38,0 °C kırmızı"}, {"group": "E · Enerji", "inputs": "Kilo (Salı/Cuma): 7 g ort. ≥1,0 kg ya da 14 günde >1,5 kg düşüş sarı; 15–25 Eki arası çalışır"}, {"group": "M · Migren", "inputs": "Ayrı satır, sarı sayılmaz: atak günü kalite/uzun yok"}], "color": "Bir kırmızı girdi → kırmızı; bir gruptan sarı → sarı (o grubun eylemi); iki ayrı gruptan sarı → turuncu; hiçbiri → yeşil. Aynı gruptaki birden çok sarı tek sarı sayılır. Sınırdaki değer yuvarlanmaz; şüphede kötü yöne sayılır.", "quality_gate": "Kalite kapısı (hepsi): HRV 2 gece üst üste <67 değil · RHR ≤51 · toparlanma ≤36 sa · ağrı ≤1/10 · migren atağı yok · readiness <40 ise ana neden uyku değil. Yalnız U kapatıyorsa kalite kısaltılmış; S, D, H ya da M kapatıyorsa kalite kolaya döner.", "actions": {"green": "Plan aynen.", "yellow": "Nedene bak. U (uyku/yük): kalite yapılır, MP/ana blok ~%60 (C21); kolay gün HR −3; uzun koşu mesafe korunur, HR −3 (U17). S (HRV/RHR): kalite aynı süre kolay (bir kez ertesi kolay güne kayabilir, Cuma/Pazartesi'ye değil); uzun koşuda MP yok, HR −3. D (doku): kalite kolay, Adios ve iniş yok; uzun −%20, MP yok. H (boyun üstü): kalite yok, ≤45 dk kolay. E (kilo): plan aynen, KH +1–2 g/kg. İki ayrı gruptan sarı = turuncu: kalite yok, ≤45 dk kolay ya da ≤60 dk bisiklet (HR <120); uzun koşu Pazar'a kayar (tek sefer). Kalite 13 Eki testiyse: U-sarı → 2×3 km koşullu; S/D/H → test 14 Eki'ye kayar (KT2-03). E sarısı tek başına bile → 17 Eki Adios bölümü yok (KT1-04).", "red": "Koşu yok. ≤40 dk bisiklet (HR <120) ya da yürüyüş. Uzun koşu Pazar'a kayar (tek sefer); Pazar da kırmızıysa −%20 ve o haftanın son kolay günü. Sonraki haftaya taşınmaz (U17). Kemik noktası ağrısında 48 sa koşu yok ve hekim. E sarısı + herhangi bir noktasal hassasiyet → 48 sa koşu yok ve aynı hafta hekim (KT1-04). Kaydırma tavanları (KT1-06): 10→11 Eki en fazla 20 km / 2:05, 13 Eki testi 14 Eki'ye, o hafta Kuvvet-A yok; 17→18 Eki en fazla 24 km / 2:30, Adios yok, MP ön kilidi 19 Eki, 20 Eki MP 21 Eki'ye (iniş 2 ve 20 Eki Kuvvet-A iptal), ayakkabı kilidi 22 Eki; H2'de ikinci kaydırma → pik iptal, etiket en fazla Sabır."}, "athlete_line": "Sabah güncellemesi 07:30'a kadar gelmediyse (neden sorulmaz): KIRMIZI → koşu yok: HRV durumu LOW ya da (HRV <67 iki gece ve RHR ≥52) ya da sabah kartında KOŞMA maddesi. KOLAY ≤45 dk: ağrı ≥2/10, readiness <40, HRV durumu BALANCED değil, son gece uyku <5 sa ya da iki gece <6 sa, ya da RHR ≥52. Hiçbiri yoksa → plan. Test ve pik günlerinde (13, 17, 24 Eki) güncelleme yoksa seans 24 sa kayar. Migren ayrı. (KT2-08, KT3-04)", "morning_card": ["En yüksek ağrı (0–10) ve yeri; tek taraf mı? (puanı plana bakmadan ver)", "Aşil: ilk adımlarda tutukluk kaç dakika?", "Ateş ya da hastalık belirtisi; boyun altında mı?", "6–25 Eki her koşu sabahı: kemik noktalarına bas + tek ayakla 10 sekme; 13, 17 ve 24 Eki'den sonra iki sabah naviküler basma testi (KT1-04)", "Migren atağı var mı?"], "daily_message": "Sporcuya her gün ≤3 satır: Bugün / Fren (tek sayı) / Dikkat (tek kural). Işık ve neden gösterilmez; koşu içi kurallar ≤3 (KT2-08). Kritik günlerde güncelleme starttan ≥45 dk önce (10, 13, 24 Eki; 17 Eki ve 1 Kas 05:45); hata verirse sporcuya bildirim (KT3-04).", "hide_from": "2026-10-26", "hide_note": "26 Eki'den itibaren hazırlık/HRV ekranı sporcuya kapalı (U35); karar sabah kartında. O sabah güncelleme gelmediyse gizleme askıya alınır (KT3-04)."}, "adherence": {"km_tolerance_pct": 5, "km_tolerance_abs": 0.3, "hr_tolerance_bpm": 3, "rest_run_km": 0.5, "window_days": 28, "note": "U6: plan km'si tavandır, +0,3 km GPS toleransı; aşım sonraki kolay günden düşülür. T5: haftalık plan +%5."}, "spike": {"window_days": 30, "warn_pct": 10, "bad_pct": 11, "note": "Frandsen kuralı: son 30 günün en uzununu %10'dan fazla aşma (T4 >1,10). 17 Eki 30 km / 25,07 = +%19,7 → bad_pct aşılır; sporcunun açık risk notuyla seçimi (E3, C2/C3): schedule 17 Eki 'override.spike' gerekçesi taşır, build hata değil gerekçeli uyarı verir. YEDEK 27,5 km +%9,7."}, "validator": {"no_run_days": ["Pzt", "Cum"], "long_days": ["Cmt"], "week_km_tolerance_pct": 5}, "coach_policy": {"mode": "yok-say", "summary": "Sporcu seçimi (4 Eki, U22): Garmin Coach açık kalır ama önerileri görmezden gelinir. Coach seansları takvimde görünür, yapılmaz; panel etiketi 'Coach — yok say'. Saatte günde tek reçete: panelin seansı. Ölçüm katmanı sürer (readiness, HRV, uyku, toparlanma süresi, LT, VO2max). Coach'un 'shortage' etiketleri, yük hedefleri, tempo bantları ve yarış tahmini kullanılmaz. Panelin hükmü K1 'kapat' (11/11) yalnız öneri olarak kalır; öneri 23 Eki akşamı bir kez daha sunulur. K2: Long Workout Day Pazar (ya da Çarşamba), Cumartesi Coach'ta antrenman günü değil; Coach bildirimleri kapalı (KTS-08).", "by_type": [{"type": "*", "action": "Coach — yok say", "note": "U22 sporcu seçimi: Coach açık; hiçbir Coach seansı başlatılmaz, yerine panelin seansı yapılır."}], "settings": ["Coach planı (id 47258562) açık kalır ve ayarları değişmez (sporcu seçimi, 5 Eki: K2 ayarları — uzun gün Pazar, Cumartesi/Pazartesi/Cuma antrenmansız — yapılmaz; KTS-08'in bu kısmı uygulanmaz). Sporcu saatte panelin seansını adıyla seçer: kartta '⌚ Saatte seç: «ad»' yazar; panel adlarında hep km vardır, Coach adları tek kelimedir (Temel, Uzun Koşu, VO2 Maks.…).", "Coach bildirimleri ve yarış tahmini bildirimi 5 Eki'de kapatılır (KTS-08)", "12, 16, 23 ve 31 Eki akşamı panel saatin takvimini yalnız okur; ertesi gün saatte tek panel seansı olmalı, değilse sporcuya seansın adı yazılır. FIT'teki seans adı panelin seans adı değilse o günün ölçütü 'yapılmadı' sayılır (KTS-08)", "Coach seansı hiçbir gün başlatılmaz; saat Coach seansını önerirse panelin seansı seçilir", "Takvimde 1 Kas 09:00 İstanbul Maratonu etkinliği duruyor mu? Silindiyse yeniden ekle; hedef süre boş", "Saatte günlük öneri istemini kapat ('Daily Suggested Workouts / Workout Prompt'; FR970'te menü yolu farklı olabilir)", "Yarış tahmini widget'ını kaldır (3:50 tahmini çapa sayılıyor)", "Öneri (panel, zorunlu değil): Coach planını kapat; öneri 23 Eki akşamı (24 Eki tam provasından önce) bir kez daha sunulur (KTS-08)", "Kütüphanedeki 13 eski seansın silinmesi — sporcu onayına bağlı"]}, "easy_def": {"hr": [120, 148], "pace": ["6:15", "7:30"], "min_km": 4, "min_laps": 3, "pace_at_hr_ref": 145}, "intensity": [{"name": "Kolay", "hr": "120/135–148 (günün değeri)", "pace": "6:15'ten hızlı tur yok; Adios'ta 6:15–6:45", "use": "Esas HR, fren tempo. 6 Eki'ye özel: 145 üstü yavaşla, 6:20'den hızlı koşma (U12, U36)."}, {"name": "Çok kolay / shakeout", "hr": "110–140", "pace": "—", "use": "25 ve 31 Eki."}, {"name": "Uzun (10 Eki)", "hr": "≤148, tek sayı; son 4 km 152'ye kadar", "pace": "6:15'ten hızlı tur yok (açıklamada)", "use": "Tamamen kolay; MP ve hızlı bitiş yok (U7)."}, {"name": "Pik (17 Eki, 30 km)", "hr": "Km 0–20: 140–148. Km 20–30: bilek HR 152 üstü → yavaşla; 2 km boyunca 155 üstü → sonraki kapıda bitir", "pace": "Km 0–20: 6:20'den hızlı koşma; 6:05'ten hızlı tur = ihlal. Km 20–30: 6:25–6:50 (saate 6:20–7:15); 6:10'dan hızlı tur = ihlal. 1. ihlal → sonraki 2 tur 6:40–6:50; 2. ihlal → sonraki kapıda bitir (KTS-03); geçen süre 3:10'u geçerse sonraki kapıda bitir", "use": "Sporcu seçimi (açık risk notuyla, E3): 30 km sürekli, MP'siz, hızlı bitişsiz, tamamen Vomero; km 0–20 jellerinde 15 sn yürüyüş serbest, km 20, 25, 28 jelleri koşarak (KTS-02). HR kısaltması: 2 km HR >155 ve tur 6:35'ten hızlı; 2 km HR >160 (KTS-04). Tek yumuşak ön şart ihlalinde 28 km (KTS-05). Ön şart tutmazsa YEDEK: km 0–19,5 HR 140–150, km 19,5–27,5 6:15–6:45 (saate 6:10–7:15), HR ≤152; 2:55; ardından 2,5 km yürüyüş HR <110, tempo 9:00'dan hızlı değil (KTS-06)."}, {"name": "MP (maraton temposu)", "hr": "Fren: 2 km üst üste >163 → 10 sn yavaşla (13 Eki)", "pace": "Bant (saat); B varsayılanı 5:52–5:58; saate hızlı uç −5, yavaş uç +30", "use": "13, 24, 27 Eki (20 Eki MP 30 km protokolüyle iptal); düz ve rüzgârsız kesimde tabeladan tabelaya (U12, U2). 24 Eki R0 yarış iskeletiyle: hızlı uç −8, yavaş uç 12:00 (KT2-04, KT3-05)."}, {"name": "Strides", "hr": "—", "pace": "Hedef yok (RPE %85; son 5 sn yavaşla)", "use": "20 sn süre adımı, ayrı adım (U9)."}, {"name": "5K TT (kalktı)", "hr": "—", "pace": "İlk km 4:45'ten hızlı değil; ekranda tur süresi", "use": "30 km seçimiyle 20 Eki TT seçeneği kalktı (C11 notu). Kayıt: en erken 12:00; ≤24:10 A teyit, >24:10 A kapanır (C11, KT1-10, KT3-03)."}, {"name": "Eşik / eşik altı", "hr": "—", "pace": "—", "use": "A planında yok (C13, C14, Z6)."}, {"name": "Soğuma", "hr": "—", "pace": "Mesafe, hedef yok", "use": "Son adım notu '🏁 Eve yürü' (U35)."}], "rules": [{"text": "Plan km'si tavandır; +0,3 km GPS toleransı. Aşan km sonraki kolay günden düşülür. Hiçbir hafta 60 km'yi geçmez; taper haftası öncekinden uzun olmaz.", "why": "U6 (Z2, Z3)"}, {"text": "Saatteki seans bitince koşu biter; rota kapıda biter. Uzun koşu asla uzatılmaz; kaçan uzun koşu taşınmaz; 'bank' yok.", "why": "U35; U17"}, {"text": "Kolay/uzun günde HR esas (≤145–148), tempo fren (6:15'ten hızlı tur yok; Adios'ta 6:15–6:45). MP günü tempo esas, HR fren. Her adımda tek esas sayı.", "why": "U12"}, {"text": "VO2max, anaerobik, depar ve <3 dk tekrar yok; strides tek hızlı uyaran, her zaman ayrı adım, %85 efor.", "why": "U9 (Z6)"}, {"text": "Haftada ≤2 sert gün, aralarında ≥48 sa (MP/eşik/eşik altı/TT bloğu ya da ≥2:15 koşu). H1'de kalite yok; H2'de tek kalite + uzun.", "why": "U10; C13; C14"}, {"text": "Pazartesi ve Cuma koşusuz; Cumartesi uzun; Pazar koşusuz ya da ≤3 km; ≥20 km sonrası Pazar düz yürüyüş/bisiklet ≤60 dk (HR <120). Bisiklet telafi değildir.", "why": "U14"}, {"text": "Davranış katmanı: MP/kalite adımında >1 ihlal turu (hızlı uçtan >5 sn) → aynı türdeki sonraki seansın bandı 5 sn yavaş; seanstan önce kural kartı sesli okunur. 17 Eki 30 km'de ihlal turu km 0–20'de 6:05'ten, km 20–30'da 6:10'dan hızlı turdur; 1. ihlal → sonraki 2 tur 6:40–6:50, 2. ihlal → sonraki kapıda bitir (KTS-03); ≥2 → ön kilit bir bant aşağıdan (KT1-01).", "why": "U13; KT1-01"}, {"text": "Fizyoloji katmanı (T3): kolay/uzun günde plansız HR ≥157 toplam >10 dk, kalite gününde plansız HR ≥161 toplam >20 dk ya da seans yükü plan +%25 → sonraki kalite kolaya döner. 17 Eki km 20 sonrası kayma sayılmaz (YEDEK'te km 19,5 sonrası).", "why": "C16; D4/D5"}, {"text": "Kırmızı ışık (readiness motorunda tek kuralla kodlanamaz): HRV 2 gece <67 VE RHR ≥52; HRV durumu LOW ≥3 gün; doku kırmızısı; ateş ya da boyun altı belirti.", "why": "U16 (kodlanamayan kısım)"}, {"text": "T2 kalite eşiği: kalite (≤13 km) ertesi sabah toparlanma >30 sa → sonraki kalite ~%60. Sabah kaydı yoksa yedek: kolay uzunda aerobik TE ≥4,5 = sert koşulmuş.", "why": "C22 (kodlanamayan kısım)"}, {"text": "T1: uzun koşuda 3 sinyalin 2'si (decoupling >%7, HR kayması >8 bpm, ağrı ≥3/10) → sonraki hafta −%20; 10 Eki'de → 30 km ön şartı bozulur, 17 Eki YEDEK 24 km; 17 Eki'de → ön kilitte bir bant aşağı.", "why": "D5; A v2"}, {"text": "T4: tek koşu ÷ son 30 günün en uzunu >1,10 ve plansız → ertesi kolay gün −%20.", "why": "Frandsen 2025; D5"}, {"text": "T7 ölçüm geçerliliği: kadans kilidi (panel: blokun >%20'sinde |HR−kadans| ≤3), jog'da HR 60 sn'de ≥10 bpm düşmüyor, >18 °C, test bloğunda CAF ya da testten önceki iki gece uyku <6 sa → sonuç 'koşullu'. 13 ve 24 Eki'de HR'ye hava düzeltmesi: 15 °C üstü her 1 °C için −1 bpm, çiy ≥13 ek −2 (U4'teki +3 kuralının yerine).", "why": "U4; KT3-01; KT3-03"}, {"text": "Koşu içi ağrı: ≤2/10 devam; 3/10 kalite biter; ≥4/10, artan ya da aksama → dur, ertesi gün koşu yok. Aynı yerde 2 gün ağrı → o hafta uzun −%20, kalite yok.", "why": "U19; D1; D5"}, {"text": "Sarıda uzun koşu nedene bağlı: doku → −%20, MP yok; uyku/yük → mesafe korunur, HR −3. Migren atak günü kalite/uzun yok; uzun koşu ertesi gün belirtisizse %80, değilse iptal.", "why": "U17; U20 (M6)"}, {"text": "Sabah kartı: sporcu yalnız ağrı, Aşil, hastalık, migren girer; 6–25 Eki her koşu sabahı kemik basma + 10 sekme. Garmin sayılarını panel okur. 26 Eki'den itibaren readiness/HRV ekranı sporcuya kapanır (güncelleme 07:00'ye kadar gelmezse o gün askıya alınır); ateş 22 Eki'den itibaren her sabah ölçülür.", "why": "U18; U35; KT1-04; KT1-05; KT3-04"}, {"text": "Kuvvet-A (yüklü, RIR 2–3, set sayısı tavan) kalite günü akşamı, uzun koşudan ≥72 sa önce biter; Kuvvet-B Pazartesi; son yüklü 13 Eki (30 km protokolü: 17–25 Eki haftasında Kuvvet-A yok; eski kural 'son yüklü 20 Eki'); 29 Eki'den sonra kuvvet yok; pliometri yok; telafi yok. 13 Eki Kuvvet-A'da yüklü baldır/soleus yok; step-down ve tibialis 5 ve 12 Eki Kuvvet-B'de vücut ağırlığıyla başlar (KT1-02).", "why": "U15; D1; KT1-02"}, {"text": "Tek koşuda Adios km'si ≤ önceki en uzun Adios × 1,5; yeni ayakkabı ile yeni yoğunluk aynı gün olmaz; kilitten sonra yalnız Adios → Vomero; şüphede Vomero. 21 Eki'den sonra yeni uyaran yok.", "why": "U29 (Z7, Z8)"}, {"text": "Haftalık izleme (11, 18, 25 Eki Pazar akşamı): km ve plan uyumu, bantta tur % (hedef ≥%80), ihlal turu, HRV/RHR 7 g ort. (HRV <67 ve RHR ≥50 → sonraki hafta −%20; ağrı varsa −%30), kilo, ağrı günlüğü. Taper'da ACWR <0,8, Garmin etiketleri, VO2max ±1'e tepki yok.", "why": "D4; D5"}, {"text": "Titreşim (antrenman ve yarış, tek protokol): 'hızlı' uyarısında omuz, 3 nefes, 'Sabır'; bu km bandın yavaş ucunda. 3. ve 4. kademeyi panel FIT'ten sayar. Yarışta bütün adımlarda yavaş uç 12:00; yedek 'Yeme' alarmı yarışta kapalı.", "why": "KT2-04 (C17 ve C29'u değiştirir)"}, {"text": "Hastalıktan sonra ilk MP/kalite en erken belirti başlangıcından 7 gün sonra (2 kolay koşuda HR tabandan ≤+5). 25 Eki'yi geçerse MP teyidi yok, bant bir aşağı. Boyun üstü, ateşsiz, 72 sa içinde düzelen → etiket değişmez; 22 Eki ve sonrası ateşli ya da boyun altı → en fazla Güvenli; 18 Eki ve sonrası herhangi bir hastalık → Güçlü bitiş ve Sub-4 kapalı. 31 Eki 18:00'de boyun altı belirti → start yok.", "why": "KT1-05"}, {"text": "Yarış haftası ağrı karar ağacı: iki taraflı, kas gövdesinde, ≤2/10, ısınınca azalan → değişiklik yok; tek taraflı ≥3/10 >48 sa, noktasal kemik ağrısı ya da sekmede ağrı → Güvenli + Vomero; arada kalan → 28 Eki 10 dk jog testi.", "why": "KT1-09"}, {"text": "Koşu sonrası rapor 4 alan: ağrı + yer, mide, atlanan jel, serbest not; gerisi FIT'ten. Uygulama ≥%90; iki hafta altında kalırsa kural kartı 7'den 5'e iner.", "why": "KT2-08"}, {"text": "Yarışta Adios şartları (hepsi): birikim ≥45 km, yorgun bacakta ≥8 km temiz bölüm, 13/17/24 Eki 48. saat kontrollerinin üçü yeşil; biri tutmazsa Vomero. 30 km seçimiyle 17 Eki Adios'suz → C27 'değişim yok' kuralı: yarış varsayılanı Vomero; Adios ancak 24 Eki (ertesi sabah + 26 Eki 48. saat) ve 27 Eki kontrolleri yeşilse, birikim ≥45 km ve 25 Eki'de yazılı seçilirse. Yeni Vomero çifti gerekli (ilk koşu ≤10 Eki, 17 Eki dahil ≥40 km). KTS-07 ek şartları: en uzun Adios koşusu ≥14 km; 24 Eki MP bloğu (4 ya da 2,5 km) Adios'la; 24 Eki ertesi ve 26 Eki 48. saatte baldır 0/10 ve tek ayak 15 baldır kaldırma iki tarafta 15/15. 24 Eki MP yapılmadıysa yarış Vomero, kesin.", "why": "KT1-07; C27 (30 km notu)"}], "goal": {"summary": "İki sayı, iki satır (U1, C36). Plana bağlı (varsayılan Sabır): P10 4:00 · P50 4:11 (4:10–4:12) · P90 4:31 · sub-4 %10. Kapasite (eşit eforla ideal yarış): P50 ~4:07–4:08 · sub-4 ~%15–18. 'Plan sayısı temkinin fiyatıdır, sınırın değil.' Sporcunun hedefi: sağlıklı bitirmek; olursa 4 saat altı. Sporcu seçimleri (4 Eki): yürümesiz (C33) bitişi ~1:10 iyileştirir (panel sayıları yürüyüşlü tahmin; yeniden tahmin edilmedi); göğüs bandı yok (C19) ve 30 km seçimiyle 20 Eki TT kalktı: A-aday, Güçlü bitiş ve Sub-4 önkoşulu için tek yol 24 Eki HR dışı teyit (MP bloğu 24 Eki sabahı şartlarla: 4 km ya da 2,5 km, KTS-01; entegratör önerisi). 30 km (açık risk notu): doku sorunu riski ~%10 → ~%15–18; sakatlık olmazsa bitişe etki 0 ile +1–2 dk (Ek tur 2). Panel sayıları yeniden tahmin edilmedi.", "p10": "4:00", "p50": "4:11", "p90": "4:31", "sub4_pct": 10, "capacity": {"p50": "4:07–4:08", "sub4_pct": "15–18", "note": "Panelce P10/P90 yazılmadı (D5: ±4 dk)."}, "minority": "C36 azınlığı (DA, NO, PO, VF, PS): plana bağlı sub-4 %8–9; itiraz tek sayı bildirilmesine. Tetik: T-C36.", "abc": [{"level": "Güvenli", "text": "6:10; her istasyonda 15 sn yürüme · km 21 2:12:30 · bitiş 4:26 · sub-4 %0 · ciddi yavaşlama ~%7. Zorunlu: 22 Eki ve sonrası ateşli ya da boyun altı hastalık (KT1-05); tek taraflı ≥3/10 >48 sa, noktasal kemik ağrısı ya da sekmede ağrı (Güvenli + Vomero, KT1-09); T2 hava; test C."}, {"level": "Sabır (varsayılan)", "text": "{MP} 5:50–6:05 · km 21 2:04:30–2:10:00 · bitiş 4:09:30–4:20:30 (yürüyüşlü; yürümesiz ~1:10 erken, C33 sporcu seçimi; K10/K21 ±30 sn) · sub-4 ~%1 · ciddi yavaşlama ~%13."}, {"level": "Güçlü bitiş", "text": "5:48; km 30–35 MP −5, km 35'ten sonra MP −10 · km 21 2:04:00 · bitiş 4:07 · sub-4 ~%2 · ciddi yavaşlama ~%18. Kapılar açılırsa. 'Güçlü bitiş sana 4:00'ı vermez, güçlü bir son 12 km verir.' Göğüs bandı yok, 20 Eki TT kalktı: ön şart A-ad -06)"]}, {"problem": "Hedef kayması (3:50 yarış tahmini çapası, sub-4 isteği)", "measures": ["İki sayı iki satır: plana bağlı %10, kapasite ~%15–18 (U1, C36)", "Yarış tahmini widget'ı kaldırılır; Sub-4 ayrı ek, niyet en geç 25 Eki (C35)", "18 Eki'den sonra yalnız aşağı yönlü (C10)", "S seansı yalnız önkoşullar tutarsa saatte; saatte ve kartta yalnız seçilen etiket (KT2-10); Sub-4 + R2 ya da R2 + yürümesiz seçilemez (KT3-10)"]}, {"problem": "Yarış haftası kaygısı ve readiness'e aşırı tepki (nocebo)", "measures": ["26 Eki'den readiness/HRV ekranı ve bildirimi sporcuya kapanır; panel izler, yalnız kırmızıyı bildirir (U35)", "Geçerli girdiler: hastalık, ateş, ağrı, uyku, migren"]}, {"problem": "Uygulama niyeti (eğer–o zaman)", "measures": ["11 cümleden en fazla 6'sı seçilir, kendi sözcükleriyle yazılır; son gün 9 Eki; yarış haftası her gün sesli okunur (U35)", "Örnek: EĞER km 10'dan önce 'çok rahat, açayım' dersem, O ZAMAN 'Para 30'da' derim ve sonraki km'yi bandın yavaş ucunda koşarım", "Parkur eki: 'Barbaros'ta adım kısa, fren yok' · 'Yenikapı'da yarışım başlıyor' · 'Dönüşte grup arkası'"]}, {"problem": "Koşu sonrası raporun eksik kalması", "measures": ["Uzun ve kalite sonrası 2 saat içinde 4 alanlı tek şablon: ağrı + yer · mide 0–10 · atlanan jel · serbest not; gerisi FIT'ten (KT2-08)", "Kolay koşuda yalnız ağrı", "Sporcuya günde ≤3 satır: Bugün / Fren / Dikkat; uygulama ≥%90, altında iki hafta → kural kartı 5 kurala iner (KT2-08)"]}, {"problem": "Kural yükü ve panele bağımlılık (sabah güncellemesi gelmezse)", "measures": ["Güncelleme 07:30'a kadar yoksa neden sorulmaz: kırmızı sayıları → koşu yok; ağrı ≥2, readiness <40, HRV BALANCED değil, Sarı-U ya da Sarı-S → kolay ≤45 dk; değilse plan (KT2-08, KT3-04)", "Test ve pik günlerinde güncelleme yoksa seans 24 sa kayar (KT2-08)", "Kritik günlerde güncelleme starttan ≥45 dk önce; hata verirse bildirim (KT3-04)"]}], "red_flags": [{"sign": "Kemik noktası ağrısı (kaval iç kenarı, ayak sırtı, naviküler, 2.–3. metatars), sekm  "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 11, "against": 0, "abstain": 0}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle km 19,5–27,5 kuralları yalnız 17 Eki YEDEK seansında geçerli; 30 km'de km 20–30 6:25–6:50, HR 152 üstü yavaşla, 6:10'dan hızlı tur → sonraki kapıda bitir. ≥2 ihlal → 18 Eki ön kilit bir bant aşağıdan (aynen); 20 Eki MP zaten iptal.", "triggers": []}, {"id": "KT1-02", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "13 Eki Kuvvet-A'dan yüklü baldır/soleus setleri çıkarılır; kalanlar leg press ≤45 kg 3×10, tek bacak köprü 3×12, yan plank/dead bug. Step-down (15 cm, 1×6/bacak) ve tibialis (1×12) 5 ve 12 Eki Kuvvet-B'ye vücut ağırlığıyla eklenir; 13 Eki'de 2 set, RIR ≥3. O hafta için 'Kuvvet-A DOMS'u Adios'a yazılmaz' istisnası kaldırılır. 16 Eki Adios kararı şu soruya bağlanır: '14 ve 15 Eki sabahı kriterler temiz mi ve 15 Eki akşam baldır testi iki tarafta eşit mi?'", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT1-03", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "A tetik 1 eşiği >23,1 km'den >22,3 km'ye çekilir (aşılırsa 17 Eki 25 km). H1 uyum kapısı: 6–10 Eki'de +0,3 km'yi aşan ≥2 koşu varsa 17 Eki otomatik 27 km / 2:50 olur. km 19,5 sonrası 8 km evden geçmeyen tek döngü olur ve tam 27,5 km'de kapıda biter. Pik GPS km'si >27,8 çıkarsa ihlal yazılır ve 24 Eki MP teyidi 6 km'den 4 km'ye iner.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle tetik 1/2 ve H1 uyum kapısı 30 km'nin ön şartıdır: tutmazsa YEDEK, yedeğin içinde bu kısaltmalar aynen (25 / 24 / 27 km).", "triggers": []}, {"id": "KT1-04", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Sabah kartının 4. maddesi (kemik noktası basma + 10 tek ayak sekme) 6–25 Eki arasında her koşu sabahı yapılır. Ferritin, hemogram ve 25-OH D vitamini 5–9 Eki arasında yaptırılır; öneri değil, H1 görevi. Birleşik eşik: E sarısı + herhangi bir noktasal hassasiyet → 48 sa koşu yok ve aynı hafta hekim. E sarısı tek başına bile olsa 17 Eki Adios bölümü yapılmaz. Naviküler basma testi 13, 17 ve 24 Eki'den sonra iki sabah üst üste yapılır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT1-05", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Ateş ya da boyun altı belirtiden sonra ilk MP/kalite en erken belirti başlangıcından 7 gün sonra; şart: aynı tempoda 2 kolay koşuda HR tabandan ≤+5 bpm. Bu süre 25 Eki'yi geçerse MP teyidi yapılmaz ve bant bir aşağı iner. Boyun altı belirti 31 Eki 18:00'de sürüyorsa start yok. Etiket kuralı derecelenir: boyun üstü, ateşsiz, 72 sa içinde düzelen → değişmez; yarışa ≤10 gün kala ateşli ya da boyun altı → en fazla Güvenli; yarışa ≤14 gün kala herhangi bir hastalıkta Güçlü bitiş ve Sub-4 kapanır. Sabah ateş ölçümü 22 Eki'de başlar. 29–30 Eki kapalı alanda maske öneri olur.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT1-06", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "10→11 Eki kayarsa: en fazla 20 km / 2:05; 13 Eki testi 14 Eki'ye kayar; o hafta Kuvvet-A yok. 17→18 Eki kayarsa: en fazla 24 km / 2:30, Adios bölümü yok; MP ön kilidi 19 Eki; 20 Eki MP 21 Eki'ye kayar ve iniş 2 iptal olur; 20 Eki Kuvvet-A iptal; ayakkabı kilidi 22 Eki. Migrende %80 kuralı aynı tavanlara bağlanır (H1 ≤20 km, H2 ≤22 km ve ≤2:15). H2'de ikinci kaydırma gerekirse pik iptal, etiket en fazla Sabır, telafi yok.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle: 17 Eki Pazar'a kayarsa 30 km yok, en fazla 24 km / 2:30; 20 Eki kolay 8 km aynen kalır.", "triggers": []}, {"id": "KT1-07", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Yarışta Adios şartları (hepsi): Adios birikimi ≥45 km, yorgun bacakta ≥8 km temiz bölüm, 13, 17 ve 24 Eki'nin 48. saat kontrollerinin üçü yeşil. Biri tutmazsa Vomero. C27 'değişim yok' seçilirse yarış varsayılanı Vomero olur; Adios ancak 24 ve 27 Eki yeşilse ve 25 Eki'de yazılı seçilirse. Yeni Vomero çifti 'gerekli' olur: ilk koşusu ≤10 Eki, 17 Eki dahil ≥40 km. K30 kapısına 'baldır sıkışması → MP +10 ve istasyonlarda 20 sn yürüme' satırı eklenir.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle 17 Eki Adios'suz → 'yorgun bacakta ≥8 km' şartı sağlanamaz; yarışta C27 'değişim yok' kuralı uygulanır (varsayılan Vomero; Adios ancak 24 ve 27 Eki yeşil + 25 Eki yazılı seçim). Entegratör eşlemesi; panel teyidi bekler. · KTS-07 ek şartları (≥14 km Adios, 24 Eki MP Adios'la, 15/15) geçerli.", "triggers": []}, {"id": "KT1-08", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "6 Eki akşam eksantrik baldır yalnız iki bacakla, 1×10; tek bacak eksantrik 13 Eki'ye kadar yok. İniş 1 en fazla 2×400 m. 9 Eki ön uyluk DOMS ≥2/10 ise 10 Eki 20 km olur (18 değil). 9 Eki akşam testinde taraflar karşılaştırılır: 15 tekrarı ağrısız tamamlayamayan taraf varsa ya da taraflar arasında ≥3 tekrar fark varsa doku kapısı sarı sayılır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT1-09", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "Yarış haftası ağrı karar ağacı: iki taraflı, kas gövdesinde, ≤2/10, ısınınca azalan → değişiklik yok. Tek taraflı ≥3/10 ve >48 sa, noktasal kemik ağrısı ya da sekmede ağrı → Güvenli + Vomero. Arada kalırsa 28 Eki'de 10 dk jog testi. H3 toplamı >43,5 km olursa aşan km 28 Eki'den düşülür. 25 Eki varsayılanı koşusuz olur. 31 Eki shakeout saatte 20 dk süre adımıyla biter.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT1-10", "topic": "Tur 5 · KT1 yamaları (yük, doku, sağlık, takvim)", "text": "B: 10 Eki 27 km için kapı (hepsi): 9 Eki toparlanma süresi ≤12 sa, HRV ≥67 iki gece, baldır testi iki tarafta eşit, 6–8 Eki ortalama HR ≤148. Biri tutmazsa 22 km ve iskelet A'ya döner. 28 km: yalnız H1 uyum kapısı temizse; 28,0 km'de seans biter, 2:55 sabit. A + aşılama (i): 15 Eki MP ≤4 km ve 13 Eki testi 2×4 km; (ii) önerilmez. TT: en erken 20 Eki 12:00 (olmazsa 21 Eki ve iniş 2 iptal); 20 Eki Kuvvet-A iptal; 18 Eki toparlanma süresi >54 sa ise TT yok.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · Sporcu seçimi (4 Eki): C11 TT isteğe bağlı (sporcu seçimi): TT seçilirse zamanlama kuralları aynen geçerli. · 30 km seçimiyle TT seçeneği kalktı; 28 km seçeneği konu dışı.", "user_choice": "C11 TT isteğe bağlı (sporcu seçimi): TT seçilirse zamanlama kuralları aynen geçerli.", "triggers": []}], "Tur 5 · KT2 yamaları (pik, test, saat, davranış)": [{"id": "KT2-01", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "2:55 = geçen süre (Adios değişimi dahil). Rota: km 0–19,5 kapıda biter; kalan 8 km evden 4 × (1 km git, 1 km dön), kapı geçişleri km 21,5/23,5/25,5/27,5. Kapıdan geçerken geçen süre 2:42:00'yi geçtiyse koşu biter. L9 ya da tetik 1/2 varsa koşu km 23,5 kapısında biter. 10 Eki hareket temposu >6:18 ise 17 Eki baştan 26–27 km yazılır. Km 19,5 sonrası adım notu: '2:42 geçtiyse kapıda bit'. Ölçüt: GPS km ≤27,8, geçen süre ≤2:55, km 19,5 sonrası tur ort. HR ≤155.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · 30 km seçimiyle rota km 0–20 döngü + 5 × 1 km git-dön (kapılar 22/24/26/28/30,0); 2:42 kuralı yerine 'geçen süre 3:10'u geçtiyse sonraki kapıda bit'. Bu yamanın 27,5 km rotası YEDEK seansta geçerli.", "triggers": []}, {"id": "KT2-02", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "16 Eki yazılı Adios kararına 4. soru: '8 Eki'de 6:15'ten hızlı tur ≤1 ve 13 Eki'de 5:47'den hızlı tur 0 mı?' Hayırsa Adios bölümü yok (C27 değişimsiz). Km 19,5 sonrası 8 adımın saat hedefi tempo 6:15–6:45, HR ≤155 fren. Km 19,5 sonrası herhangi bir tur 6:05'ten hızlıysa koşu bir sonraki kapı geçişinde biter. Ölçüt: km 19,5–27,5'te 6:05'ten hızlı tur sayısı 0.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C27 varsayılanı (evde Adios değişimi). · 30 km seçimiyle 16 Eki dört soru (Adios kararı) kalktı; 6:05 kuralı yerine 30 km'de 6:10'dan hızlı tur → sonraki kapıda bitir. YEDEK seansta yama aynen (Vomero).", "triggers": []}, {"id": "KT2-03", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "§12.1'e 'test koruma' bölümü. Testi kısaltan ya da kolaya çeviren tetik çıkarsa (T2, C16, S/D/H) test bir kez 14 Eki'ye kayar; 13 Eki 10 km kolay olur; o hafta Kuvvet-A yok (14→17 Eki ≥72 sa korunur). U sarısında test 2×3 km, aynı C9 tablosu, sonuç 'koşullu', A-aday açılamaz. Test hiç yapılamazsa MP = B (5:55), A-aday ve Güçlü bitiş kapalı, 24 Eki yalnız aşağı yönlü, K10_HR=163. 18 Eki kilit metni testin sürümünü (tam/kısaltılmış/kaymış/yok) tek satırda yazar.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT2-04", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Yarışta yedek Yeme alarmı kapalı, yalnız workout çökerse açılır; 'alındı' kuralı yarıştan çıkar. Bütün yarış adımlarında yavaş uç 12:00 (fiilen yavaş uyarısı yok). Antrenman ve yarışta tek protokol: 'hızlı' titreşimi → bu km bandın yavaş ucu; 3. ve 4. kademe sporcu kuralı olmaktan çıkar, panel FIT'ten sayar. 24 Eki MP bloğunda km 9 jeli 10–15 sn yürüyerek alınır. Bütçe: 24 Eki'de tempo uyarısı ≤1/5 km ve yavaş uyarısı 0; aşılırsa yarışta R2.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. Kapsam: C18 R1 (varsayılan). · Sporcu seçimi (4 Eki): C30 sporcu seçimiyle 24 Eki jelleri start + km 5 + km 10; MP bloğundaki km 5 jeli koşarken alınır (C33 yürümesiz). Diğer kısımlar aynen.", "user_choice": "C30 sporcu seçimiyle 24 Eki jelleri start + km 5 + km 10; MP bloğundaki km 5 jeli koşarken alınır (C33 yürümesiz). Diğer kısımlar aynen.", "triggers": []}, {"id": "KT2-05", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Ekran 2: Son tur ort. HR, Son tur süresi, Tur sayısı. HR ölçütü: 'K10 ve K11 tabelalarında son tur ort. HR > X'. K21'den 'son 3 tur' çıkar; yerine kart ±60 sn + RPE + 'son tur iki tabela üst üste MP+10'dan yavaş'. Göğüs bandı yoksa K10'un HR kolu kalkar. Saat start halısında başlatılır; fark varsa karta kalemle yazılır. Prova: 17 Eki km 10 ve 21, 24 Eki blok sonu; ölçüt 3/3 doğru, her biri ≤15 sn.", "status": "kabul (Tur 5) · sporcu seçimiyle güncellendi", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17. · Sporcu seçimi (4 Eki): C19 sporcu seçimi (bant yok): yarışta K10'un HR kolu kalkar, yalnız tabela süresi. Diğer kısımlar aynen.", "user_choice": "C19 sporcu seçimi (bant yok): yarışta K10'un HR kolu kalkar, yalnız tabela süresi. Diğer kısımlar aynen.", "triggers": []}, {"id": "KT2-06", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Ana ekrana 'Tur sayısı' alanı (N. tabelada basıştan sonra N+1). 24 Eki 14 km'nin tamamı K1–K14 notlu tur adımı olarak koşulur; ölçüt: kaçan ya da çift basış 0, ≥2 ise yarışta km bitişli yedek düzen. Dört R satırının yarış seansları 24–25 Eki'de yüklenir, her biri bir kez açılıp 43 adım doğrulanır, 30 Eki'de yalnız takvime atanır. Kayıp tabela: saatin km'si önceki tabelaya göre +1,2 olunca bas. workouts.py adım sayacı 24 Eki'den önce kapanır.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT2-07", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Rüzgâr K–KD ise (R0 ya da R1) km 11–25,8 adımlarında saatte hızlı uç = MP (−8 tolerans yok), not 'K14 Rüzgâr arkada: MP'. K21 asimetrik: karttan >30 sn öndeysen km 25,8'e kadar MP+5. Bilek kartına U dönüşü (25,8) kontrol süresi; dönüşte öndeysen ilk 5 km MP+5. Eğer–o zaman cümlesi 3 zorunlu olur. Ölçüt: K21 farkı ≤+30 sn; ikinci yarı/ilk yarı oranı kart oranının ≤+%3 üstünde.", "status": "kabul (Tur 5)", "vote": {"for": 9, "against": 0, "abstain": 2}, "why": "Kırmızı takım yaması; ≥7/11 kabul, veto yok. Uygulama ve uzlaştırma: nihai-plan.md §17.", "triggers": []}, {"id": "KT2-08", "topic": "Tur 5 · KT2 yamaları (pik, test, saat, davranış)", "text": "Sporcuya her gün ≤3 s  const wk0=mondayOf(M.today),race=(M.race||{}).date||'9999';
 const days=arr(M.days).filter(d=>d.week>=wk0&&d.date<=race),weeks=[...new Set(days.map(d=>d.week))];
 const rng=w=>{const e=addDays(w,6),a=fmtD(w),b=fmtD(e);return w.slice(5,7)===e.slice(5,7)?`${+w.slice(8)}–${b}`:`${a}–${b}`};
 const plan=weeks.map(w=>{const S=obj(M.week_sum[w]),ds=days.filter(d=>d.week===w);

 const g=obj(P.goal);
 el.innerHTML=today+plan+(g.p50?`<div class="s-goal">Hedef ~${esc(g.p50)}${g.p10&&g.p90?` · aralık ${esc(g.p10)}–${esc(g.p90)}`:''}</div>`:'');

function targetChips(t){t=obj(t);const c=[];const pr=t.primary;
 if(t.hr)c.push(`<span class="chip ${pr==='hr'?'cap':''}" title="${pr==='hr'?'birincil hedef':'ikincil'}">HR ${t.hr[0]}–${t.hr[1]}</span>`);
 if(t.pace)c.push(`<span class="chip ${pr==='pace'?'cap':''}" title="${pr==='pace'?'birincil hedef':'ikincil'}">${esc(t.pace[0])}–${esc(t.pace[1])} /km</span>`);
 if(pr&&!['hr','pace'].includes(pr))c.push(`<span class="chip cap" title="birincil hedef">${esc(pr)}</span>`);return c.join('')}
function mineChips(m){if(!m)return'';const c=[`<span class="chip kind">${esc(KL[m.kind]||m.kind)}</span>`];
 if(m.km_max>0)c.push(`<span class="chip cap">${m.km&&m.km!==m.km_max?m.km+' km · üst sınır '+m.km_max:'≤ '+m.km_max} km</span>`);
 else if(m.km>0)c.push(`<span class="chip cap">${m.km} km</span>`);else if(NONRUN.includes(m.kind))c.push(`<span class="chip">koşu yok</span>`);
 if(m.min)c.push(`<span class="chip">~${m.min} dk</span>`);
 return `<div class="chips">${c.join('')}${targetChips(m.targets)}</div>`}
function stepTxt(s){if(s==null)return '';if(typeof s!=='object')return esc(s);if(Array.isArray(s))return s.map(stepTxt).join(' · ');
 const rep=s.repeat??s.times??s.iterations??s.reps;const kids=Array.isArray(s.steps)?s.steps:null;
 const rng=v=>Array.isArray(v)?v.map(esc).join('–'):(v&&typeof v==='object'?Object.entries(v).map(([k,x])=>esc(k)+' '+rng(x)).join(' '):esc(v));
 const dur=[s.km!=null?esc(s.km)+' km':'',s.min!=null?esc(s.min)+' dk':'',s.sec!=null?esc(s.sec)+' sn':'',s.duration!=null?rng(s.duration):'',s.distance!=null?rng(s.distance):''].filter(Boolean).join(' ');
 const tg=s.target!=null?(typeof s.target==='object'?Object.entries(s.target).map(([k,v])=>esc(k)+' '+rng(v)).join(' · '):esc(s.target))
  :[s.hr!=null?'HR '+rng(s.hr):'',s.pace!=null?rng(s.pace)+' /km':''].filter(Boolean).join(' · ');
 const head=[esc(s.type||s.kind||s.step||''),dur,tg].filter(Boolean).join(' · ');
 const note=(s.note||s.notes)?` <span class="sub">“${esc(s.note||s.notes)}”</span>`:'';
 return `${rep?`<b>${esc(rep)}×</b> `:''}${head}${note}${kids?`<ol class="struct">${kids.map(k=>`<li>${stepTxt(k)}</li>`).join('')}</ol>`:''}`}
function watchBlock(w){if(!w)return '';const steps=Array.isArray(w)?w:arr(w.steps);const W=obj(w);
 return `<details class="more" style="margin:8px 0 0"><summary>⌚ Saat adımları${steps.length?` (${steps.length})`:''}${W.name?' · '+esc(W.name):''}</summary><div class="body">${W.description||W.desc?`<div class="sub">${esc(W.description||W.desc)}</div>`:''}${steps.length?`<ol class="struct">${steps.map(s=>`<li>${stepTxt(s)}</li>`).join('')}</ol>`:val(w)}</div></details>`}
function coachLine(day){return day.coach.filter(c=>c.source!=='mine').map(c=>{
 const km=c.est_km?` ${(+c.est_km).toFixed(1)} km`:'',mn=c.est_min?` · ${esc(c.est_min)} dk`:'';
 return `Coach: ${esc(c.name)}${km}${mn} <span class="pol" title="${esc(c.policy_note||'')}">→ ${esc(c.policy||'')}</span>`}).join('<br>')}
function mineGarmin(day){const g=day.coach.find(c=>c.source==='mine');return g?`<div class="garmin">⌚ Saatte: <b>${esc(g.name)}</b>${g.completed?' · tamamlandı ✓':''}</div>`:''}
function doneLine(day){const r=day.done.filter(a=>a.type==='running');const o=day.done.filter(a=>a.type!=='running');
 return r.map(a=>`<b>${a.km.toFixed(1)} km</b> · ${a.pace}/km · HR ${a.avg_hr??'-'}`).join('<br>')+(o.length?`<div class="sub">${o.map(a=>esc(a.name)+' '+Math.round(a.min)+' dk').join(' · ')}</div>`:'')}
const phaseOf=w=>arr(P.phases).find(p=>p.start<=w&&w<=(p.end||p.start));

  const line=L.polyline(rl,{color:C.s1,weight:4}).addTo(map);map.fitBounds(line.getBounds(),{padding:[10,10]});
  const near=km=>{const n=rl.length;return rl[Math.min(n-1,Math.round(km/c.route_len_km*(n-1)))]};
  arr(c.markers).forEach(([n,km])=>{if(/START|FINISH|DÖNÜŞ/.test(n))L.circleMarker(near(km),{radius:7,color:C.s8,fillColor:C.s8,fillOpacity:1}).addTo(map).bindTooltip(esc(n),{permanent:true,direction:'right'});else if(+n.replace('K','')%5===0)L.circleMarker(near(km),{radius:4,color:C.s1,fillOpacity:1}).addTo(map).bindTooltip(esc(n))});
  arr(c.aid).forEach(([km,n])=>{const col=String(n).includes('Sünger')?C.s4:C.s3;L.circleMarker(near(km),{radius:5,color:col,fillColor:col,fillOpacity:1}).addTo(map).bindTooltip(`${(+km).toFixed(1)} km — ${esc(n)}`)})}
 else document.getElementById('map').innerHTML='<div class="sub">Harita yüklenemedi.</div>';
 const es=arr(c.elev_series);chart(document.getElementById('c-ele'),{type:'line',data:{datasets:[{label:'m',data:es.map(p=>({x:p[0],y:p[1]})),borderColor:C.s1,backgroundColor:C.s1+'33',fill:true,pointRadius:0,tension:.2}]},
  options:{parsing:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>`km ${i[0].raw.x.toFixed(1)}`,label:i=>`${Math.round(i.raw.y)} m`}}},scales:{x:{type:'linear',min:0,max:Math.ceil((c.route_len_km||42.2)*10)/10,ticks:{stepSize:5},title:{display:true,text:'km'}},y:{min:0,title:{display:true,text:'m'}}}}});
};

/* ================= KÜTÜPHANE ================= */
R.kutuphane=el=>{
 // ---- Panel: meta, konu konu kararlar (oy + durum + azınlık + tetik), koç mesajları
 const pn=obj(P.panel);const meta=Object.fromEntries(Object.entries(pn).filter(([k])=>!['name','fixture'].includes(k)));
 const TGL={triggered:'TETİKLENDİ',clear:'tetiklenmedi',no_data:'veri yok',manual:'elle izlenir',scheduled:'tarihi gelmedi'};
 const trig=t=>`<div class="trg"><span class="tg ${esc(t.status)}">${TGL[t.status]||esc(t.status)}</span> <b>${esc(t.id)}</b> ${esc(t.text)}${t.check==='metric'?` <span class="sub">(${esc(MLBL[t.metric]||t.metric)} ${esc(t.op)} ${num(t.value)}${(t.days||1)>1?` · ${t.days} kayıt`:''}${t.current!=null?` · şu an ${num(t.current)}`:''})</span>`:''}</div>`;
 const vote=v=>v?`<span class="vote" title="lehte · aleyhte · çekimser">✓ ${num(v.for)} · ✗ ${num(v.against)} · ∅ ${num(v.abstain)}</span>`:'';
 const topics=Object.entries(M.decisions_by_topic||{});
 const decs=topics.map(([tp,ds])=>`<details class="more" open><summary>${esc(tp)} <span class="sub">(${ds.length})</span></summary><div class="body"><div class="card">${ds.map(d=>`<div class="dec"><div class="row"><b>${esc(d.id)}</b><span>${esc(d.text)}</span></div>
   <div class="row" style="margin-top:2px">${vote(d.vote)}<span class="pill">${esc(d.status)}</span></div>${d.why?`<div class="sub">${esc(d.why)}</div>`:''}
   ${d.minority||arr(d.triggers).length?`<div class="minority"><div class="sub"><b>Azınlık:</b> ${esc(d.minority||'—')}</div>${arr(d.triggers).map(trig).join('')}</div>`:''}</div>`).join('')}</div></div></details>`).join('');
 const cms=arr(P.coach_messages);
 const msgs=cms.length?`<div class="card"><h3>Koç mesajları (${cms.length})</h3>${cms.map(m=>typeof m==='string'?`<div class="msg">${esc(m)}</div>`:`<div class="msg">${m.expert?`<b>${esc(m.expert)}</b> · `:''}${m.date?`<b>${fmtD(m.date)}</b> · `:''}${esc(m.text||m.msg||'')}</div>`).join('')}</div>`:'';
 const orphan=arr(M.triggers).filter(t=>!t.decision&&!arr(P.decisions).some(d=>d.trigger===t.id));
 const panel=`<div class="card"><h3>Panel${pn.name?' · '+esc(pn.name):''}</h3>${val(meta)||'<div class="sub">—</div>'}<div class="sub" style="margin-top:6px">${arr(P.decisions).length} karar · ${arr(M.triggers).length} azınlık tetiği (${arr(M.triggers).filter(t=>t.status==='triggered').length} tetiklendi)</div></div>`
  +msgs+`<h3 class="eyebrow" style="margin:16px 2px 8px">Kararlar (konuya göre)</h3>`+(decs||'<div class="card sub">Karar yok.</div>')
  +(orphan.length?`<div class="card"><h3>Karara bağlı olmayan tetikler</h3>${orphan.map(trig).join('')}</div>`:'');
 // ---- araştırma
 const rs=M.research||[];const topicsR=[...new Set(rs.map(r=>r.topic))];
 const res=`<div class="card"><h3>Araştırma bulguları (${rs.length})</h3>${rs.length?`<div id="rf">${['Tümü',...topicsR].map((t,i)=>`<span class="pill f ${i===0?'on':''}" data-t="${esc(t)}">${esc(t)}</span>`).join('')}</div><div id="rl"></div>`:'<div class="sub">Henüz bulgu yok (data/research.json).</div>'}</div>`;
 const acts=`<details class="more"><summary>Tüm aktiviteler (Garmin, ${M.activities.length})</summary><div class="body tbl"><table><tr><th>Tarih</th><th>Aktivite</th><th>km</th><th>dk</th><th>Pace</th><th>HR</th><th>Not</th></tr>${M.activities.map(a=>`<tr><td>${fmtD(a.date)}</td><td>${esc(a.name)}</td><td>${a.km?a.km.toFixed(1):''}</td><td>${Math.round(a.min)}</td><td>${a.type==='running'&&a.km>0.3?pace(a.min/a.km):''}</td><td>${a.avg_hr??''}</td><td class="sub">${esc(a.note||'')}</td></tr>`).join('')}</table></div></details>`;
 const ap=M.apple||{};const am=arr(ap.monthly);
 const apple=`<details class="more"><summary>Apple Watch geçmişi${am.length?` (${esc(am[0].month)} – ${esc(am[am.length-1].month)})`:''}</summary><div class="body"><div class="card"><div class="tbl"><table><tr><th>Ay</th><th>km</th><th>Koşu</th><th>En uzun</th><th>HR ${M.pace_ref_hr}'de pace</th></tr>${am.map(m=>`<tr><td>${esc(m.month)}</td><td>${m.km}</td><td>${m.runs}</td><td>${m.longest_km}</td><td>${m.easy_ef_median?pace(1000/(m.easy_ef_median*M.pace_ref_hr)):'-'}</td></tr>`).join('')}</table></div>
  ${ap.race15k?`<div class="sub" style="margin-top:8px">15K (Apple): ${esc(ap.race15k.time)} · resmi pace ${esc(ap.race15k.pace_official)} · HR ${esc(ap.race15k.avg_hr)}</div>`:''}
  <h3 style="margin-top:10px">İşaretler</h3><ul class="tight">${arr(ap.flags).filter(f=>!/load_jump/.test(f.type)).map(f=>`<li class="sub">${fmtD(f.date_from)}${f.date_to!==f.date_from?'–'+fmtD(f.date_to):''}: ${esc(f.note)}</li>`).join('')}</ul></div></div></details>`;
 const gl=`<details class="more"><summary>Sözlük</summary><div class="body"><div class="card"><table>${arr(P.glossary).map(g=>Array.isArray(g)?`<tr><td><b>${esc(g[0])}</b></td><td class="sub">${esc(g[1])}</td></tr>`:`<tr><td><b>${esc(g.term)}</b></td><td class="sub">${esc(g.def)}</td></tr>`).join('')}</table></div></div></details>`;
 const lg=`<details class="more"><summary>Günlük notlar (${M.log.length})</summary><div class="body"><div class="card"><table>${M.log.map(l=>`<tr><td style="white-space:nowrap">${fmtD(l.date)}</td><td class="sub">${esc(l.note)}</td></tr>`).join('')}</table></div></div></details>`;
 el.innerHTML=panel+res+acts+apple+gl+lg;
 if(rs.length){const draw=t=>{document.getElementById('rl').innerHTML=rs.filter(r=>t==='Tümü'||r.topic===t).map(r=>`<div class="rc"><div class="lv">${esc(r.id)} · ${esc(r.topic)} · ${esc(r.level)}</div><div><b>${esc(r.claim)}</b></div><div class="sub">${arr(r.sources).map(s=>/^https?:\/\//i.test(s.url||'')?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)).join(' · ')}</div>${arr(r.cited_by).length?`<div class="sub">Atıf yapan kararlar: ${r.cited_by.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`:''}</div>`).join('')};draw('Tümü');
  document.querySelectorAll('#rf .pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('#rf .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');draw(p.dataset.t)})}
};

{const v=location.hash.slice(1);if(R[v])setMode('ayrintili',v);else setMode(v==='basit'?'basit':MODE)}
</script>
<div class="foot" id="foot"></div>
<script>document.getElementById('foot').textContent=`Kaynak: Garmin + Apple Watch geçmişi · plan: data/schedule.json + data/plan.json · üretim ${M.generated}`</script>
